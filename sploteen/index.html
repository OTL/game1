<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>スプロティーン</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0b1020;
    --p1:#ff7a1a;
    --p1dark:#c9530a;
    --p2:#3fa0ff;
    --p2dark:#1f6fd6;
    --text:#e9eefb;
    --sub:#9aa6cf;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    overflow:hidden; overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }
  /* HUDは上下端の薄い帯だけ。操作パッドはマップに重ねるオーバーレイにする */
  /* 右側の余白はSPボタン(自分側の縁・エイム側の角、幅54px+右10pxの位置に絶対配置)と文字が重ならないよう広めに確保する。
     hudTopは要素ごと180度回転するため、この「右」の余白は画面上では左側(SPボタン側)に来る */
  .hud{ flex:0 0 48px; height:48px; min-height:48px; display:flex; align-items:center; gap:6px; padding:3px 72px 3px 10px; position:relative; z-index:6; background:rgba(5,8,18,0.55); }
  .hud.hudTop{ transform:rotate(180deg); }
  #mapArea{ position:relative; flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#05070f; }
  /* 操作ゾーンのオーバーレイ: 自分側の縁から画面高さの30%、マップに重ねて表示する */
  .padOverlay{ position:absolute; left:0; right:0; height:30%; display:flex; z-index:15; }
  .padOverlay.p2{ top:0; transform:rotate(180deg); }
  .padOverlay.p1{ bottom:0; }
  .padOverlay::before{ /* 帯の存在を示すうっすらとした境界線 */
    content:""; position:absolute; top:0; left:6%; right:6%; height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.16),transparent); pointer-events:none;
  }
  .padzone{ flex:1 1 50%; position:relative; touch-action:none; }
  .padzone.move{ background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05), transparent 70%); }
  .padzone.aim{ background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.04), transparent 70%); }
  .padzone::after{
    content:""; position:absolute; left:50%; top:50%; width:64px; height:64px;
    margin:-32px 0 0 -32px; border:2px dashed rgba(255,255,255,0.16); border-radius:50%; pointer-events:none;
    transition:opacity 0.4s;
  }
  .padzone.touched::after{ opacity:0; }
  .stick{
    position:fixed; width:70px; height:70px; margin:-35px 0 0 -35px; border-radius:50%;
    background:rgba(255,255,255,0.16); border:2px solid rgba(255,255,255,0.35);
    pointer-events:none; display:none; z-index:20;
  }
  .stick.knob{ width:34px; height:34px; margin:-17px 0 0 -17px; background:rgba(255,255,255,0.55); }
  .specialBtn{
    position:absolute; right:10px; bottom:10px;
    width:54px; height:54px; border-radius:50%; border:2px solid #ffe08a; background:#3a2e08;
    color:#ffe08a; font-weight:700; font-size:12px; line-height:1.2; padding:0;
  }
  .specialBtn.ready{ background:#ffcc4d; color:#231600; box-shadow:0 0 14px 4px rgba(255,204,77,0.7); }
  .subBtn{
    position:absolute; right:74px; bottom:10px;
    width:54px; height:54px; border-radius:50%; border:2px solid #7ad6ff; background:#0e2a3a;
    color:#eafcff; font-weight:700; font-size:20px; line-height:1; padding:0; opacity:0.55;
  }
  .subBtn.avail{ opacity:1; box-shadow:0 0 10px 3px rgba(122,214,255,0.5); }
  .subBtn .subCd{ position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,0.55); }
  .wIcon{ font-size:22px; width:28px; text-align:center; flex:0 0 auto; }
  .barCol{ display:flex; flex-direction:column; gap:3px; flex:1 1 auto; min-width:0; }
  .bar{ position:relative; height:9px; border-radius:5px; background:rgba(255,255,255,0.12); overflow:hidden; flex:1 1 auto; border:1px solid rgba(255,255,255,0.18); }
  .bar.sp{ flex:0 0 40%; height:12px; }
  .bar i{ position:absolute; left:0; top:0; bottom:0; width:0%; display:block; border-radius:5px; }
  .hud[data-player="1"] .bar.hp i{ background:linear-gradient(90deg,#8a1d1d,#ff5252); }
  .hud[data-player="2"] .bar.hp i{ background:linear-gradient(90deg,#8a1d1d,#ff5252); }
  .hud[data-player="1"] .bar.ink i{ background:linear-gradient(90deg,var(--p1dark),var(--p1)); }
  .hud[data-player="2"] .bar.ink i{ background:linear-gradient(90deg,var(--p2dark),var(--p2)); }
  .bar.sp i{ background:linear-gradient(90deg,#ffb238,#ffe08a); }
  .bar.sp.full i{ box-shadow:0 0 10px 2px #ffe08a; }
  .barRow{ display:flex; align-items:center; gap:8px; flex:1 1 auto; min-width:0; }
  .hpTxt{ font-size:13px; font-weight:700; color:var(--sub); flex:0 0 auto; width:128px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .killTxt{ font-size:15px; font-weight:700; color:#ffcf7a; flex:0 0 auto; white-space:nowrap; }
  .hudToast{
    position:absolute; left:50%; top:-2px; transform:translate(-50%,-100%);
    font-size:13px; font-weight:800; padding:2px 10px; border-radius:8px;
    background:rgba(10,14,28,0.85); pointer-events:none; opacity:0; white-space:nowrap;
    transition:opacity 0.25s;
  }
  .hudToast.show{ opacity:1; }
  .hudToast.dead{ color:#ff8a8a; }
  .hudToast.kill{ color:#ffe08a; }
  #gameCanvas{ display:block; touch-action:none; background:#1c2340; box-shadow:0 0 0 2px #2b3866, 0 10px 30px rgba(0,0,0,0.5); border-radius:6px; }
  .timer{ position:absolute; left:50%; transform:translateX(-50%); font-size:15px; font-weight:700; color:#cfd8f5; background:rgba(6,10,22,0.55); padding:2px 12px; border-radius:10px; letter-spacing:0.05em; pointer-events:none; }
  .timer.top{ top:6px; transform:translateX(-50%) rotate(180deg); }
  .timer.bottom{ bottom:6px; }
  #bigCount{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:min(22vw,140px); font-weight:800; color:#ff5252; text-shadow:0 0 24px rgba(255,82,82,0.9); pointer-events:none; opacity:0; }
  #flashTint{ position:absolute; inset:0; background:#ff2b2b; opacity:0; pointer-events:none; mix-blend-mode:screen; }
  #countdownWrap{ position:absolute; inset:0; pointer-events:none; }
  .cdNum{ position:absolute; left:50%; width:100%; text-align:center; transform:translate(-50%,-50%); font-size:min(20vw,110px); font-weight:800; color:#ffe08a; text-shadow:0 0 20px rgba(255,224,138,0.8); }
  .cdNum.cdTop{ top:32%; transform:translate(-50%,-50%) rotate(180deg); }
  .cdNum.cdBottom{ top:68%; }
  #overlay{ position:absolute; inset:0; pointer-events:none; z-index:30; }
  .panel{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:rgba(6,10,22,0.92); pointer-events:none; }
  .panel.show{ display:flex; pointer-events:auto; }
  .titleLogo{ font-size:min(13vw,54px); font-weight:800; letter-spacing:0.08em; background:linear-gradient(90deg,var(--p1),var(--p2)); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 6px 24px rgba(0,0,0,0.4); }
  .titleSub{ margin-top:14px; font-size:15px; color:var(--sub); animation:blink 1.4s infinite; }
  .modeRow{ margin-top:26px; display:flex; flex-direction:column; gap:14px; align-items:center; }
  .modeBtn{ width:min(78vw,320px); padding:14px 20px; font-size:15px; }
  .modeBtn.cpu{ background:#57e08a; }
  .cpuPanel{ display:flex; flex-direction:column; align-items:center; gap:2px; margin:0; padding:3px 8px; background:rgba(255,255,255,0.04); border-radius:10px; }
  .weaponRow.small .wCard{ padding:4px 2px; min-height:44px; }
  .weaponRow.small .wEmoji{ font-size:17px; }
  .weaponRow.small .wName{ font-size:10px; }
  .cpuPanel .weaponRow{ max-width:340px; }
  .cpuPanel .weaponRow.subRow{ max-width:260px; }
  .cpuPanel .weaponRow.specialRow{ max-width:220px; }
  .diffRow{ display:flex; gap:8px; }
  .diffBtn{ font:inherit; font-size:11px; padding:4px 12px; border-radius:999px; border:2px solid #2b3866; background:#161c34; color:var(--text); cursor:pointer; }
  .diffBtn.selected{ border-color:#57e08a; background:#123a22; color:#bdf5d3; }
  .weaponRow.readOnly{ pointer-events:none; opacity:0.75; }
  .selGroup{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  #panelSelect{ flex-direction:column; padding:0; }
  .selectHalf{ position:relative; flex:1 1 50%; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:4px 8px; min-height:0; overflow:hidden; }
  .selectHalf.rot{ transform:rotate(180deg); }
  .selectHalf.ready{ background:rgba(255,255,255,0.04); }
  .selLabel{ font-size:13px; color:var(--sub); }
  .weaponRow{ display:flex; gap:8px; width:100%; max-width:520px; justify-content:center; }
  .wCard{ flex:1 1 0; max-width:150px; min-width:56px; min-height:48px; background:#161c34; border:2px solid #2b3866; border-radius:12px; padding:6px 4px; color:var(--text); font:inherit; cursor:pointer; }
  .wCard .wEmoji{ font-size:26px; }
  .wCard .wName{ font-size:13px; font-weight:700; margin-top:2px; }
  .wCard.selected{ border-color:#ffcc4d; background:#2a2410; }
  .weaponRow.subRow{ max-width:400px; }
  .weaponRow.subRow .wCard{ min-height:56px; padding:4px 2px; }
  .weaponRow.specialRow{ max-width:420px; }
  .weaponRow.specialRow .wCard{ min-height:56px; padding:4px 2px; }
  .wDesc{ font-size:10px; color:var(--sub); min-height:11px; max-width:90vw; line-height:1.15; }
  .wDesc.subDesc{ color:#8fd8ff; }
  .readyBtn{ font:inherit; font-weight:700; color:#1a1206; background:#8fa2ff; border:none; border-radius:999px; padding:9px 22px; cursor:pointer; }
  .readyBtn.on{ background:#57e08a; }
  .selectHalf .readyBtn{ padding:6px 20px; }
  /* アバター(第6ラウンド) */
  .avatarBtn{ display:flex; align-items:center; gap:6px; font:inherit; font-size:11px; padding:3px 10px 3px 3px; border-radius:999px; border:2px solid #7ad6ff; background:#0e2a3a; color:#eafcff; cursor:pointer; }
  .avatarFaceCanvas{ width:26px; height:26px; border-radius:50%; background:#1c2340; display:block; }
  .avatarEditor{ position:absolute; inset:0; background:rgba(6,10,22,0.97); z-index:25; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:3px; padding:8px; overflow-y:auto; }
  .avatarPreviewCanvas{ width:min(30vw,120px); height:min(30vw,120px); background:#1c2340; border-radius:14px; border:2px solid #2b3866; flex:0 0 auto; }
  .avatarNameInput{ font:inherit; font-size:13px; width:150px; text-align:center; border-radius:8px; border:2px solid #2b3866; background:#161c34; color:var(--text); padding:4px; margin:2px 0; }
  .avatarCatRow{ display:flex; flex-wrap:wrap; gap:4px; justify-content:center; max-width:min(94vw,440px); margin-bottom:2px; }
  .avatarSwatch{ width:26px; height:26px; border-radius:7px; border:2px solid #2b3866; cursor:pointer; padding:0; }
  .avatarSwatch.selected{ border-color:#ffcc4d; box-shadow:0 0 6px 2px rgba(255,204,77,0.6); }
  .avatarLabelBtn{ font:inherit; font-size:11px; padding:5px 8px; border-radius:8px; border:2px solid #2b3866; background:#161c34; color:var(--text); cursor:pointer; }
  .avatarLabelBtn.selected{ border-color:#ffcc4d; background:#2a2410; }
  .avatarBtnRow{ display:flex; gap:10px; margin-top:4px; }
  @media (orientation:landscape){
    .avatarEditor{ flex-direction:row; flex-wrap:wrap; align-content:flex-start; justify-content:center; gap:4px 10px; }
    .avatarEditor > .selLabel{ flex:0 0 100%; margin:2px 0 -2px; }
    .avatarPreviewCanvas{ flex:0 0 auto; }
    .avatarBtnRow{ flex:0 0 100%; justify-content:center; }
  }
  #panelResult{ gap:14px; }
  .wipeStage{ position:relative; width:min(88vw,420px); }
  .wipeBarBg{ display:flex; width:100%; height:26px; border-radius:13px; overflow:hidden; background:#141a30; border:2px solid #2b3866; }
  .wipeFillP1{ height:100%; width:50%; background:var(--p1); transition:width 1.1s cubic-bezier(.2,.8,.2,1); }
  .wipeFillP2{ height:100%; width:50%; background:var(--p2); transition:width 1.1s cubic-bezier(.2,.8,.2,1); }
  .rollerIcon{ position:absolute; top:50%; left:0; transform:translate(-50%,-50%); font-size:26px; transition:left 1.1s cubic-bezier(.2,.8,.2,1); }
  .resultText{ font-size:18px; font-weight:700; line-height:1.6; }
  .resultText .win1{ color:var(--p1); }
  .resultText .win2{ color:var(--p2); }
  .killSummary{ display:flex; gap:18px; font-size:13px; color:var(--sub); }
  .killSummary b.p1{ color:var(--p1); } .killSummary b.p2{ color:var(--p2); }
  .seriesDots{ display:flex; gap:8px; }
  .seriesDots span{ width:16px; height:16px; border-radius:50%; background:#222846; border:2px solid #3a4270; }
  .seriesDots span.p1{ background:var(--p1); border-color:var(--p1); }
  .seriesDots span.p2{ background:var(--p2); border-color:var(--p2); }
  .nextBtn{ font:inherit; font-weight:700; color:#1a1206; background:#ffcc4d; border:none; border-radius:999px; padding:11px 28px; cursor:pointer; }
  .nextBtn.no{ background:#3a4270; color:var(--text); }
  /* 第7ラウンド: リセットボタン(マップ外の左端中央、上下の操作パッド帯から離した位置)。誤タップ防止に半透明 */
  .resetBtn{
    position:absolute; left:6px; top:50%; transform:translateY(-50%);
    width:40px; height:40px; border-radius:50%; z-index:32;
    border:2px solid rgba(255,255,255,0.4); background:rgba(255,255,255,0.16);
    color:var(--text); font-size:20px; line-height:1; padding:0; opacity:0.55;
  }
  .resetBtn:active{ opacity:0.9; }
  #resetConfirm{
    position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
    align-items:center; justify-content:space-between; padding:15vh 24px;
    background:rgba(6,10,22,0.94); text-align:center;
  }
  .resetMsg{ font-size:18px; font-weight:700; }
  .resetMsg.top{ transform:rotate(180deg); }
  .resetBtnRow{ display:flex; gap:24px; }
  .champTitle{ font-size:min(9vw,34px); font-weight:800; color:#ffe08a; margin-bottom:18px; }
  /* 第7ラウンド: HUDの顔アイコン(32px程度、アバターの顔だけを描く) */
  .hudFace{ width:32px; height:32px; border-radius:50%; background:#1c2340; border:1px solid rgba(255,255,255,0.25); flex:0 0 auto; }
  /* 第7ラウンド: VS画面(カウントダウン前1.2秒。P1向き下・P2向き上180度回転) */
  #vsWrap{ position:absolute; inset:0; z-index:18; pointer-events:none; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:6% 0; }
  .vsCard{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .vsCard.vsTop{ transform:rotate(180deg); }
  .vsAvatarCanvas{ width:min(30vw,120px); height:min(30vw,120px); }
  .vsName{ font-size:15px; font-weight:800; color:var(--text); text-shadow:0 2px 6px rgba(0,0,0,0.7); }
  .vsWeapon{ font-size:12px; color:var(--sub); }
  .vsLabel{ font-size:min(15vw,64px); font-weight:900; color:#ffcc4d; text-shadow:0 4px 16px rgba(0,0,0,0.7); }
  /* 第7ラウンド: 結果画面・優勝画面の対戦アバター(勝った側を大きく・はねる。P2側は180度回転) */
  .duelAvatars{ display:flex; align-items:flex-end; justify-content:center; gap:22px; min-height:132px; }
  .duelAvatarWrap.flip{ transform:rotate(180deg); }
  .duelAvatar{ display:block; width:64px; height:64px; transition:width 0.25s, height 0.25s, opacity 0.25s; }
  .duelAvatar.big{ width:120px; height:120px; }
  .duelAvatar.small{ width:56px; height:56px; opacity:0.6; }
  @keyframes avatarBounce{ 0%{ transform:translateY(0); } 30%{ transform:translateY(-16px); } 55%{ transform:translateY(0); } 75%{ transform:translateY(-7px); } 100%{ transform:translateY(0); } }
  .duelAvatar.bounce{ animation:avatarBounce 0.9s ease-out 1; }
  .hidden{ display:none!important; }
  /* 横持ち(幅>高さ)では縦に積まず、メイン/サブ/CPUパネルを横に並べて縦スペースを節約する。
     (このブロックは他の.selectHalf/.cpuPanelルールより後ろに置き、flex-directionの上書きを確実にする) */
  @media (orientation:landscape){
    .selectHalf{ flex-direction:row; flex-wrap:wrap; align-content:center; gap:4px 16px; }
    .selectHalf > .selLabel{ flex:0 0 100%; }
    .selectHalf > .readyBtn{ flex:0 0 auto; margin-top:2px; }
    .cpuPanel{ flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px 10px; margin:0; }
    .cpuPanel > .selLabel{ flex:0 0 100%; font-size:11px; }
  }
</style>
</head>
<body>
<div id="app">
  <button id="resetBtn" class="resetBtn hidden" title="さいしょから やりなおす">↺</button>
  <div class="hud hudTop" id="hudP2" data-player="2">
    <canvas class="hudFace" id="hudFaceP2" width="64" height="64"></canvas>
    <div class="wIcon" id="wIconP2">🔫</div>
    <div class="barCol">
      <div class="barRow"><div class="bar hp"><i id="hpFillP2"></i></div><div class="bar sp" id="spBarP2"><i id="spFillP2"></i></div></div>
      <div class="barRow"><div class="bar ink"><i id="inkFillP2"></i></div><div class="hpTxt" id="hpP2">100</div><div class="killTxt" id="killP2">たおした 0</div></div>
    </div>
    <div class="hudToast" id="hudToastP2"></div>
  </div>

  <div id="mapArea">
    <canvas id="gameCanvas"></canvas>
    <div class="timer top" id="timerTop">90</div>
    <div class="timer bottom" id="timerBottom">90</div>
    <div id="countdownWrap" class="hidden">
      <div class="cdNum cdTop" id="cdNumTop"></div>
      <div class="cdNum cdBottom" id="cdNumBottom"></div>
    </div>
    <div id="vsWrap" class="hidden">
      <div class="vsCard vsTop">
        <canvas class="vsAvatarCanvas" id="vsAvatarP2" width="200" height="200"></canvas>
        <div class="vsName" id="vsNameP2"></div>
        <div class="vsWeapon" id="vsWeaponP2"></div>
      </div>
      <div class="vsLabel">VS</div>
      <div class="vsCard vsBottom">
        <canvas class="vsAvatarCanvas" id="vsAvatarP1" width="200" height="200"></canvas>
        <div class="vsName" id="vsNameP1"></div>
        <div class="vsWeapon" id="vsWeaponP1"></div>
      </div>
    </div>
    <div id="bigCount"></div>
    <div id="flashTint"></div>
  </div>

  <div class="hud hudBottom" id="hudP1" data-player="1">
    <div class="wIcon" id="wIconP1">🔫</div>
    <div class="barCol">
      <div class="barRow"><div class="bar hp"><i id="hpFillP1"></i></div><div class="bar sp" id="spBarP1"><i id="spFillP1"></i></div></div>
      <div class="barRow"><div class="bar ink"><i id="inkFillP1"></i></div><div class="hpTxt" id="hpP1">100</div><div class="killTxt" id="killP1">たおした 0</div></div>
    </div>
    <div class="hudToast" id="hudToastP1"></div>
  </div>

  <div class="padOverlay p2">
    <div class="padzone move" data-player="2" data-kind="move"></div>
    <div class="padzone aim" data-player="2" data-kind="aim">
      <button class="specialBtn" data-player="2" id="spBtnP2">SP</button>
      <button class="subBtn" data-player="2" id="subBtnP2">💣</button>
    </div>
  </div>
  <div class="padOverlay p1">
    <div class="padzone move" data-player="1" data-kind="move"></div>
    <div class="padzone aim" data-player="1" data-kind="aim">
      <button class="specialBtn" data-player="1" id="spBtnP1">SP</button>
      <button class="subBtn" data-player="1" id="subBtnP1">💣</button>
    </div>
  </div>

  <div id="overlay">
    <div class="panel show" id="panelTitle">
      <div class="titleLogo">スプロティーン</div>
      <div class="modeRow">
        <button class="readyBtn modeBtn" id="modeBtnPvp">ふたりで たいせん</button>
        <button class="readyBtn modeBtn cpu" id="modeBtnCpu">ひとりで れんしゅう (CPU)</button>
      </div>
    </div>

    <div class="panel" id="panelSelect">
      <div class="selectHalf rot" data-half="2">
        <div class="selLabel" id="labelP2">P2 (うえ) ぶきをえらぼう</div>

    botMinUnpainted:9, // ボットが設置に踏み切る未塗りセル数のしきい値(既定4。置く場所を選ばせるため第9ラウンドで9に)

/* ==================== 2. 決定論的PRNG (mulberry32) ==================== */
function mulberry32(seed){
  var a = seed>>>0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a>>>15), 1 | a);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14)) >>> 0) / 4294967296;
  };
}

/* ==================== 3. ゲーム状態生成 ==================== */
function makePlayer(idx){
  return {
    idx:idx, weapon:'shooter', sub:'splashbomb', special:'sensei', x:0, y:0, radius:PLAYER_RADIUS,
    hp:100, ink:INK_MAX, alive:true, invuln:0, respawnTimer:0,
    angle: idx===0 ? -Math.PI/2 : Math.PI/2,
    sp:0, charge:0, charging:false, specialActive:false, specialData:{},
    status:{frozenTimer:0, hakkoTimer:0, aburiTimer:0, aburiOwner:null}, // こおり/はっこう/あぶり(第6ラウンド)
    fireCooldown:0, swingCooldown:0, contactCooldown:0, subCooldown:0, rollDist:0, hitFlash:0, hudToast:null,
    rolling:false, // 第7ラウンド: ローラーが転がしモード(fire押下)中かどうか(見た目のローラー棒の表示用)
    wasFiring:false, fireHeldStart:0, wasSpecial:false, wasSub:false,
    isBot:false, forced:null, lastInkSpendAt:-1e9, // 第6ラウンド: 人間専用インク経済の「最後に消費した時刻」(ボットは参照しない)
    input:{move:{x:0,y:0}, aim:{x:0,y:0}, fire:false, special:false, sub:false},
    stats:{paintedCells:0, specials:0, kills:0, subsUsed:0, statusHits:0},
    botMem:{ nextDecision:0, dir:{x:0,y:1} },
  };
}

function buildWallGrid(grid){
  var wallCount=0;
  for (var i=0;i<WALLS_CELL.length;i++){
    var w=WALLS_CELL[i];
    for (var cy=w[1]; cy<w[1]+w[3]; cy++){
      for (var cx=w[0]; cx<w[0]+w[2]; cx++){
        grid[cy*GRID_W+cx]=9; wallCount++;
      }
    }
  }
  return wallCount;
}

function createGame(opts){
  opts = opts||{};
  var g = {};
  g.headless = !!opts.headless;
  g.live = !!opts.live;
  g.rng = mulberry32((opts.seed>>>0) || 1);
  g.grid = new Uint8Array(GRID_W*GRID_H);
  g.wallCount = buildWallGrid(g.grid);
  g.wallsPx = WALLS_CELL.map(function(w){ return {x:w[0]*CELL, y:w[1]*CELL, w:w[2]*CELL, h:w[3]*CELL}; });
  g.counts = [0,0];
  g.bullets = [];
  g.particles = [];
  g.subThrows = [];     // スプラッシュボム/クイックボムの投擲物(放物線移動)
  g.sprinklers = [];    // 設置中のスプリンクラー { ownerIdx, x, y, timer, hp }
  g.shields = [];       // 設置中のスプラッシュシールド { ownerIdx, cx, cy, dx, dy, halfLen, thickness, timer }
  g.popups = [];        // やられた!/たおした! のポップアップ演出(描画専用)
  g.shakeTimer = 0; g.shakeMag = 0; // 画面の軽い揺れ演出
  g.time = 0; g.acc = 0;
  g.duration = ROUND_DURATION_DEFAULT;
  g.remaining = g.duration;
  g.phase = 'idle'; // idle/title/select/countdown/playing/roundResult/seriesResult
  g.countdown = 0;
  g.seriesScore = [0,0];
  g.roundResults = [];
  g.lastRoundLoserIdx = null;
  g.players = [ makePlayer(0), makePlayer(1) ];
  if (!g.headless){
    g.inkCanvas = document.createElement('canvas');
    g.inkCanvas.width = WORLD_W*INK_SCALE;
    g.inkCanvas.height = WORLD_H*INK_SCALE;
    g.inkCtx = g.inkCanvas.getContext('2d');
    g.inkCtx.setTransform(INK_SCALE,0,0,INK_SCALE,0,0);
  }
  return g;
}

function configurePlayers(g,p1w,p2w,bot1,bot2,p1sub,p2sub,p1sp,p2sp){
  if (!WEAPONS[p1w]) p1w='shooter';
  if (!WEAPONS[p2w]) p2w='shooter';
  if (!SUBS[p1sub]) p1sub=WEAPONS[p1w].defaultSub;
  if (!SUBS[p2sub]) p2sub=WEAPONS[p2w].defaultSub;
  if (!SPECIALS[p1sp]) p1sp=WEAPONS[p1w].defaultSpecial;
  if (!SPECIALS[p2sp]) p2sp=WEAPONS[p2w].defaultSpecial;
  g.players[0].weapon=p1w; g.players[1].weapon=p2w;
  g.players[0].sub=p1sub; g.players[1].sub=p2sub;
  g.players[0].special=p1sp; g.players[1].special=p2sp;
  g.players[0].isBot=!!bot1; g.players[1].isBot=!!bot2;
}

function startRound(g, handicapLoserIdx){
  g.grid.fill(0);
  buildWallGrid(g.grid);
  g.counts=[0,0];
  g.bullets.length=0; g.particles.length=0;
  g.subThrows.length=0; g.sprinklers.length=0; g.shields.length=0;
  g.popups.length=0; g.shakeTimer=0; g.shakeMag=0;
  if (!g.headless) g.inkCtx.clearRect(0,0,WORLD_W,WORLD_H);
  for (var i=0;i<2;i++){
    var p=g.players[i];
    p.x=SPAWN[i].x; p.y=SPAWN[i].y;
    p.hp=100; p.ink=INK_MAX; p.alive=true; p.invuln=0; p.respawnTimer=0;
    p.angle = i===0 ? -Math.PI/2 : Math.PI/2;
    p.charge=0; p.charging=false; p.specialActive=false; p.specialData={};
    p.status={frozenTimer:0, hakkoTimer:0, aburiTimer:0, aburiOwner:null};
    p.fireCooldown=0; p.swingCooldown=0; p.contactCooldown=0; p.subCooldown=0; p.rollDist=0; p.hitFlash=0; p.hudToast=null;
    p.wasFiring=false; p.wasSpecial=false; p.wasSub=false;
    p.lastInkSpendAt=-1e9; // 第6ラウンド: ラウンド開始時点では回復開始条件を満たしておく
    p.sp = (handicapLoserIdx===i) ? Math.round(SPECIAL_GAUGE_MAX*0.5) : 0;
    p.stats={paintedCells:0, specials:0, kills:0, subsUsed:0, statusHits:0};
    p.botMem={ nextDecision:0, dir:{x:0, y:(i===0?-1:1)} };
  }
  g.time=0; g.remaining=g.duration;
  g.phase='countdown'; g.countdown=3.999; g.vsTimer=VS_DURATION;
}

function startSeries(g,p1w,p2w,seed,bot1,bot2,duration,p1sub,p2sub,p1sp,p2sp){
  g.rng = mulberry32((seed>>>0) || 1);
  g.duration = duration || ROUND_DURATION_DEFAULT;
  configurePlayers(g,p1w,p2w,bot1,bot2,p1sub,p2sub,p1sp,p2sp);
  g.seriesScore=[0,0]; g.roundResults=[]; g.lastRoundLoserIdx=null;
  startRound(g, null);
}

/* ==================== 4. 物理・塗り ==================== */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function cellAt(g,wx,wy){
  var cx = Math.floor(wx/CELL), cy = Math.floor(wy/CELL);
  if (cx<0||cx>=GRID_W||cy<0||cy>=GRID_H) return 9;
  return g.grid[cy*GRID_W+cx];
}
function isWallAt(g,wx,wy){ return cellAt(g,wx,wy)===9; }

function isInvulnerable(p){
  return p.invuln>0 || (p.specialActive && p.special==='manta');
}

// 状態異常(こおり/はっこう/あぶり)を付与する。stats.statusHitsは「新規に発生した回数」だけ数える
// (毎ティック延長するウツボのはっこう等で水増しされないよう、既に付いていた場合はカウントしない)
function applyStatus(g, ownerIdx, target, kind, duration){
  var field = kind+'Timer';
  var wasActive = target.status[field] > 0;
  target.status[field] = duration;
  if (kind==='aburi') target.status.aburiOwner = ownerIdx;
  if (!wasActive) g.players[ownerIdx].stats.statusHits++;
}

function drawInkBrush(g,wx,wy,r,owner){
  var ctx=g.inkCtx;
  ctx.fillStyle = owner===1 ? COLOR.p1 : COLOR.p2;
  ctx.beginPath();
  ctx.arc(wx,wy,r*1.05,0,Math.PI*2);
  ctx.fill();
}

// 円ブラシで塗る。グリッドは判定専用、見た目はオフスクリーンcanvasに丸で蓄積する
function paintCircle(g, wx, wy, radiusPx, owner){
  if (radiusPx<=0) return 0;
  var r2=radiusPx*radiusPx;
  var minCx=Math.max(0,Math.floor((wx-radiusPx)/CELL));
  var maxCx=Math.min(GRID_W-1,Math.floor((wx+radiusPx)/CELL));
  var minCy=Math.max(0,Math.floor((wy-radiusPx)/CELL));
  var maxCy=Math.min(GRID_H-1,Math.floor((wy+radiusPx)/CELL));
  var painted=0;
  for (var cy=minCy; cy<=maxCy; cy++){
    for (var cx=minCx; cx<=maxCx; cx++){
      var idx=cy*GRID_W+cx;
      var cell=g.grid[idx];
      if (cell===9) continue;
      var ccx=(cx+0.5)*CELL, ccy=(cy+0.5)*CELL;
      var dx=ccx-wx, dy=ccy-wy;
      if (dx*dx+dy*dy<=r2 && cell!==owner){
        if (cell===1) g.counts[0]--; else if (cell===2) g.counts[1]--;
        g.grid[idx]=owner;
        if (owner===1) g.counts[0]++; else g.counts[1]++;
        painted++;
      }
    }
  }
  if (painted>0){
    var pl=g.players[owner-1];
    pl.sp=Math.min(SPECIAL_GAUGE_MAX, pl.sp+painted);
    pl.stats.paintedCells+=painted;
  }
  if (!g.headless) drawInkBrush(g,wx,wy,radiusPx,owner);
  return painted;
}

function drawInkEllipse(g,wx,wy,rx,ry,angle,owner){
  var ctx=g.inkCtx;
  ctx.fillStyle = owner===1 ? COLOR.p1 : COLOR.p2;
  ctx.save();
  ctx.translate(wx,wy);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.ellipse(0,0,rx*1.05,ry*1.05,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// 楕円ブラシで塗る(着弾の見た目用)。paintCircleと同じくグリッド判定+オフスクリーン描画
function paintEllipse(g, wx, wy, rx, ry, angle, owner){
  if (rx<=0 || ry<=0) return 0;
  var rMax=Math.max(rx,ry);
  var minCx=Math.max(0,Math.floor((wx-rMax)/CELL));
  var maxCx=Math.min(GRID_W-1,Math.floor((wx+rMax)/CELL));
  var minCy=Math.max(0,Math.floor((wy-rMax)/CELL));
  var maxCy=Math.min(GRID_H-1,Math.floor((wy+rMax)/CELL));
  var cosA=Math.cos(-angle), sinA=Math.sin(-angle);
  var painted=0;
  for (var cy=minCy; cy<=maxCy; cy++){
    for (var cx=minCx; cx<=maxCx; cx++){
      var idx=cy*GRID_W+cx;
      var cell=g.grid[idx];
      if (cell===9) continue;
      var ccx=(cx+0.5)*CELL, ccy=(cy+0.5)*CELL;
      var dx=ccx-wx, dy=ccy-wy;
      var lx=dx*cosA-dy*sinA, ly=dx*sinA+dy*cosA;
      if ((lx*lx)/(rx*rx)+(ly*ly)/(ry*ry) <= 1 && cell!==owner){
        if (cell===1) g.counts[0]--; else if (cell===2) g.counts[1]--;
        g.grid[idx]=owner;
        if (owner===1) g.counts[0]++; else g.counts[1]++;
        painted++;
      }
    }
  }
  if (painted>0){
    var pl=g.players[owner-1];
    pl.sp=Math.min(SPECIAL_GAUGE_MAX, pl.sp+painted);
    pl.stats.paintedCells+=painted;
  }
  if (!g.headless) drawInkEllipse(g,wx,wy,rx,ry,angle,owner);
  return painted;
}

// シューターの着弾: 楕円+周囲2〜3個の小さな飛沫で「しずくが飛び散った」見た目にする
function paintShooterImpact(g, wx, wy, r, owner, dirAngle){
  paintEllipse(g, wx, wy, r*1.15, r*0.8, dirAngle, owner);
  var n=2+((g.rng()*2)|0); // 2〜3個
  for (var i=0;i<n;i++){
    var a=g.rng()*Math.PI*2, d=r*(0.7+g.rng()*0.9);
    var dr=r*(0.25+g.rng()*0.3);
    paintCircle(g, wx+Math.cos(a)*d, wy+Math.sin(a)*d, dr, owner);
  }
}

function resolveWallCollision(p, wallsPx){
  for (var i=0;i<wallsPx.length;i++){
    var w=wallsPx[i];
    var cx=clamp(p.x, w.x, w.x+w.w);
    var cy=clamp(p.y, w.y, w.y+w.h);
    var dx=p.x-cx, dy=p.y-cy;
    var distSq=dx*dx+dy*dy;
    if (distSq < p.radius*p.radius){
      var dist=Math.sqrt(distSq);
      if (dist>1e-4){
        var push=(p.radius-dist);
        p.x += dx/dist*push;
        p.y += dy/dist*push;
      } else {
        // 中心がめり込んだ場合は最も浅い方向へ押し出す
        var oL=p.x-w.x, oR=(w.x+w.w)-p.x, oT=p.y-w.y, oB=(w.y+w.h)-p.y;
        var m=Math.min(oL,oR,oT,oB);
        if (m===oL) p.x=w.x-p.radius;
        else if (m===oR) p.x=w.x+w.w+p.radius;
        else if (m===oT) p.y=w.y-p.radius;
        else p.y=w.y+w.h+p.radius;
      }
    }
  }
  p.x=clamp(p.x, p.radius, WORLD_W-p.radius);
  p.y=clamp(p.y, p.radius, WORLD_H-p.radius);
}

function applyDamage(g, target, dmg, ownerIdx){
  if (!target.alive || isInvulnerable(target)) return;
  if (target.status.hakkoTimer>0) dmg *= SPECIALS.utsubo.hakkoDamageMul; // はっこう状態: 被ダメージ倍増
  target.hp -= dmg;
  target.hitFlash = 0.12; // 被弾で一瞬白く点滅
  target.lastHitAt = g.time; // シールドのボットAI判断用(直近の被弾時刻)
  if (target.hp<=0){
    target.hp=0; target.alive=false; target.respawnTimer=RESPAWN_TIME;
    target.status={frozenTimer:0, hakkoTimer:0, aburiTimer:0, aburiOwner:null}; // やられたら状態異常は解除
    var killer=g.players[ownerIdx];
    killer.stats.kills++;
    killer.sp = Math.min(SPECIAL_GAUGE_MAX, killer.sp + SPECIAL_GAUGE_MAX*SPECIAL_KILL_BONUS); // 倒すとスペシャルゲージ+15%
    paintCircle(g, target.x, target.y, DEATH_SPLAT_RADIUS, ownerIdx+1);
    spawnParticles(g, target.x, target.y, ownerIdx, 26);
    if (!g.headless){
      g.shakeTimer=0.28; g.shakeMag=9;
      var killColor = ownerIdx===0?COLOR.p1:COLOR.p2, deadColor = target.idx===0?COLOR.p1:COLOR.p2;
      g.popups.push({x:target.x, y:target.y-34, text:'たおした!', color:killColor, age:0, life:1.1});
      g.popups.push({x:target.x, y:target.y+6, text:'やられた!', color:deadColor, age:0, life:1.1});
      killer.hudToast = {text:'たおした!', kind:'kill', age:0, life:1.3};
      target.hudToast = {text:'やられた…', kind:'dead', age:0, life:1.3};
    }
  } else {
    spawnParticles(g, target.x, target.y, ownerIdx, 6);
  }
}

function spawnParticles(g, x, y, ownerIdx, n){
  if (g.headless) return;
  for (var i=0;i<n;i++){
    var a=g.rng()*Math.PI*2, sp=40+g.rng()*160;
    g.particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.35+g.rng()*0.3,age:0,owner:ownerIdx,r:2+g.rng()*3});
  }
}

/* ==================== 5. 武器アクション ==================== */
function fireShooterBullet(g, idx, p, weapon){
  var spread=(g.rng()*2-1)*weapon.spread;
  var ang=p.angle+spread;
  g.bullets.push({
    kind:'bullet', owner:idx, weaponKey:'shooter',
    x:p.x+Math.cos(p.angle)*p.radius, y:p.y+Math.sin(p.angle)*p.radius,
    vx:Math.cos(ang)*weapon.bulletSpeed, vy:Math.sin(ang)*weapon.bulletSpeed,
    damage:weapon.damage, range:weapon.range, traveled:0,
    paintRadius:weapon.paintRadius*CELL, trailRadius:CELL*0.35, hitRadius:5,
  });
}

function tryRollerSwing(g, idx, p, weapon){
  if (p.swingCooldown>0) return;
  var swingCost = inkCost(p, weapon, 'swingInkCost');
  if (p.ink < swingCost) return;
  p.ink -= swingCost;
  if (!p.isBot) p.lastInkSpendAt = g.time;
  p.swingCooldown = weapon.swingCooldown;
  var n=weapon.swingCount;
  for (var i=0;i<n;i++){
    var t = n<=1 ? 0 : (i/(n-1)-0.5);
    var ang = p.angle + t*weapon.swingArc;
    g.bullets.push({
      kind:'bullet', owner:idx, weaponKey:'roller',
      x:p.x+Math.cos(ang)*p.radius, y:p.y+Math.sin(ang)*p.radius,
      vx:Math.cos(ang)*weapon.swingBulletSpeed, vy:Math.sin(ang)*weapon.swingBulletSpeed,
      damage:weapon.swingDamage, range:weapon.swingRange, traveled:0,
      paintRadius:weapon.swingPaintRadius*CELL, trailRadius:CELL*0.3, hitRadius:7,
    });
  }
}

function castChargerBeam(g, idx, p, weapon, frac){
  var range = weapon.maxRange*frac;
  var damage = weapon.maxDamage*frac;
  var stepLen = 8;
  var steps = Math.ceil(range/stepLen);
  var hit=false;
  var target=g.players[1-idx];
  var paintR = weapon.beamPaintRadius*CELL;
  var endX=p.x, endY=p.y;
  for (var s=1; s<=steps; s++){
    var d=s*stepLen; if (d>range) d=range;
    var x=p.x+Math.cos(p.angle)*d, y=p.y+Math.sin(p.angle)*d;
    endX=x; endY=y;
    if (isWallAt(g,x,y) || isShieldBlockingAt(g,x,y,idx)) break;
    if (!hit && target.alive && !isInvulnerable(target)){
      var dx=target.x-x, dy=target.y-y;
      if (dx*dx+dy*dy <= (target.radius+5)*(target.radius+5)){
        applyDamage(g, target, damage, idx);
        hit=true;
      }
    }
    if (s % 2 === 0) paintCircle(g, x, y, paintR, idx+1);
    if (d>=range) break;
  }
  if (!g.headless) g.particles.push({beam:true, x1:p.x,y1:p.y,x2:endX,y2:endY,owner:idx,age:0,life:0.16});
}

function releaseChargerBeam(g, idx, p, weapon){
  var frac = weapon.minChargeFrac + (1-weapon.minChargeFrac)*clamp(p.charge/weapon.maxCharge,0,1);
  var inkBase = inkCost(p, weapon, 'inkBase'), inkPerFrac = inkCost(p, weapon, 'inkPerFrac');
  var cost = Math.min(p.ink, inkBase + inkPerFrac*frac);
  if (p.ink < 8){ p.charge=0; return; }
  p.ink -= cost;
  if (!p.isBot) p.lastInkSpendAt = g.time;
  castChargerBeam(g, idx, p, weapon, frac);
  p.charge=0;
}

// バケツ: 扇状(半角fanHalfAngle・射程range)の範囲を1発でまとめて塗る。壁は無視して届く(貫通)
function paintSector(g, cx, cy, angle, halfAngle, radius, owner){
  var minCx=Math.max(0,Math.floor((cx-radius)/CELL));
  var maxCx=Math.min(GRID_W-1,Math.floor((cx+radius)/CELL));
  var minCy=Math.max(0,Math.floor((cy-radius)/CELL));
  var maxCy=Math.min(GRID_H-1,Math.floor((cy+radius)/CELL));
  var r2=radius*radius, painted=0;
  for (var cyi=minCy; cyi<=maxCy; cyi++){
    for (var cxi=minCx; cxi<=maxCx; cxi++){
      var idx2=cyi*GRID_W+cxi;
      var cell=g.grid[idx2];
      if (cell===9 || cell===owner) continue;
      var ccx=(cxi+0.5)*CELL, ccy=(cyi+0.5)*CELL;
      var dx=ccx-cx, dy=ccy-cy;
      var d2=dx*dx+dy*dy;
      if (d2>r2) continue;
      var da=Math.atan2(dy,dx)-angle;
      da=Math.atan2(Math.sin(da),Math.cos(da));
      if (Math.abs(da)>halfAngle) continue;
      if (cell===1) g.counts[0]--; else if (cell===2) g.counts[1]--;
      g.grid[idx2]=owner;
      if (owner===1) g.counts[0]++; else g.counts[1]++;
      painted++;
    }
  }
  if (painted>0){
    var pl=g.players[owner-1];
    pl.sp=Math.min(SPECIAL_GAUGE_MAX, pl.sp+painted);
    pl.stats.paintedCells+=painted;
  }
  if (!g.headless){
    var ctx=g.inkCtx;
    ctx.fillStyle = owner===1 ? COLOR.p1 : COLOR.p2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,radius,angle-halfAngle,angle+halfAngle);
    ctx.closePath();
    ctx.fill();
  }
  return painted;
}

function fireBucketShot(g, idx, p, weapon){
  paintSector(g, p.x, p.y, p.angle, weapon.fanHalfAngle, weapon.range, idx+1);
  var target=g.players[1-idx];
  if (target.alive && !isInvulnerable(target)){
    var dx=target.x-p.x, dy=target.y-p.y;
    var d=Math.hypot(dx,dy);
    if (d<=weapon.nearRange){
      var da=Math.atan2(dy,dx)-p.angle; da=Math.atan2(Math.sin(da),Math.cos(da));
      if (Math.abs(da)<=weapon.fanHalfAngle+0.15) applyDamage(g, target, weapon.damage, idx);
    }
  }
  if (!g.headless) spawnParticles(g, p.x+Math.cos(p.angle)*CELL*3, p.y+Math.sin(p.angle)*CELL*3, idx, 4);
}

// フデ: タップで前方に小さな飛沫5発(ふりはらい)
function tryBrushSwing(g, idx, p, weapon){
  if (p.swingCooldown>0) return;
  var swingCost = inkCost(p, weapon, 'swingInkCost');
  if (p.ink < swingCost) return;
  p.ink -= swingCost;
  if (!p.isBot) p.lastInkSpendAt = g.time;
  p.swingCooldown = weapon.swingCooldown;
  var n=weapon.swingCount;
  for (var i=0;i<n;i++){
    var t = n<=1 ? 0 : (i/(n-1)-0.5);
    var ang = p.angle + t*(30*Math.PI/180);
    g.bullets.push({
      kind:'bullet', owner:idx, weaponKey:'brush',
      x:p.x+Math.cos(ang)*p.radius, y:p.y+Math.sin(ang)*p.radius,
      vx:Math.cos(ang)*weapon.swingBulletSpeed, vy:Math.sin(ang)*weapon.swingBulletSpeed,
      damage:weapon.swingDamage, range:weapon.swingRange, traveled:0,
      paintRadius:weapon.swingPaintRadius*CELL, trailRadius:CELL*0.22, hitRadius:6,
    });
  }
}

/* ---- サブウェポン ---- */
function subFacingAngle(p){
  // 「キャラの向き(最後のエイム方向、無ければ移動方向)」。p.angleは常にエイム/移動で更新されているのでそのまま使う
  return p.angle;
}

function throwSubBomb(g, idx, p, sub, instant){
  var ang=subFacingAngle(p);
  var tx=p.x+Math.cos(ang)*sub.throwDist, ty=p.y+Math.sin(ang)*sub.throwDist;
  tx=clamp(tx, CELL, WORLD_W-CELL); ty=clamp(ty, CELL, WORLD_H-CELL);
  var dist=Math.hypot(tx-p.x, ty-p.y);
  var travelTime=Math.max(0.12, dist/620);
  g.subThrows.push({
    kind: instant?'quickbomb':'splashbomb', owner:idx, sub:sub,
    x0:p.x, y0:p.y, x:tx, y:ty, age:0, travelTime:travelTime, landed:false, fuse:sub.fuse||0,
  });
}

function explodeSubBomb(g, b){
  var sub=b.sub;
  var target=g.players[1-b.owner];
  var rr=sub.radius*CELL;
  paintCircle(g, b.x, b.y, rr, b.owner+1);
  if (target.alive && !isInvulnerable(target)){
    var dx=target.x-b.x, dy=target.y-b.y;
    var d=Math.hypot(dx,dy);
    if (d<=rr){
      var frac=1-clamp(d/rr,0,1);
      var dmg=sub.dmgEdge + (sub.dmgCenter-sub.dmgEdge)*frac;
      applyDamage(g, target, dmg, b.owner);
    }
  }
  spawnParticles(g, b.x, b.y, b.owner, 16);
}

function placeSprinkler(g, idx, p, sub){
  // 同時に1個まで(次を置くと前のが消える)
  for (var i=g.sprinklers.length-1;i>=0;i--) if (g.sprinklers[i].ownerIdx===idx) g.sprinklers.splice(i,1);
  var ang=subFacingAngle(p);
  var x=clamp(p.x+Math.cos(ang)*sub.throwDist, CELL, WORLD_W-CELL);
  var y=clamp(p.y+Math.sin(ang)*sub.throwDist, CELL, WORLD_H-CELL);
  g.sprinklers.push({ ownerIdx:idx, x:x, y:y, timer:sub.duration, hp:sub.hp, nextTick:0 });
}

function placeShield(g, idx, p, sub){
  for (var i=g.shields.length-1;i>=0;i--) if (g.shields[i].ownerIdx===idx) g.shields.splice(i,1);
  var ang=subFacingAngle(p);
  var cx=p.x+Math.cos(ang)*sub.standoff*CELL, cy=p.y+Math.sin(ang)*sub.standoff*CELL;
  var perp=ang+Math.PI/2;
  var dx=Math.cos(perp), dy=Math.sin(perp);
  var halfLen=sub.width*CELL/2;
  var sh={ ownerIdx:idx, cx:cx, cy:cy, dx:dx, dy:dy, halfLen:halfLen, thickness:sub.thickness*CELL, timer:sub.duration };
  g.shields.push(sh);
  // 壁の下を自分色に塗る
  var steps=Math.ceil(halfLen*2/(CELL*0.8));
  for (var s=0;s<=steps;s++){
    var t=-halfLen+ (2*halfLen)*(s/steps);
    paintCircle(g, cx+dx*t, cy+dy*t, sub.thickness*CELL*0.75+CELL*0.3, idx+1);
  }
}

function distToShieldSeg(sh, x, y){
  var px=x-sh.cx, py=y-sh.cy;
  var t=clamp(px*sh.dx+py*sh.dy, -sh.halfLen, sh.halfLen);
  var cx2=sh.cx+sh.dx*t, cy2=sh.cy+sh.dy*t;
  return Math.hypot(x-cx2, y-cy2);
}

// projectileOwnerIdxの弾/ビームが(x,y)地点でシールドに止められるか(自分が張ったシールドは自分の弾を止めない)
function isShieldBlockingAt(g, x, y, projectileOwnerIdx){
  for (var i=0;i<g.shields.length;i++){
    var sh=g.shields[i];
    if (sh.ownerIdx===projectileOwnerIdx) continue;
    if (distToShieldSeg(sh,x,y) <= sh.thickness) return true;
  }
  return false;
}

// idx側プレイヤーの移動を、相手が設置したシールドでブロックする(自分のシールドはすり抜けられる)
function resolveShieldCollision(g, idx, p){
  for (var i=0;i<g.shields.length;i++){
    var sh=g.shields[i];
    if (sh.ownerIdx===idx) continue;
    var d=distToShieldSeg(sh,p.x,p.y);
    var minD=p.radius+sh.thickness;
    if (d<minD && d>1e-4){
      var px=p.x-sh.cx, py=p.y-sh.cy;
      var t=clamp(px*sh.dx+py*sh.dy, -sh.halfLen, sh.halfLen);
      var cx2=sh.cx+sh.dx*t, cy2=sh.cy+sh.dy*t;
      var nx=(p.x-cx2)/d, ny=(p.y-cy2)/d;
      p.x = cx2+nx*minD; p.y = cy2+ny*minD;
    }
  }
}

function updateSprinklers(g, dt){
  for (var i=g.sprinklers.length-1;i>=0;i--){
    var s=g.sprinklers[i];
    s.timer-=dt;
    if (s.timer<=0 || s.hp<=0){ g.sprinklers.splice(i,1); continue; }
    var sub=SUBS.sprinkler;
    s.nextTick-=dt;
    if (s.nextTick<=0){
      s.nextTick = 1/sub.rate;
      var a=g.rng()*Math.PI*2, d=g.rng()*sub.radius*CELL;
      paintCircle(g, s.x+Math.cos(a)*d, s.y+Math.sin(a)*d, sub.splashR*CELL, s.ownerIdx+1);
    }
  }
}

function updateShields(g, dt){
  for (var i=g.shields.length-1;i>=0;i--){
    g.shields[i].timer-=dt;
    if (g.shields[i].timer<=0) g.shields.splice(i,1);
  }
}

function updateSubThrows(g, dt){
  var arr=g.subThrows;
  for (var i=arr.length-1;i>=0;i--){
    var b=arr[i];
    b.age+=dt;
    if (!b.landed){
      if (b.age>=b.travelTime){ b.landed=true; b.age=0; if (b.kind==='quickbomb'){ explodeSubBomb(g,b); arr.splice(i,1); } }
    } else {
      if (b.age>=b.fuse){ explodeSubBomb(g,b); arr.splice(i,1); }
    }
  }
}

/* ---- スペシャル(第6ラウンド。武器から独立した3種。それぞれ発動した瞬間に勝負が動く強さにする) ---- */
function activateSpecial(g, idx){
  var p=g.players[idx];
  if (!p.alive || p.specialActive || p.sp < SPECIAL_GAUGE_MAX) return;
  p.sp = 0;
  p.stats.specials++;
  p.charging=false; p.charge=0;
  p.specialActive = true;
  if (p.special==='sensei'){
    p.specialData = { timer: SPECIALS.sensei.delay, angle: p.angle };
  } else if (p.special==='utsubo'){
    p.specialData = { timer: SPECIALS.utsubo.duration, paintAcc:0 };
  } else if (p.special==='manta'){
    p.specialData = { timer: SPECIALS.manta.duration, shotCooldown:0 };
  }
  if (!g.headless){
    g.specialFlash = { owner:idx, name:SPECIALS[p.special].name, age:0, life:0.3 };
  }
}

// せんせいストライク: 予告0.6秒後に、発動時の向きへマップ端まで届く幅5セルの一撃。直撃で100ダメージ、
// 直撃を免れても縁(幅+3セル)にいれば「こおり」(2秒動けない、撃つことはできる)
function executeSenseiStrike(g, idx, p, angle){
  var sp=SPECIALS.sensei;
  var ox=p.x, oy=p.y;
  var dirX=Math.cos(angle), dirY=Math.sin(angle);
  var perpX=-dirY, perpY=dirX;
  var maxRange = Math.hypot(WORLD_W, WORLD_H); // マップ端まで届けば十分な長さ(対角線)
  var halfW = sp.halfWidthCells*CELL;
  var iceHalfW = halfW + sp.iceExtraCells*CELL;
  var stepLen = CELL*0.9, steps = Math.ceil(maxRange/stepLen);
  for (var s=0; s<=steps; s++){
    var d=s*stepLen, x=ox+dirX*d, y=oy+dirY*d;
    if (x<-CELL || x>WORLD_W+CELL || y<-CELL || y>WORLD_H+CELL) break;
    paintCircle(g, x, y, halfW, idx+1);
  }
  var target=g.players[1-idx];
  if (target.alive && !isInvulnerable(target)){
    var dx=target.x-ox, dy=target.y-oy;
    var forward=dx*dirX+dy*dirY, perp=dx*perpX+dy*perpY;
    if (forward>=-target.radius && forward<=maxRange){
      if (Math.abs(perp)<=halfW+target.radius){
        applyDamage(g, target, sp.damage, idx);
      } else if (Math.abs(perp)<=iceHalfW+target.radius){
        applyStatus(g, idx, target, 'frozen', sp.iceTime);
      }
    }
  }
  if (!g.headless){ g.shakeTimer=0.3; g.shakeMag=10; }
}

// むらさめウツボ: 前方の広い矩形範囲(キャラに追従)にウツボの群れが降り注ぎ、毎秒40%塗りつつ35ダメージ/秒。
// 当たった敵は「はっこう」(4秒、移動×0.6・被ダメ×1.5)
function updateUtsuboField(g, idx, p, dt){
  var sp=SPECIALS.utsubo, sd=p.specialData;
  var ang=p.angle, dirX=Math.cos(ang), dirY=Math.sin(ang), perpX=-dirY, perpY=dirX;
  var halfW=sp.widthCells*CELL/2, depth=sp.depthCells*CELL;
  var areaCells=sp.widthCells*sp.depthCells;
  sd.paintAcc = (sd.paintAcc||0) + areaCells*sp.fillRate*dt;
  while (sd.paintAcc>=1){
    sd.paintAcc-=1;
    var rf=g.rng()*depth, rp=(g.rng()*2-1)*halfW;
    paintCircle(g, p.x+dirX*rf+perpX*rp, p.y+dirY*rf+perpY*rp, CELL*0.62, idx+1);
  }
  var target=g.players[1-idx];
  if (target.alive && !isInvulnerable(target)){
    var dx=target.x-p.x, dy=target.y-p.y;
    var forward=dx*dirX+dy*dirY, perp=dx*perpX+dy*perpY;
    if (forward>=-target.radius && forward<=depth+target.radius && Math.abs(perp)<=halfW+target.radius){
      applyDamage(g, target, sp.dps*dt, idx);
      if (target.alive) applyStatus(g, idx, target, 'hakko', sp.hakkoTime);
    }
  }
}

// マンタりんぶ: 発動時間中マンタに乗って無敵・高速移動。幅6セルの跡を塗り、体当たりで高ダメージ、
// 周囲の敵を引き寄せつつ、エイムパッドで大きなインク弾を投げられる。当てた敵は「あぶり」(3秒、毎秒12ダメージ)
function updateMantaRide(g, idx, p, dt, inp){
  var sp=SPECIALS.manta, sd=p.specialData;
  paintCircle(g, p.x, p.y, sp.trailCells*CELL/2, idx+1);
  var opp=g.players[1-idx];
  if (opp.alive && !isInvulnerable(opp)){
    var dx=opp.x-p.x, dy=opp.y-p.y, d=Math.hypot(dx,dy)||1e-4;
    var contactR=p.radius+opp.radius+8;
    if (d<=contactR){
      applyDamage(g, opp, sp.contactDamage, idx);
      if (opp.alive) applyStatus(g, idx, opp, 'aburi', sp.aburiTime);
    } else if (d<=sp.pullRadiusCells*CELL){
      opp.x -= dx/d*sp.pullForce*dt; opp.y -= dy/d*sp.pullForce*dt;
    }
  }
  sd.shotCooldown = Math.max(0, (sd.shotCooldown||0)-dt);
  if (inp.fire && sd.shotCooldown<=0){
    sd.shotCooldown = 1/sp.shotRate;
    var ang=p.angle;
    g.bullets.push({
      kind:'bullet', owner:idx, weaponKey:'manta',
      x:p.x+Math.cos(ang)*p.radius, y:p.y+Math.sin(ang)*p.radius,
      vx:Math.cos(ang)*sp.shotSpeed, vy:Math.sin(ang)*sp.shotSpeed,
      damage:sp.shotDamage, range:sp.shotRange, traveled:0,
      paintRadius:sp.shotRadiusCells*CELL, trailRadius:CELL*0.5, hitRadius:10,
    });
  }
}

// specialActive中の毎ティック処理をまとめて呼び出す。通常武器の発射処理はここでは行わない(マンタのみinp.fireでインク弾を撃てる)
function handleSpecialTick(g, idx, p, dt, inp){
  var sd=p.specialData;
  if (p.special==='sensei'){
    sd.timer -= dt;
    if (sd.timer<=0){ executeSenseiStrike(g, idx, p, sd.angle); p.specialActive=false; }
  } else if (p.special==='utsubo'){
    sd.timer -= dt;
    updateUtsuboField(g, idx, p, dt);
    if (sd.timer<=0) p.specialActive=false;
  } else if (p.special==='manta'){
    sd.timer -= dt;
    updateMantaRide(g, idx, p, dt, inp);
    if (sd.timer<=0) p.specialActive=false;
  } else {
    p.specialActive=false;
  }
}

/* ==================== 6. 弾・プレイヤー更新 ==================== */
// 弾道の塗り: シューターの弾は直径0.8〜1.6セルでばらつかせ、進行方向に対して左右にずらして飛沫っぽくする
function paintBulletTrail(g,b){
  if (!b.trailRadius) return;
  if (b.weaponKey==='shooter'){
    var tR=CELL*(0.4+g.rng()*0.4); // 半径0.4〜0.8セル(直径0.8〜1.6セル)
    var perpAng=Math.atan2(b.vy,b.vx)+Math.PI/2;
    var off=(g.rng()*2-1)*tR*0.9;
    paintCircle(g, b.x+Math.cos(perpAng)*off, b.y+Math.sin(perpAng)*off, tR, b.owner+1);
  } else {
    paintCircle(g,b.x,b.y,b.trailRadius,b.owner+1);
  }
}
// 着弾の塗り: シューターは楕円+飛沫、それ以外(ローラーの振り)は従来どおり丸
function paintBulletImpact(g,b){
  if (b.weaponKey==='shooter'){
    paintShooterImpact(g,b.x,b.y,b.paintRadius,b.owner+1,Math.atan2(b.vy,b.vx));
  } else {
    paintCircle(g,b.x,b.y,b.paintRadius,b.owner+1);
  }
}
function updateBullets(g, dt){
  var arr=g.bullets;
  for (var i=arr.length-1; i>=0; i--){
    var b=arr[i];
    var dead=false;
    if (b.kind==='bullet'){
      b.x += b.vx*dt; b.y += b.vy*dt;
      b.traveled += Math.hypot(b.vx*dt, b.vy*dt);
      if (isWallAt(g,b.x,b.y) || isShieldBlockingAt(g,b.x,b.y,b.owner)){
        paintBulletImpact(g,b); dead=true;
      } else {
        paintBulletTrail(g,b);
        var target=g.players[1-b.owner];
        if (!dead && target.alive && !isInvulnerable(target)){
          var dx=target.x-b.x, dy=target.y-b.y;
          if (dx*dx+dy*dy <= (target.radius+(b.hitRadius||4))*(target.radius+(b.hitRadius||4))){
            applyDamage(g,target,b.damage,b.owner);
            if (b.weaponKey==='manta' && target.alive) applyStatus(g, b.owner, target, 'aburi', SPECIALS.manta.aburiTime);
            paintBulletImpact(g,b);
            dead=true;
          }
        }
        if (!dead){
          for (var si=0; si<g.sprinklers.length; si++){
            var spk=g.sprinklers[si];
            if (spk.ownerIdx===b.owner) continue;
            var sdx=spk.x-b.x, sdy=spk.y-b.y;
            if (sdx*sdx+sdy*sdy <= (CELL*1.1)*(CELL*1.1)){
              spk.hp -= b.damage; paintBulletImpact(g,b); dead=true; break;
            }
          }
        }
        if (!dead && b.traveled>=b.range){
          paintBulletImpact(g,b); dead=true;
        }
        if (!dead && (b.x<0||b.x>WORLD_W||b.y<0||b.y>WORLD_H)) dead=true;
      }
    }
    if (dead) arr.splice(i,1);
  }
}

function updateParticles(g, dt){
  if (g.headless) { g.particles.length=0; return; }
  var arr=g.particles;
  for (var i=arr.length-1;i>=0;i--){
    var pt=arr[i];
    pt.age += dt;
    if (pt.beam){ if (pt.age>=pt.life) arr.splice(i,1); continue; }
    pt.x += pt.vx*dt; pt.y += pt.vy*dt;
    pt.vx *= 0.9; pt.vy *= 0.9;
    if (pt.age>=pt.life) arr.splice(i,1);
  }
}

// 第6ラウンド: 人間プレイヤー専用インク経済のヘルパー。ボット(p.isBot===true)は常に従来どおりの値を返し、
// 挙動を一切変えない(weapon.human.*を参照するのは人間の時だけ)。
function inkCost(p, weapon, kind){
  if (!p.isBot && weapon.human && weapon.human[kind]!=null) return weapon.human[kind];
  return weapon[kind];
}
function inkRegenRate(p, idx, terrain){
  if (p.isBot) return terrain===(idx+1) ? INK_REGEN_FAST : INK_REGEN_SLOW; // ボット: 従来どおり
  if (terrain===(idx+1)) return INK_REGEN_OWN_HUMAN;
  if (terrain===(2-idx)) return INK_REGEN_ENEMY_HUMAN;
  return INK_REGEN_UNPAINTED_HUMAN;
}

function updatePlayer(g, idx, dt){
  var p=g.players[idx], weapon=WEAPONS[p.weapon];
  var opp=g.players[1-idx];

  // 復活処理
  if (p.hitFlash>0) p.hitFlash=Math.max(0,p.hitFlash-dt);
  if (!p.alive){
    p.respawnTimer -= dt;
    if (p.respawnTimer<=0){
      p.alive=true; p.hp=100; p.x=SPAWN[idx].x; p.y=SPAWN[idx].y; p.invuln=INVULN_TIME;
      // 第8ラウンド: 復活時はインクも満タンに戻す(空のまま復活して何もできない状態を作らない)。
      // 回復待ち(INK_REGEN_DELAY)の基準もリセットしておく
      p.ink=INK_MAX; p.lastInkSpendAt=-1e9;
      p.status={frozenTimer:0, hakkoTimer:0, aburiTimer:0, aburiOwner:null};
    }
    p.fireCooldown=Math.max(0,p.fireCooldown-dt);
    p.swingCooldown=Math.max(0,p.swingCooldown-dt);
    p.contactCooldown=Math.max(0,p.contactCooldown-dt);
    p.subCooldown=Math.max(0,p.subCooldown-dt);
    if (p.invuln>0) p.invuln=Math.max(0,p.invuln-dt);
    return;
  }
  if (p.invuln>0) p.invuln=Math.max(0,p.invuln-dt);

  // 状態異常(こおり/はっこう/あぶり)の経過。あぶりは毎ティックダメージを与える
  var st=p.status;
  if (st.frozenTimer>0) st.frozenTimer=Math.max(0,st.frozenTimer-dt);
  if (st.hakkoTimer>0) st.hakkoTimer=Math.max(0,st.hakkoTimer-dt);
  if (st.aburiTimer>0){
    st.aburiTimer=Math.max(0,st.aburiTimer-dt);
    applyDamage(g, p, SPECIALS.manta.aburiDps*dt, st.aburiOwner);
    if (!p.alive) return; // あぶりダメージで倒れた場合はここで終了(復活処理は次ティック)
  }

  var inp=p.input||{move:{x:0,y:0},aim:{x:0,y:0},fire:false,special:false};

  // 移動
  var mv=inp.move||{x:0,y:0};
  var mvLen=Math.hypot(mv.x,mv.y);
  var moveDir = mvLen>0.001 ? {x:mv.x/mvLen, y:mv.y/mvLen} : {x:0,y:0};
  var speedFrac = Math.min(1,mvLen);
  var terrainBefore = cellAt(g,p.x,p.y);
  var terrainMul=1.0;
  if (terrainBefore===(idx+1)) terrainMul=OWN_INK_MUL;
  else if (terrainBefore===(2-idx)) terrainMul = weapon.enemyInkMul!=null ? weapon.enemyInkMul : ENEMY_INK_MUL;
  var weaponMul=weapon.moveSpeedMul;
  if (weapon.key==='charger' && p.charging) weaponMul *= CHARGER_CHARGE_MOVE_MUL;
  if (p.specialActive && p.special==='manta') weaponMul *= SPECIALS.manta.speedMul;
  if (st.hakkoTimer>0) weaponMul *= SPECIALS.utsubo.hakkoSpeedMul;
  var speed = BASE_SPEED*weaponMul*terrainMul*speedFrac;
  if (st.frozenTimer>0) speed = 0; // こおり: 動けない(撃つことはできる)
  p.x += moveDir.x*speed*dt;
  p.y += moveDir.y*speed*dt;
  resolveWallCollision(p, g.wallsPx);
  resolveShieldCollision(g, idx, p);

  // 地形によるインク回復(第6ラウンド: 人間だけ、直前の消費から INK_REGEN_DELAY 秒は回復しない。ボットは従来どおり)
  var terrainAfter = cellAt(g,p.x,p.y);
  if (p.isBot){
    p.ink = Math.min(INK_MAX, p.ink + inkRegenRate(p, idx, terrainAfter)*dt);
  } else if ((g.time - p.lastInkSpendAt) >= INK_REGEN_DELAY){
    p.ink = Math.min(INK_MAX, p.ink + inkRegenRate(p, idx, terrainAfter)*dt);
  }

  // 向き(エイム)
  var av=inp.aim;
  if (av && (Math.abs(av.x)>1e-3 || Math.abs(av.y)>1e-3)){
    p.angle = Math.atan2(av.y, av.x);
  }

  // クールダウン
  p.fireCooldown=Math.max(0,p.fireCooldown-dt);
  p.swingCooldown=Math.max(0,p.swingCooldown-dt);
  p.contactCooldown=Math.max(0,p.contactCooldown-dt);
  p.subCooldown=Math.max(0,p.subCooldown-dt);

  // fire の押した/離した遷移(タップ判定に使う)
  var firing=!!inp.fire;
  if (firing && !p.wasFiring) p.fireHeldStart=g.time;
  var releasedNow = (!firing && p.wasFiring);
  var heldDur = releasedNow ? (g.time-p.fireHeldStart) : 0;
  if (weapon.key!=='roller' || p.specialActive) p.rolling=false; // ローラー以外・スペシャル中は転がしモード表示を出さない

  if (p.specialActive){
    // スペシャル発動中は専用の処理へ(マンタのみinp.fireでインク弾を撃てる。他の武器の通常射撃は行わない)
    handleSpecialTick(g, idx, p, dt, inp);
  } else if (weapon.key==='shooter'){
    if (firing && p.ink>0 && p.fireCooldown<=0){
      p.fireCooldown = 1/weapon.fireRate;
      var shotCost = inkCost(p, weapon, 'inkPerShot');
      p.ink = Math.max(0, p.ink-shotCost);
      if (!p.isBot) p.lastInkSpendAt = g.time;
      fireShooterBullet(g, idx, p, weapon);
    }
  } else if (weapon.key==='roller'){
    if (releasedNow && heldDur < TAP_MAX_DURATION) tryRollerSwing(g, idx, p, weapon);
    // 第7ラウンド: エイムパッド(fire)を押している間だけ「転がしモード」。見た目の棒はこのフラグで出し引きする
    p.rolling = firing;
    var moved = speed*dt;
    // 転がしモード中に、ある程度の速さ(BASE_SPEED×0.3以上)で動いている時だけ塗る(押していない/止まっている時は塗らない)
    if (firing && speed >= BASE_SPEED*ROLL_PAINT_MIN_SPEED_MUL && moved > 0.4){
      // 塗り幅を移動距離に応じて揺らし、轢き跡の両端をギザギザにする
      p.rollDist += moved;
      var wobble = Math.sin(p.rollDist/(CELL*3.1))*CELL*0.55;
      var rad = Math.max(CELL*0.55, weapon.rollWidth*CELL/2 + wobble);
      if (p.isBot){
        paintCircle(g, p.x, p.y, rad, idx+1); // ボット: 従来どおり無料・無条件
      } else if (p.ink>0){
        // 第8ラウンド: 人間の転がしは「進んだ距離」+「新しく塗ったセル数」でインクを消費する。
        // 距離の分があるので、自陣の上を転がしていてもタンクは減っていく。
        // さらにこの消費でも回復待ち(INK_REGEN_DELAY)をリセットするので、転がしている間は回復しない
        // (エイムパッドを離して転がしをやめると、0.5秒後に地形に応じた回復が始まる)。
        var rollPainted = paintCircle(g, p.x, p.y, rad, idx+1);
        var rollCost = moved*inkCost(p, weapon, 'rollCostPerPx')
                     + rollPainted*inkCost(p, weapon, 'rollCostPerCell');
        if (rollCost>0){
          p.ink = Math.max(0, p.ink - rollCost);
          p.lastInkSpendAt = g.time;
        }
      }
    }
    // 接触キルは「転がしモード中(押しながら)、ある程度の速さで動いている時だけ」有効
    // (待ち伏せ即死を防ぐ。実機フィードバックでBASE_SPEED×0.5以上に変更。第7ラウンドでfire押下も条件に追加)
    if (firing && opp.alive && !isInvulnerable(opp) && speed > BASE_SPEED*(weapon.contactMinSpeedMul!=null?weapon.contactMinSpeedMul:0.15)){
      var ddx=opp.x-p.x, ddy=opp.y-p.y;
      var rr=p.radius+opp.radius+10;
      if (ddx*ddx+ddy*ddy <= rr*rr && p.contactCooldown<=0){
        applyDamage(g, opp, weapon.contactDamage, idx);
        p.contactCooldown=0.5;
      }
    }
  } else if (weapon.key==='charger'){
    if (firing && p.ink>=8){
      p.charging=true;
      p.charge=Math.min(weapon.maxCharge, p.charge+dt);
      if (!p.isBot) p.lastInkSpendAt = g.time; // 第6ラウンド: 人間はため中も消費扱い(回復しない)
    } else if (!firing){
      p.charging=false;
    }
    if (releasedNow && p.charge>0){
      releaseChargerBeam(g, idx, p, weapon);
    }
  } else if (weapon.key==='bucket'){
    var bucketCost = inkCost(p, weapon, 'inkPerShot');
    if (firing && p.ink>=bucketCost && p.fireCooldown<=0){
      p.fireCooldown = weapon.fireInterval;
      p.ink = Math.max(0, p.ink-bucketCost);
      if (!p.isBot) p.lastInkSpendAt = g.time;
      fireBucketShot(g, idx, p, weapon);
    }
  } else if (weapon.key==='brush'){
    // 実機フィードバックでタップ単発→押しっぱなし連打(swingCooldownごとに自動連続)に変更
    if (firing && p.swingCooldown<=0) tryBrushSwing(g, idx, p, weapon);
    var movedBrush = speed*dt;
    if (movedBrush > 0.3){
      var radBrush = Math.max(CELL*0.35, weapon.trailWidth*CELL/2);
      if (p.isBot){
        paintCircle(g, p.x, p.y, radBrush, idx+1); // ボット: 従来どおり無料・無条件
      } else if (p.ink>0){
        // 第6ラウンド: 人間だけ、新しく塗ったセル数に応じてインクを消費(ローラーと同じ仕組み)
        var brushPainted = paintCircle(g, p.x, p.y, radBrush, idx+1);
        if (brushPainted>0) p.ink = Math.max(0, p.ink - brushPainted*inkCost(p, weapon, 'brushCostPerCell'));
      }
    }
  }
  p.wasFiring=firing;

  // サブウェポン(タップで使用。使用後は共通クールダウン)
  var subPressed=!!inp.sub;
  if (subPressed && !p.wasSub && p.subCooldown<=0){
    var sub=SUBS[p.sub];
    if (sub && p.ink>=sub.inkCost){
      p.ink -= sub.inkCost;
      if (!p.isBot) p.lastInkSpendAt = g.time; // 第6ラウンド: サブのコストは共通のまま、消費扱いだけ人間に適用
      p.subCooldown = SUB_COOLDOWN;
      p.stats.subsUsed++;
      if (sub.key==='splashbomb') throwSubBomb(g, idx, p, sub, false);
      else if (sub.key==='quickbomb') throwSubBomb(g, idx, p, sub, true);
      else if (sub.key==='sprinkler') placeSprinkler(g, idx, p, sub);
      else if (sub.key==='shield') placeShield(g, idx, p, sub);
    }
  }
  p.wasSub=subPressed;

  // スペシャル
  var specialPressed=!!inp.special;
  if (specialPressed && !p.wasSpecial) activateSpecial(g, idx);
  p.wasSpecial=specialPressed;
}

function checkRoundEnd(g){
  if (g.remaining>1e-6) return; // 浮動小数点誤差でちょうど0にならないことがあるため許容誤差を設ける
  g.remaining=0;
  g.phase='roundResult';
  var totalPlayable = GRID_W*GRID_H - g.wallCount;
  var pct1 = g.counts[0]/totalPlayable*100;
  var pct2 = g.counts[1]/totalPlayable*100;
  var winnerIdx = pct1>pct2 ? 0 : (pct2>pct1 ? 1 : null);
  if (winnerIdx!==null) g.seriesScore[winnerIdx]++;
  g.roundResults.push({pct1:pct1, pct2:pct2, winnerIdx:winnerIdx, kills:[g.players[0].stats.kills, g.players[1].stats.kills]});
  g.lastRoundLoserIdx = winnerIdx===null ? null : (1-winnerIdx);
  g.lastRoundPct=[pct1,pct2];
  g.seriesDone = g.seriesScore[0]>=SERIES_WINS || g.seriesScore[1]>=SERIES_WINS || g.roundResults.length>=SERIES_MAX_ROUNDS;
  if (!g.headless) onRoundEndUI(g);
}

function stepGame(g, dt){
  g.time += dt;
  if (g.phase==='countdown'){
    // 第7ラウンド: 数字のカウントダウンの前に1.2秒だけ「VS」画面を挟む
    if (g.vsTimer>0){
      g.vsTimer -= dt;
      if (!g.headless){ if (g.vsTimer<=0) hideVsUI(); else updateVsUI(g); }
      return;
    }
    g.countdown -= dt;
    if (!g.headless) updateCountdownUI(g);
    if (g.countdown<=0){ g.phase='playing'; g.remaining=g.duration; if (!g.headless) onPlayStartUI(g); }
    return;
  }
  if (g.phase!=='playing') return;
  g.remaining -= dt;
  updateInputsForTick(g);
  updatePlayer(g,0,dt);
  updatePlayer(g,1,dt);
  updateBullets(g,dt);
  updateSubThrows(g,dt);
  updateSprinklers(g,dt);
  updateShields(g,dt);
  updateParticles(g,dt);
  updateEffects(g,dt);
  checkRoundEnd(g);
}

// 画面の軽い揺れ・やられた!/たおした!ポップアップ・HUDトーストの経過時間を更新する(描画専用、判定には影響しない)
function updateEffects(g, dt){
  if (g.shakeTimer>0) g.shakeTimer=Math.max(0,g.shakeTimer-dt);
  for (var i=0;i<2;i++){
    var t=g.players[i].hudToast;
    if (t){ t.age+=dt; if (t.age>=t.life) g.players[i].hudToast=null; }
  }
  if (g.headless) return;
  if (g.specialFlash){ g.specialFlash.age+=dt; if (g.specialFlash.age>=g.specialFlash.life) g.specialFlash=null; }
  var arr=g.popups;
  for (var j=arr.length-1;j>=0;j--){
    arr[j].age+=dt;
    if (arr[j].age>=arr[j].life) arr.splice(j,1);
  }
}

/* ==================== 7. ボットAI ==================== */
var BOT_DIRS = (function(){
  var arr=[];
  for (var i=0;i<8;i++){ var a=i/8*Math.PI*2; arr.push({x:Math.cos(a), y:Math.sin(a)}); }
  return arr;
})();

function hasLineOfSight(g, x1,y1,x2,y2){
  var d=Math.hypot(x2-x1,y2-y1);
  var steps=Math.max(1,Math.floor(d/(CELL*1.2)));
  for (var i=1;i<steps;i++){
    var t=i/steps;
    if (isWallAt(g, x1+(x2-x1)*t, y1+(y2-y1)*t)) return false;
  }
  return true;
}

// 周囲を8方向サンプリングして「未塗り・敵色」が多い方向を選ぶ
// preferOwnでないときは、相手のいる方向へもゆるく引き寄せられる(そのままだと自陣付近だけを
// 塗って終わり、会敵しないまま試合が終わってしまうため。会敵率を上げてから交戦判定に渡す)
function pickCoverageDir(g, idx, p, preferOwn, allowAdvance){
  var best=null, bestScore=-Infinity;
  var look=4*CELL;
  var opp=g.players[1-idx];
  var haveOpp = allowAdvance!==false && !preferOwn && opp.alive && !isInvulnerable(opp);
  var oppDX=0, oppDY=0, oppLen=1;
  if (haveOpp){ oppDX=opp.x-p.x; oppDY=opp.y-p.y; oppLen=Math.hypot(oppDX,oppDY)||1; }
  for (var i=0;i<BOT_DIRS.length;i++){
    var d=BOT_DIRS[i];
    var sx=p.x+d.x*look, sy=p.y+d.y*look;
    if (sx<CELL||sx>WORLD_W-CELL||sy<CELL||sy>WORLD_H-CELL || isWallAt(g,sx,sy)){
      continue;
    }
    var score=0;
    for (var oy=-1; oy<=1; oy++){
      for (var ox=-1; ox<=1; ox++){
        var cell=cellAt(g, sx+ox*CELL, sy+oy*CELL);
        if (cell===9) continue;
        if (preferOwn){
          score += cell===(idx+1) ? 1 : 0;
        } else {
          if (cell===0) score += 1;
          else if (cell===(2-idx)) score += 1.4;
        }
      }
    }
    if (haveOpp) score += (d.x*oppDX+d.y*oppDY)/oppLen * CONFIG.ADVANCE_BIAS;
    score += (g.rng()-0.5)*3*(1-CONFIG.BOT_SKILL);
    if (score>bestScore){ bestScore=score; best=d; }
  }
  return best || {x:0,y: idx===0?-1:1};
}

function botAimJitter(g, ang){
  var spread=(1-CONFIG.BOT_SKILL)*0.35;
  return ang + (g.rng()*2-1)*spread;
}

// 前方の矩形範囲(幅widthCells×奥行depthCells、角度ang)を格子サンプリングし、
// colorValueのセルが占める割合を返す(むらさめウツボの発動判断「相手色の多い方向を向いているか」に使用)
function forwardColorFrac(g, p, ang, widthCells, depthCells, colorValue){
  var dirX=Math.cos(ang), dirY=Math.sin(ang), perpX=-dirY, perpY=dirX;
  var halfW=widthCells*CELL/2, depth=depthCells*CELL;
  var stepsD=Math.max(1,Math.round(depthCells)), stepsW=Math.max(1,Math.round(widthCells));
  var cnt=0, total=0;
  for (var i=0;i<stepsD;i++){
    var rf=(i+0.5)/stepsD*depth;
    for (var j=0;j<stepsW;j++){
      var rp=((j+0.5)/stepsW - 0.5)*2*halfW;
      var sx=p.x+dirX*rf+perpX*rp, sy=p.y+dirY*rf+perpY*rp;
      var cell=cellAt(g, sx, sy);
      if (cell===9) continue;
      total++;
      if (cell===colorValue) cnt++;
    }
  }
  return total>0 ? cnt/total : 0;
}

function botDecide(g, idx){
  var p=g.players[idx], opp=g.players[1-idx], weapon=WEAPONS[p.weapon];
  var mem=p.botMem;
  var input={move:{x:0,y:0}, aim:{x:0,y:0}, fire:false, special:false};
  if (!p.alive) return input;

  var distToOpp=Math.hypot(opp.x-p.x, opp.y-p.y);
  var oppTargetable = opp.alive && !isInvulnerable(opp); // リスポーン直後の無敵中の敵は狙わない
  var los = oppTargetable && hasLineOfSight(g,p.x,p.y,opp.x,opp.y);
  var oppOnMyInk = oppTargetable && cellAt(g,opp.x,opp.y)===(idx+1); // 相手が自分のインク上で減速中→追撃対象
  var oppLowHP = oppTargetable && opp.hp<=40;                        // 弱った敵は追う
  var selfLowHP = p.hp<=30;                                          // 自分が瀕死のときだけ下がる(逃げすぎない)
  // 交戦を検討する間合いの目安(武器の主射程相当。ローラーは近接戦向けの間合い)
  var oppWeapon = WEAPONS[opp.weapon];
  var oppThreatRange = oppWeapon.key==='charger' ? oppWeapon.maxRange : (oppWeapon.key==='shooter' || oppWeapon.key==='bucket' ? oppWeapon.range : 10*CELL);
  // シューターは自分の射程より遠くから狙ってくる相手(チャージャー等)には、相手の射程の一定割合まで積極的に詰める
  // (射程差があるほど「待っていても撃たれるだけ」なので、詰める意欲を相手の脅威間合いに応じて引き上げる)
  // バケツも壁越しに届くが、チャージャーのように射程が非常に長い相手には自分の射程内に収まるまで
  // 詰めないと一方的に狙撃され続けるため、シューターと同様に相手の脅威間合いに応じて詰める意欲を引き上げる
  var engageDist = weapon.key==='shooter' ? Math.max(weapon.range, oppThreatRange*CONFIG.SHOOTER_OUTRANGE_CHASE)
    : weapon.key==='charger' ? weapon.maxRange
    : weapon.key==='bucket' ? Math.max(weapon.range, oppThreatRange*CONFIG.SHOOTER_OUTRANGE_CHASE)
    : weapon.key==='brush' ? weapon.swingRange
    : 10*CELL;
  var needsLOS = weapon.key !== 'bucket'; // バケツは壁を越えて届くのでLOS不要
  // 射程の1.3倍以内・インク30以上なら塗りより交戦を優先する(弱った敵/自陣インクで減速中の敵はインクが少なくても追う)
  var wantEngage = oppTargetable && (!needsLOS || los) && distToOpp <= engageDist*1.3 &&
                   (weapon.key==='roller' || (weapon.key!=='brush' && p.ink>=30) || oppLowHP || oppOnMyInk);
  var wantRetreat = selfLowHP && oppTargetable && !oppLowHP && distToOpp < engageDist*0.8;
  // 一度交戦を始めたら、インクが多少減っただけで戦いをやめて塗りへ逃げてしまわないようにする
  // (ヒステリシス: 開始条件はwantEngageより厳しくないが、続行条件はwantEngageより緩い)
  var keepEngaged = mem.engaged && oppTargetable && !wantRetreat && distToOpp <= engageDist*1.8;
  var engaged = wantEngage || keepEngaged;
  mem.engaged = engaged;
  // ローラーがマンタりんぶ発動中は、間合いを気にせずまっすぐ突撃してよい(第6ラウンド:
  // 旧ローラー専用「無敵スペシャル」の判定をp.special==='manta'に置き換えただけで、条件自体は変えていない)
  var specialRush = weapon.key==='roller' && p.specialActive && p.special==='manta' && oppTargetable;
  // チャージャーが「近づかれすぎ」とみなして離脱を優先する間合い(ためている間は無防備なため)
  var chargerIdeal = 11*CELL;
  var chargerTooClose = weapon.key==='charger' && oppTargetable && distToOpp < chargerIdeal;

  if (g.time >= mem.nextDecision){
    mem.nextDecision = g.time + 0.1 + (1-CONFIG.BOT_SKILL)*0.25 + g.rng()*0.12;
    var lowInk = p.ink < 18;
    var toOpp = {x:(opp.x-p.x)/(distToOpp||1), y:(opp.y-p.y)/(distToOpp||1)};
    var awayOpp = {x:-toOpp.x, y:-toOpp.y};
    if (wantRetreat){
      mem.dir = pickCoverageDir(g, idx, p, true); // 自陣インクの多い方へ下がる
    } else if (weapon.key==='roller'){
      if (specialRush || engaged || (oppTargetable && distToOpp < 18*CELL)){
        mem.dir = toOpp; mem.rushing=true; // 近ければ突進
      } else {
        // 遠くにいる敵へレーダーのように直進しない(近接武器なので間合いに入るまでは塗り優先)
        mem.dir = pickCoverageDir(g, idx, p, lowInk, false); mem.rushing=false;
      }
    } else if (weapon.key==='charger'){
      if ((oppLowHP || oppOnMyInk) && oppTargetable && distToOpp < engageDist){
        mem.dir = toOpp; // 弱った敵・自陣インクで減速中の敵はとどめを狙って追う
      } else if (chargerTooClose){
        mem.dir = awayOpp; // 近づかれたらすぐ離れる(近距離はローラー等に弱いため)
      } else {
        // 遠距離での塗りは相手方向バイアスをかけない(距離を保つ武器の持ち味を維持する)
        mem.dir = pickCoverageDir(g, idx, p, lowInk, false);
      }
    } else if (weapon.key==='brush'){
      // フデ: 基本は逃げ回りながら塗る。相手のHPが低いときだけふりはらいで詰める。
      // 詰められた時は単純に反対方向へ直進するとコーナーに追い込まれやすいので、
      // 「未塗り優先+相手と反対方向寄りの重み」を使った coverage 選択で賢く逃げる
      if (oppLowHP && oppTargetable && distToOpp < weapon.swingRange*2.5){
        mem.dir = toOpp;
      } else if (oppTargetable && distToOpp < 8*CELL){
        var fleeBest=null, fleeScore=-Infinity;
        for (var fi=0; fi<BOT_DIRS.length; fi++){
          var fd=BOT_DIRS[fi];
          var fx=p.x+fd.x*4*CELL, fy=p.y+fd.y*4*CELL;
          if (fx<CELL||fx>WORLD_W-CELL||fy<CELL||fy>WORLD_H-CELL||isWallAt(g,fx,fy)) continue;
          var fscore = -(fd.x*toOpp.x+fd.y*toOpp.y); // 相手と反対向きほど高評価
          fscore += (g.rng()-0.5)*0.6;
          if (fscore>fleeScore){ fleeScore=fscore; fleeBest=fd; }
        }
        mem.dir = fleeBest || awayOpp;
      } else {
        // 遠くにいる間は他の武器と同じく軽く相手方向へ寄りつつ塗る(会敵率を確保。
        // 間合いに入れば上のswing判定が拾ってくれるので、通りすがりに一撃入れるチャンスが生まれる)
        mem.dir = pickCoverageDir(g, idx, p, lowInk);
      }
    } else { // shooter, bucket
      if (engaged) mem.dir = toOpp; // 撃ちながら間合いを詰める・撃ち合いを継続する(バケツは中距離を保ちつつ塗り優先)
      else mem.dir = pickCoverageDir(g, idx, p, lowInk);
    }
  }
  input.move = { x: mem.dir.x*(0.7+0.3*g.rng()), y: mem.dir.y*(0.7+0.3*g.rng()) };

  // スペシャル発動中の操作(第6ラウンドで追加。武器固有スペシャル向けの分岐は全て削除し、
  // p.specialの3種に対する最小限の操作だけ行う。許可されているのは「マンタ操作の追加」のみ)
  if (p.specialActive){
    if (p.special==='manta'){
      // マンタ中は無敵・高速なので、敵に向かって突進しつつインク弾を撃つ
      if (oppTargetable){
        var mantaDir = {x:(opp.x-p.x)/(distToOpp||1), y:(opp.y-p.y)/(distToOpp||1)};
        mem.dir = mantaDir;
        input.move = {x:mantaDir.x*(0.85+0.15*g.rng()), y:mantaDir.y*(0.85+0.15*g.rng())};
        input.aim = {x:mantaDir.x, y:mantaDir.y};
        input.fire = true;
      } else {
        input.aim = {x:mem.dir.x, y:mem.dir.y};
        input.fire = false;
      }
    } else if (p.special==='utsubo'){
      // むらさめウツボは向いている方向に降り注ぐので、敵がいれば向きを合わせ続ける
      if (oppTargetable){
        input.aim = {x:(opp.x-p.x)/(distToOpp||1), y:(opp.y-p.y)/(distToOpp||1)};
      } else {
        input.aim = {x:mem.dir.x, y:mem.dir.y};
      }
      input.fire = false;
    } else {
      // せんせいストライクは発動時の向きで固定されるため、以降の入力は不要
      input.fire = false;
    }
  } else if (weapon.key==='shooter'){
    if (los && distToOpp < weapon.range*0.95){
      var ang=Math.atan2(opp.y-p.y, opp.x-p.x);
      ang = botAimJitter(g, ang);
      input.aim={x:Math.cos(ang), y:Math.sin(ang)};
      input.fire = p.ink>0;
    } else {
      input.aim = {x:mem.dir.x, y:mem.dir.y};
      input.fire = p.ink>10;
    }
  } else if (weapon.key==='roller'){
    input.aim = {x:mem.dir.x, y:mem.dir.y};
    // 接触の間合いより少し手前(振りの射程内)から先に振って弱らせておく
    var meleeR = Math.max(p.radius+opp.radius+40, weapon.swingRange*0.9);
    // 第7ラウンド: 塗りたい方向へ移動する間はfireを押し続けて「転がしモード」で塗る。
    // 振りの間合いに入ったら、転がしモードのfireを一瞬離してから短くタップし直す(離した瞬間に振りが出る仕様のため)。
    // 「離す→短く押す→離す」の一連の遷移をmem.rollerReleaseUntil/rollerPulseUntilで管理する。
    var inSwingCycle = mem.rollerPulseUntil && g.time < mem.rollerPulseUntil;
    if (!inSwingCycle && oppTargetable && distToOpp < meleeR && p.swingCooldown<=0){
      mem.rollerReleaseUntil = g.time + FIXED_DT*2; // まず一瞬離す(転がしモード解除)
      mem.rollerPulseUntil = mem.rollerReleaseUntil + FIXED_DT*2; // その後すぐ短くタップ(TAP_MAX_DURATION未満)
      inSwingCycle = true;
    }
    if (inSwingCycle){
      if (g.time < mem.rollerReleaseUntil){
        input.fire = false;
      } else {
        var swAng=Math.atan2(opp.y-p.y, opp.x-p.x);
        input.aim={x:Math.cos(swAng),y:Math.sin(swAng)};
        input.fire = true;
      }
    } else {
      // 転がしモード: 塗りたい方向へ移動している間はfireを押し続ける(既存の判断は変えない)
      input.fire = !!(mem.dir.x || mem.dir.y);
    }
  } else if (weapon.key==='charger'){
    if (p.charging){
      input.fire = g.time < (mem.chargeReleaseAt||0);
      var tgtAng = los ? Math.atan2(opp.y-p.y,opp.x-p.x) : mem.chargeAng;
      input.aim = {x:Math.cos(tgtAng), y:Math.sin(tgtAng)};
      if (!input.fire) { input.aim = {x:Math.cos(mem.chargeAng), y:Math.sin(mem.chargeAng)}; }
    } else {
      var wantCharge=false, ang3=mem.dir.x||mem.dir.y ? Math.atan2(mem.dir.y,mem.dir.x) : p.angle;
      var danger = distToOpp < 4*CELL; // 接近戦は不利なので近距離でも撃って防衛する
      // 離脱すべき間合い(chargerTooClose)ではために入らず素直に逃げる。
      // ただし本当に至近(danger)まで詰められたら、逃げても間に合わないので早撃ちで迎撃する
      if (los && distToOpp < weapon.maxRange && (!chargerTooClose || danger)){
        wantCharge=true; ang3=Math.atan2(opp.y-p.y,opp.x-p.x);
      } else if (!chargerTooClose && (!mem.nextPaintShot || g.time>=mem.nextPaintShot)){
        // 敵がいなければマップの長辺(縦)に沿って長いビームで塗る
        wantCharge=true;
        var targetY = p.y < WORLD_H/2 ? WORLD_H-CELL : CELL;
        var targetX = clamp(p.x + (g.rng()*2-1)*CELL*8, CELL, WORLD_W-CELL);
        ang3 = Math.atan2(targetY-p.y, targetX-p.x);
        mem.nextPaintShot = g.time + 1.2 + g.rng()*1.0;
      }
      if (wantCharge && p.ink>=8){
        input.fire=true;
        input.aim={x:Math.cos(ang3), y:Math.sin(ang3)};
        mem.chargeAng = botAimJitter(g, ang3);
        // 近距離で危険なときは即座に撃って迎撃。中距離で見つかっている間は長くためるほど
        // 撃たれ続けて先に倒されてしまうので早めに離す。遠くて安全なうちだけじっくりためて一撃を狙う
        var farSafe = distToOpp > 26*CELL;
        mem.chargeReleaseAt = danger ? g.time + 0.05
          : farSafe ? g.time + 0.5 + CONFIG.BOT_SKILL*0.5*(0.5+g.rng()*0.5)
          : g.time + 0.15 + CONFIG.BOT_SKILL*0.15*g.rng();
      }
    }
  } else if (weapon.key==='bucket'){
    // バケツ: 壁を越えて届くのでLOSを問わず射程内なら中距離で撃つ。塗り優先で進みながらでも適度に撃つ
    if (oppTargetable && distToOpp < weapon.range*0.98){
      var angBk=botAimJitter(g, Math.atan2(opp.y-p.y, opp.x-p.x));
      input.aim={x:Math.cos(angBk), y:Math.sin(angBk)};
      input.fire = p.ink>=weapon.inkPerShot;
    } else {
      input.aim = {x:mem.dir.x, y:mem.dir.y};
      input.fire = p.ink>=weapon.inkPerShot*1.4; // 塗り優先。インクに余裕がある時だけ道すがら撃つ
    }
  } else if (weapon.key==='brush'){
    input.aim = {x:mem.dir.x, y:mem.dir.y};
    var meleeRB = weapon.swingRange*0.9;
    // 実機フィードバックでふりはらいがタップ単発→押しっぱなし連打に変わったため、ボットの入力も
    // 「間合いに入ったら撃ち続ける(=振り続ける)」という最小限の読み替えだけ行う
    if (oppTargetable && distToOpp < meleeRB){
      var swAngB=Math.atan2(opp.y-p.y, opp.x-p.x);
      input.aim={x:Math.cos(swAngB),y:Math.sin(swAngB)};
      input.fire = true;
    } else {
      input.fire = false;
    }
  }

  // スペシャル発動の判断(第6ラウンドで追加。ゲージ満タン時にのみ許可された最小限の判断):
  // sensei=向き±20°以内かつ30セル以内、utsubo=前方16セル以内 or 相手色の多い方向を向いている、manta=12セル以内
  if (p.sp>=SPECIAL_GAUGE_MAX && !p.specialActive){
    var wantSpecial=false;
    if (p.special==='sensei'){
      if (oppTargetable){
        var sAng=Math.atan2(opp.y-p.y,opp.x-p.x);
        var angDiff=Math.atan2(Math.sin(sAng-p.angle),Math.cos(sAng-p.angle));
        if (Math.abs(angDiff)<=20*Math.PI/180 && distToOpp<=30*CELL){
          input.aim={x:Math.cos(sAng),y:Math.sin(sAng)};
          wantSpecial=true;
        }
      }
    } else if (p.special==='utsubo'){
      var spU=SPECIALS.utsubo;
      var forwardOpp = oppTargetable && distToOpp<=16*CELL &&
        ((opp.x-p.x)*Math.cos(p.angle)+(opp.y-p.y)*Math.sin(p.angle))>0;
      var facingEnemyColor = forwardColorFrac(g, p, p.angle, spU.widthCells, spU.depthCells, 2-idx) >= 0.3;
      wantSpecial = forwardOpp || facingEnemyColor;
    } else if (p.special==='manta'){
      wantSpecial = oppTargetable && distToOpp<=12*CELL;
    }
    if (wantSpecial) input.special=true;
  }

  // サブの判断: 投げ物系(スプラッシュボム/クイックボム)は「サブ→メイン射撃」の優先順で、
  // 条件を満たしたらこのティックのメイン射撃を取りやめてサブを投げる(第5.1ラウンドで追加)。
  // インクが足りない時は、敵が遠ければ一旦撃つのをやめて自陣インクの上へ寄り、回復してから使う「温存モード」。
  // (シールド・スプリンクラー(未設置時)も「発動に必要なインクを普段から少し蓄えておく」形で
  //  同じ温存モードの対象にしている。ただし遠距離が続く間ずっと温存し続けると本来の塗り・接近行動が
  //  止まってしまうため、温存モードは1回最大3秒までとし、明けたら`nextReserveAllowed`で
  //  数秒(既定8〜12秒)は再突入させないようにして、既存3種を含む全体の勝率バランスへの影響を抑えている)
  var subDef = SUBS[p.sub];
  var isBombSub = subDef && (subDef.key==='splashbomb' || subDef.key==='quickbomb');
  var isShieldSub = subDef && subDef.key==='shield';
  var isSprinklerSub = subDef && subDef.key==='sprinkler';
  var hasOwnSprinkler = false;
  if (isSprinklerSub) for (var spi=0; spi<g.sprinklers.length; spi++) if (g.sprinklers[spi].ownerIdx===idx){ hasOwnSprinkler=true; break; }
  var bombAttemptReady = !mem.nextBombAttempt || g.time>=mem.nextBombAttempt;

  if (isBombSub && p.subCooldown<=0 && bombAttemptReady){
    var canAffordBomb = p.ink >= subDef.inkCost+5;
    var inThrowRange = oppTargetable && distToOpp<=subDef.throwDist+40 && distToOpp>=CELL*1.0;
    if (canAffordBomb && inThrowRange){
      mem.subReserveActive=false;
      input.fire=false;
      input.sub=true;
      var bombAng=Math.atan2(opp.y-p.y, opp.x-p.x);
      input.aim={x:Math.cos(bombAng), y:Math.sin(bombAng)};
      // 投げた後の再投げ待ち。サブごとに botThrowGap(最短) + botThrowGapSpan(ゆらぎ) 秒あける。
      // 省略時は従来どおり 5 + 0〜5 秒(1試合3〜12回程度)
      var throwGap = subDef.botThrowGap!=null ? subDef.botThrowGap : 5;
      var throwSpan = subDef.botThrowGapSpan!=null ? subDef.botThrowGapSpan : 5;
      mem.nextBombAttempt = g.time + throwGap + g.rng()*throwSpan;
    }
  }
  if ((isBombSub || isShieldSub || (isSprinklerSub && !hasOwnSprinkler)) && p.subCooldown<=0 && !input.sub){
    var reserveCostNeeded = isBombSub ? subDef.inkCost+5 : subDef.inkCost;
    var canAffordReserve = p.ink >= reserveCostNeeded;
    var safeToReserve = !oppTargetable || distToOpp>engageDist;
    if (!canAffordReserve && safeToReserve &&
        (!mem.nextReserveAllowed || g.time>=mem.nextReserveAllowed) && !mem.subReserveActive){
      mem.subReserveActive=true;
      mem.subReserveUntil=g.time+3.0; // 安全上限(この時間で必要量に届かなくても切り上げる)
    }
    if (mem.subReserveActive){
      // 「1秒ほど」を目安に、必要量まで貯まるか上限時間に達したら終える(自陣インク上なら+35/秒で早く貯まる)
      if (p.ink<reserveCostNeeded && g.time<mem.subReserveUntil){
        input.fire=false;
      } else {
        mem.subReserveActive=false;
        mem.nextReserveAllowed=g.time+8+g.rng()*4;
      }
    }
  }
  if (!input.sub) input.sub = botDecideSub(g, idx, p, opp, weapon, distToOpp, oppTargetable, input);
  return input;
}

// サブウェポンのボット判断(共通)。投げ物系は上のbotDecide内で優先処理済みのためここには来ない。
// スプリンクラーは未塗り・相手色が多い方向をねらって置く、シールドは直近で撃たれている(被弾)時に使う
function botDecideSub(g, idx, p, opp, weapon, distToOpp, oppTargetable, input){
  var sub = SUBS[p.sub];
  if (!sub || p.subCooldown>0 || p.ink<sub.inkCost) return false;
  if (sub.key==='splashbomb' || sub.key==='quickbomb'){
    return false; // botDecide側の優先ロジックで処理済み
  } else if (sub.key==='sprinkler'){
    var already=false;
    for (var i=0;i<g.sprinklers.length;i++) if (g.sprinklers[i].ownerIdx===idx){ already=true; break; }
    if (already) return false;
    var unpaintedNear = countUnpaintedNear(g, p.x, p.y, 6);
    if (unpaintedNear < (sub.botMinUnpainted!=null ? sub.botMinUnpainted : 4)) return false;
    // 未塗り・相手色が多い方向へ向いてから置く
    var sprinklerDir = pickCoverageDir(g, idx, p, false, false);
    if (input) input.aim = {x:sprinklerDir.x, y:sprinklerDir.y};
    return true;
  } else if (sub.key==='shield'){
    // botHitWindow: 直近この秒数以内に撃たれていたら「守るべき場面」とみなす(省略時2.0)
    var hitWindow = sub.botHitWindow!=null ? sub.botHitWindow : 2.0;
    var recentlyHit = (g.time - (p.lastHitAt!=null?p.lastHitAt:-999)) < hitWindow;
    var threatWeapon = oppTargetable && (opp.weapon==='shooter' || opp.weapon==='charger' || opp.weapon==='bucket');
    // botProactiveCells: まだ撃たれていなくても、相手がこのセル数まで近づいたら先置きする(0/省略で無効)
    var proactiveCells = sub.botProactiveCells!=null ? sub.botProactiveCells : 0;
    var proactive = proactiveCells>0 && oppTargetable && distToOpp <= proactiveCells*CELL;
    if (proactive && input){
      var shieldAng = Math.atan2(opp.y-p.y, opp.x-p.x);
      input.aim = {x:Math.cos(shieldAng), y:Math.sin(shieldAng)};
    }
    return (recentlyHit && threatWeapon) || proactive;
  }
  return false;
}

function countUnpaintedNear(g, x, y, radiusCells){
  var cx=Math.floor(x/CELL), cy=Math.floor(y/CELL);
  var cnt=0;
  for (var oy=-radiusCells; oy<=radiusCells; oy+=2){
    for (var ox=-radiusCells; ox<=radiusCells; ox+=2){
      var gx=cx+ox, gy=cy+oy;
      if (gx<0||gx>=GRID_W||gy<0||gy>=GRID_H) continue;
      if (g.grid[gy*GRID_W+gx]===0) cnt++;
    }
  }
  return cnt;
}

/* ==================== 8. 入力(タッチ / キーボード・マウス フォールバック) ==================== */
var touchState = {};       // pointerId -> {player,kind,anchorX,anchorY,curX,curY}
var specialPulse = {1:false, 2:false};
var subPulse = {1:false, 2:false};
var keysDown = {};
var mouseState = {x:0,y:0,down:false};

function setupInput(){
  document.querySelectorAll('.padzone').forEach(function(zone){
    var player=+zone.dataset.player, kind=zone.dataset.kind;
    zone.addEventListener('pointerdown', function(e){
      e.preventDefault();
      try{ zone.setPointerCapture(e.pointerId); }catch(err){}
      touchState[e.pointerId] = {player:player, kind:kind, anchorX:e.clientX, anchorY:e.clientY, curX:e.clientX, curY:e.clientY};
      updateStickVisual(e.pointerId, true);
      zone.classList.add('touched'); // 触ったらヒントの点線円をフェードアウト
    }, {passive:false});
    zone.addEventListener('pointermove', function(e){
      var s=touchState[e.pointerId]; if (!s) return;
      e.preventDefault();
      s.curX=e.clientX; s.curY=e.clientY;
      updateStickVisual(e.pointerId, true);
    }, {passive:false});
    function release(e){
      if (!touchState[e.pointerId]) return;
      delete touchState[e.pointerId];
      updateStickVisual(e.pointerId, false);
    }
    zone.addEventListener('pointerup', release);
    zone.addEventListener('pointercancel', release);
  });
  document.querySelectorAll('.specialBtn').forEach(function(btn){
    var player=+btn.dataset.player;
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault(); e.stopPropagation();
      specialPulse[player]=true;
    }, {passive:false});
  });
  document.querySelectorAll('.subBtn').forEach(function(btn){
    var player=+btn.dataset.player;
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault(); e.stopPropagation();
      subPulse[player]=true;
    }, {passive:false});
  });
  window.addEventListener('keydown', function(e){
    keysDown[e.key.toLowerCase()]=true;
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(e.key.toLowerCase())>=0) e.preventDefault();
  });
  window.addEventListener('keyup', function(e){ keysDown[e.key.toLowerCase()]=false; });
  // マウスの位置・ボタン状態はpointerイベントで追う。
  // padzone側でpointerdownをpreventDefault()すると後続のmousedown/upが抑止されてしまうため。
  window.addEventListener('pointermove', function(e){ if (e.pointerType==='mouse'){ mouseState.x=e.clientX; mouseState.y=e.clientY; } });
  window.addEventListener('pointerdown', function(e){ if (e.pointerType==='mouse' && e.button===0) mouseState.down=true; });
  window.addEventListener('pointerup', function(e){ if (e.pointerType==='mouse' && e.button===0) mouseState.down=false; });
  window.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

// フローティングスティックの見た目(簡易)
var stickEls = {};
