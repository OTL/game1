  if (sub.key==='splashbomb' || sub.key==='quickbomb'){
    return false; // botDecide側の優先ロジックで処理済み
  } else if (sub.key==='sprinkler'){
    var already=false;
    for (var i=0;i<g.sprinklers.length;i++) if (g.sprinklers[i].ownerIdx===idx){ already=true; break; }
    if (already) return false;
    // 第11ラウンド: 置き先(飛距離ぶん先)の「自分色でないセル」の多さで判断する。
    // 従来は自分の足元の未塗りセル数だけを見ていたので、相手色の上には置きに行けなかった
    var sprinklerDir = pickSubThrowDir(g, idx, p, sub.throwDist, Math.round(sub.radius));
    if (!sprinklerDir) return false;
    if (sprinklerDir.cells < (sub.botMinUnpainted!=null ? sub.botMinUnpainted : 4)) return false;
    if (input) input.aim = {x:sprinklerDir.x, y:sprinklerDir.y};
    return true;
  } else if (sub.key==='shield'){
    // botHitWindow: 直近この秒数以内に撃たれていたら「守るべき場面」とみなす(省略時2.0)
    var hitWindow = sub.botHitWindow!=null ? sub.botHitWindow : 2.0;
    var recentlyHit = (g.time - (p.lastHitAt!=null?p.lastHitAt:-999)) < hitWindow;
    var threatWeapon = oppTargetable && (opp.weapon==='shooter' || opp.weapon==='charger' || opp.weapon==='bucket');
    // botProactiveCells: まだ撃たれていなくても、相手がこのセル数まで近づいたら先置きする(0/省略で無効)
    var proactiveCells = sub.botProactiveCells!=null ? sub.botProactiveCells : 0;
    var proactive = proactiveCells>0 && oppTargetable && distToOpp <= proactiveCells*CELL;
    if (proactive && input){
      var shieldAng = Math.atan2(opp.y-p.y, opp.x-p.x);
      input.aim = {x:Math.cos(shieldAng), y:Math.sin(shieldAng)};
    }
    return (recentlyHit && threatWeapon) || proactive;
  }
  return false;
}

// (x,y)のまわりで「自分色でないセル」(未塗り+相手色。壁は除く)を数える。サブを塗りに使う判断に使用(第11ラウンド)
function countRepaintableNear(g, x, y, radiusCells, idx){
  var cx=Math.floor(x/CELL), cy=Math.floor(y/CELL);
  var mine=idx+1, cnt=0;
  for (var oy=-radiusCells; oy<=radiusCells; oy++){
    for (var ox=-radiusCells; ox<=radiusCells; ox++){
      if (ox*ox+oy*oy > radiusCells*radiusCells) continue;
      var gx=cx+ox, gy=cy+oy;
      if (gx<0||gx>=GRID_W||gy<0||gy>=GRID_H) continue;
      var c=g.grid[gy*GRID_W+gx];
      if (c!==9 && c!==mine) cnt++;
    }
  }
  return cnt;
}

// サブを「塗るため」に使うときの向き。飛距離ぶん先の着弾点で、自分色でないセルがいちばん多い方向を選ぶ。
// 返り値は {x,y,cells}(cells=その着弾点で塗り直せるセル数)
function pickSubThrowDir(g, idx, p, distPx, radiusCells){
  var best=null, bestCells=-1;
  for (var i=0;i<BOT_DIRS.length;i++){
    var d=BOT_DIRS[i];
    var tx=clamp(p.x+d.x*distPx, CELL, WORLD_W-CELL), ty=clamp(p.y+d.y*distPx, CELL, WORLD_H-CELL);
    if (isWallAt(g,tx,ty)) continue;
    var c=countRepaintableNear(g, tx, ty, radiusCells, idx);
    c += (g.rng()-0.5)*6*(1-CONFIG.BOT_SKILL); // ボットの強さに応じたゆらぎ(他の判断と同じ扱い)
    if (c>bestCells){ bestCells=c; best=d; }
  }
  if (!best) return null;
  return {x:best.x, y:best.y, cells:bestCells};
}


/* ==================== 8. 入力(タッチ / キーボード・マウス フォールバック) ==================== */
var touchState = {};       // pointerId -> {player,kind,anchorX,anchorY,curX,curY}
var specialPulse = {1:false, 2:false};
var subPulse = {1:false, 2:false};
var keysDown = {};
var mouseState = {x:0,y:0,down:false};

function setupInput(){
  document.querySelectorAll('.padzone').forEach(function(zone){
    var player=+zone.dataset.player, kind=zone.dataset.kind;
    zone.addEventListener('pointerdown', function(e){
      e.preventDefault();
      try{ zone.setPointerCapture(e.pointerId); }catch(err){}
      touchState[e.pointerId] = {player:player, kind:kind, anchorX:e.clientX, anchorY:e.clientY, curX:e.clientX, curY:e.clientY};
      updateStickVisual(e.pointerId, true);
      zone.classList.add('touched'); // 触ったらヒントの点線円をフェードアウト
    }, {passive:false});
    zone.addEventListener('pointermove', function(e){
      var s=touchState[e.pointerId]; if (!s) return;
      e.preventDefault();
      s.curX=e.clientX; s.curY=e.clientY;
      updateStickVisual(e.pointerId, true);
    }, {passive:false});
    function release(e){
      if (!touchState[e.pointerId]) return;
      delete touchState[e.pointerId];
      updateStickVisual(e.pointerId, false);
    }
    zone.addEventListener('pointerup', release);
    zone.addEventListener('pointercancel', release);
  });
  document.querySelectorAll('.specialBtn').forEach(function(btn){
    var player=+btn.dataset.player;
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault(); e.stopPropagation();
      specialPulse[player]=true;
    }, {passive:false});
  });
  document.querySelectorAll('.subBtn').forEach(function(btn){
    var player=+btn.dataset.player;
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault(); e.stopPropagation();
      subPulse[player]=true;
    }, {passive:false});
  });
  window.addEventListener('keydown', function(e){
    keysDown[e.key.toLowerCase()]=true;
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(e.key.toLowerCase())>=0) e.preventDefault();
  });
  window.addEventListener('keyup', function(e){ keysDown[e.key.toLowerCase()]=false; });
  // マウスの位置・ボタン状態はpointerイベントで追う。
  // padzone側でpointerdownをpreventDefault()すると後続のmousedown/upが抑止されてしまうため。
  window.addEventListener('pointermove', function(e){ if (e.pointerType==='mouse'){ mouseState.x=e.clientX; mouseState.y=e.clientY; } });
  window.addEventListener('pointerdown', function(e){ if (e.pointerType==='mouse' && e.button===0) mouseState.down=true; });
  window.addEventListener('pointerup', function(e){ if (e.pointerType==='mouse' && e.button===0) mouseState.down=false; });
  window.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

// フローティングスティックの見た目(簡易)
var stickEls = {};
function updateStickVisual(pid, show){
  var s=touchState[pid];
  var wrap=stickEls[pid];
  if (!show || !s){
    if (wrap){ wrap.base.style.display='none'; wrap.knob.style.display='none'; }
    return;
  }
  if (!wrap){
    var base=document.createElement('div'); base.className='stick';
    var knob=document.createElement('div'); knob.className='stick knob';
    document.body.appendChild(base); document.body.appendChild(knob);
    wrap=stickEls[pid]={base:base,knob:knob};
  }
  wrap.base.style.display='block'; wrap.knob.style.display='block';
  wrap.base.style.left=s.anchorX+'px'; wrap.base.style.top=s.anchorY+'px';
  var dx=s.curX-s.anchorX, dy=s.curY-s.anchorY;
  var dist=Math.min(STICK_RADIUS, Math.hypot(dx,dy));
  var ang=Math.atan2(dy,dx);
  wrap.knob.style.left=(s.anchorX+Math.cos(ang)*dist)+'px';
  wrap.knob.style.top=(s.anchorY+Math.sin(ang)*dist)+'px';
}

function screenToWorld(canvas, clientX, clientY){
  var rect=canvas.getBoundingClientRect();
  return {
    x: (clientX-rect.left)/rect.width*WORLD_W,
    y: (clientY-rect.top)/rect.height*WORLD_H,
  };
}

function readTouchChannel(playerNum, kind){
  for (var id in touchState){
    var s=touchState[id];
    if (s.player!==playerNum || s.kind!==kind) continue;
    var dx=s.curX-s.anchorX, dy=s.curY-s.anchorY;
    // P2も画面座標のまま使う。CSSのrotate(180deg)はHUD/パッドの見た目だけを回転させており、
    // pointerイベントのclientX/clientYとワールド座標(yは下向き正)は両プレイヤーとも画面座標系で一致する。
    return {dx:dx, dy:dy};
  }
  return null;
}

function readLiveInput(i, game){
  var playerNum=i+1;
  var move={x:0,y:0}, aim=null, fire=false;

  var mCh=readTouchChannel(playerNum,'move');
  if (mCh){
    var dist=Math.hypot(mCh.dx,mCh.dy);
    if (dist>3){ var frac=Math.min(1,dist/STICK_RADIUS); move={x:mCh.dx/dist*frac, y:mCh.dy/dist*frac}; }
  }
  var aCh=readTouchChannel(playerNum,'aim');
  if (aCh){
    fire=true;
    var adist=Math.hypot(aCh.dx,aCh.dy);
    if (adist>AIM_DEADZONE) aim={x:aCh.dx/adist, y:aCh.dy/adist};
  }

  if (move.x===0 && move.y===0){
    var km = i===0 ? readKeysMove(['w','a','s','d']) : readKeysMove(['arrowup','arrowleft','arrowdown','arrowright']);
    if (km) move=km;
  }
  if (!aCh){
    if (i===0){
      var canvas=document.getElementById('gameCanvas');
      if (mouseState.down){
        fire=true;
        var wp = is3D() ? screenToWorld3D(mouseState.x, mouseState.y)
                        : screenToWorld(canvas, mouseState.x, mouseState.y);
        var dx=wp.x-game.players[0].x, dy=wp.y-game.players[0].y;
        var d=Math.hypot(dx,dy);
        if (d>2) aim={x:dx/d, y:dy/d};
      }
    } else {
      var ix=0, iy=0;
      if (keysDown['i']) iy-=1;
      if (keysDown['k']) iy+=1;
      if (keysDown['j']) ix-=1;
      if (keysDown['l']) ix+=1;
      if (ix||iy){
        fire=true;
        var l=Math.hypot(ix,iy);
        aim={x:ix/l, y:iy/l};
      }
    }
  }

  var special=false;
  var key = (i===0)?'e':'o';
  if (specialPulse[playerNum]){ special=true; specialPulse[playerNum]=false; }
  if (!special && keysDown[key] && !keysDown['_prev_'+key]){ special=true; }
  keysDown['_prev_'+key]=!!keysDown[key];

  var sub=false;
  var subKey = (i===0)?'r':'u';
  if (subPulse[playerNum]){ sub=true; subPulse[playerNum]=false; }
  if (!sub && keysDown[subKey] && !keysDown['_prev_'+subKey]){ sub=true; }
  keysDown['_prev_'+subKey]=!!keysDown[subKey];

  return {move:move, aim: aim||{x:0,y:0}, fire:fire, special:special, sub:sub};
}

function readKeysMove(keys){ // [up,left,down,right]
  var x=0,y=0;
  if (keysDown[keys[0]]) y-=1;
  if (keysDown[keys[1]]) x-=1;
  if (keysDown[keys[2]]) y+=1;
  if (keysDown[keys[3]]) x+=1;
  if (!x&&!y) return null;
  var l=Math.hypot(x,y);
  return {x:x/l, y:y/l};
}

function updateInputsForTick(g){
  for (var i=0;i<2;i++){
    var p=g.players[i];
    if (p.forced) p.input = p.forced;
    else if (p.isBot) p.input = botDecide(g,i);
    else if (g.live) p.input = readLiveInput(i,g);
    else p.input = {move:{x:0,y:0}, aim:{x:0,y:0}, fire:false, special:false};
  }
}

/* ==================== 9. 描画 ==================== */
function drawWalls(ctx, g){
  ctx.fillStyle=COLOR.wall;
  ctx.strokeStyle=COLOR.wallEdge;
  ctx.lineWidth=2;
  for (var i=0;i<g.wallsPx.length;i++){
    var w=g.wallsPx[i];
    ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.strokeRect(w.x+1,w.y+1,w.w-2,w.h-2);
  }
}

function drawChargeRings(ctx, g){
  for (var i=0;i<2;i++){
    var p=g.players[i];
    if (p.weapon==='charger' && p.charging && p.alive){
      var weapon=WEAPONS.charger;
      var frac=clamp(p.charge/weapon.maxCharge,0,1);
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.radius+6+10*frac,0,Math.PI*2);
      ctx.strokeStyle = frac>=1 ? '#ffe08a' : 'rgba(255,255,255,0.6)';
      ctx.lineWidth=3;
      ctx.stroke();
    }
  }
}

function drawBullets(ctx, g){
  for (var i=0;i<g.bullets.length;i++){
    var b=g.bullets[i];
    ctx.fillStyle = b.owner===0 ? COLOR.p1 : COLOR.p2;
    if (b.weaponKey==='manta'){
      ctx.beginPath(); ctx.arc(b.x,b.y,6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(b.x,b.y,3.2,0,Math.PI*2); ctx.fill();
    }
  }
}

function drawParticles(ctx, g){
  for (var i=0;i<g.particles.length;i++){
    var pt=g.particles[i];
    if (pt.ring){
      var rt=clamp(pt.age/pt.life,0,1);
      var rr2=pt.r0+(pt.r1-pt.r0)*(1-(1-rt)*(1-rt)); // 最初はいきおいよく、終わりはゆっくり広がる
      ctx.save();
      ctx.globalAlpha=(1-rt)*pt.alpha;
      ctx.strokeStyle= pt.white ? '#ffffff' : (pt.owner===0?COLOR.p1:COLOR.p2);
      ctx.lineWidth=Math.max(0.8, pt.w*(1-rt*0.65));
      ctx.beginPath(); ctx.arc(pt.x,pt.y,Math.max(0.5,rr2),0,Math.PI*2); ctx.stroke();
      ctx.restore();
      continue;
    }
    if (pt.streak){
      var st=clamp(pt.age/pt.life,0,1);
      ctx.save();
      ctx.globalAlpha=1-st;
      ctx.lineCap='round';
      ctx.strokeStyle= pt.owner===0?COLOR.p1:COLOR.p2;
      ctx.lineWidth=pt.w*(1-st*0.5);
      ctx.beginPath(); ctx.moveTo(pt.x1,pt.y1); ctx.lineTo(pt.x2,pt.y2); ctx.stroke();
      if (pt.white){
        ctx.strokeStyle='rgba(255,255,255,0.9)';
        ctx.lineWidth=Math.max(1, pt.w*0.35*(1-st*0.5));
        ctx.beginPath(); ctx.moveTo(pt.x1,pt.y1); ctx.lineTo(pt.x2,pt.y2); ctx.stroke();
      }
      ctx.restore();
      continue;
    }
    if (pt.beam){
      var a=1-pt.age/pt.life;
      ctx.strokeStyle = (pt.owner===0?'rgba(255,122,26,':'rgba(63,160,255,')+ (a*0.9) +')';
      ctx.lineWidth=4*a+1;
      ctx.beginPath(); ctx.moveTo(pt.x1,pt.y1); ctx.lineTo(pt.x2,pt.y2); ctx.stroke();
      continue;
    }
    var alpha=1-pt.age/pt.life;
    if (alpha<=0) continue;
    ctx.globalAlpha=alpha;
    ctx.fillStyle = pt.owner===0?COLOR.p1:COLOR.p2;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fill();
    // 自分の色の上に飛んだしぶきが埋もれないよう、白い縁をつける
    ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1; ctx.stroke();
    ctx.globalAlpha=1;
  }
}

// サブウェポンの投擲物: 影+高さの縮尺で放物線っぽく飛んでいるように見せる
function drawSubThrows(ctx, g){
  for (var i=0;i<g.subThrows.length;i++){
    var b=g.subThrows[i];
    var col = b.owner===0 ? COLOR.p1 : COLOR.p2;
    if (!b.landed){
      var t=clamp(b.age/b.travelTime,0,1);
      var x=b.x0+(b.x-b.x0)*t, y=b.y0+(b.y-b.y0)*t;
      var arcH=Math.sin(Math.PI*t)*26; // 山なりの高さ
      // 影(地面の着地予定地点)
      ctx.fillStyle='rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(x,y,7,3.5,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(x,y-arcH,b.kind==='quickbomb'?5:6.5,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=1.2; ctx.stroke();
    } else {
      // 着地して起爆待ち: 本体を明滅させつつ、爆発範囲を細い輪で予告する(巻き込まれる前に逃げられるように)
      var pulse=0.6+0.4*Math.sin(g.time*14);
      var rr=(b.sub.radius||0)*CELL;
      var warn=clamp(1-(b.fuse>0 ? b.age/b.fuse : 1),0,1); // 起爆が近いほど輪が濃く・太くなる
      if (rr>0){
        ctx.save();
        ctx.globalAlpha=0.25+0.5*(1-warn);
        ctx.strokeStyle=col; ctx.lineWidth=1.5+2.5*(1-warn);
        ctx.setLineDash([6,5]);
        ctx.beginPath(); ctx.arc(b.x,b.y,rr,0,Math.PI*2); ctx.stroke();
        ctx.restore();
      }
      ctx.globalAlpha=pulse;
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(b.x,b.y,6.5+2*(1-warn),0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}

function drawSprinklers(ctx, g){
  for (var i=0;i<g.sprinklers.length;i++){
    var s=g.sprinklers[i];
    var col = s.ownerIdx===0 ? COLOR.p1 : COLOR.p2;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(g.time*4);
    ctx.strokeStyle=col; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(9,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(0,9); ctx.stroke();
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawShields(ctx, g){
  for (var i=0;i<g.shields.length;i++){
    var sh=g.shields[i];
    var col = sh.ownerIdx===0 ? COLOR.p1 : COLOR.p2;
    var x1=sh.cx-sh.dx*sh.halfLen, y1=sh.cy-sh.dy*sh.halfLen;
    var x2=sh.cx+sh.dx*sh.halfLen, y2=sh.cy+sh.dy*sh.halfLen;
    ctx.save();
    ctx.globalAlpha=0.55;
    ctx.strokeStyle=col;
    ctx.lineWidth=sh.thickness*2;
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.globalAlpha=0.85;
    ctx.lineWidth=3;
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.restore();
  }
}

// 頭上の小さなHPバー(自分色の枠+HPで色が変わるバー)
function drawHpBar(ctx, p, col, visualRadius){
  // 第7ラウンド: 見た目のキャラサイズ(visualRadius、当たり判定のp.radiusとは別)を基準に頭上の位置を決める。
  // また、この関数は(ctx.translateされていない)絶対座標で呼ばれるので、p.x/p.yを明示的に足す
  var vr = visualRadius!=null ? visualRadius : p.radius;
  var w=vr*1.6, h=4, x=p.x-w/2, y=p.y-vr-14;
  var frac=clamp(p.hp/100,0,1);
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle = frac>0.5 ? '#57e08a' : (frac>0.2 ? '#ffcc4d' : '#ff5252');
  ctx.fillRect(x,y,w*frac,h);
  ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.strokeRect(x-1,y-1,w+2,h+2);
  ctx.restore();
}

// リスポーンまでのカウントダウン(3,2,1)をキャラの死亡位置に表示する
function drawRespawnCountdown(ctx, p, col){
  if (p.respawnTimer<=0) return;
  var n=Math.ceil(p.respawnTimer);
  ctx.save();
  ctx.globalAlpha=0.85;
  ctx.beginPath();
  ctx.fillStyle='rgba(6,10,22,0.55)';
  ctx.arc(p.x,p.y,20,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=col;
  ctx.font='bold 26px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(n>0?String(n):'GO', p.x, p.y);
  ctx.restore();
}

/* ---- アバター描画(第6ラウンド。すべてCanvasで描く。ゲームロジックには影響しない) ---- */
function drawAvatarStar(ctx,cx,cy,r){
  ctx.beginPath();
  for (var i=0;i<5;i++){
    var a=-Math.PI/2+i*(Math.PI*2/5);
    var x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    var a2=a+Math.PI/5;
    ctx.lineTo(cx+Math.cos(a2)*r*0.45, cy+Math.sin(a2)*r*0.45);
  }
  ctx.closePath(); ctx.fill();
}
function drawAvatarEyes(ctx, kind, r){
  var ex=r*0.32, ey=r*0.32;
  ctx.save();
  if (kind==='tsuri'){
    ctx.strokeStyle='#101018'; ctx.lineWidth=Math.max(1,r*0.11); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(ex-r*0.15,-ey-r*0.14); ctx.lineTo(ex+r*0.18,-ey+r*0.02); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex-r*0.15, ey+r*0.14); ctx.lineTo(ex+r*0.18, ey-r*0.02); ctx.stroke();
  } else if (kind==='nemui'){
    ctx.strokeStyle='#101018'; ctx.lineWidth=Math.max(1,r*0.1); ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(ex,-ey,r*0.17,Math.PI*0.1,Math.PI*0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex, ey,r*0.17,Math.PI*0.1,Math.PI*0.9); ctx.stroke();
  } else {
    var offY = kind==='tare' ? r*0.07 : 0;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(ex,-ey+offY, r*0.19,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex, ey+offY, r*0.19,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#101018';
    if (kind==='hoshi'){
      drawAvatarStar(ctx, ex+r*0.03,-ey+offY, r*0.12);
      drawAvatarStar(ctx, ex+r*0.03, ey+offY, r*0.12);
    } else {
      ctx.beginPath(); ctx.arc(ex+r*0.05,-ey+offY, r*0.12,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex+r*0.05, ey+offY, r*0.12,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}
function drawAvatarAccessory(ctx, kind, r){
  if (!kind || kind==='none') return;
  ctx.save();
  if (kind==='cap'){
    ctx.fillStyle='#e05a5a';
    ctx.beginPath(); ctx.arc(0,0, r*0.8, -Math.PI*0.62, Math.PI*0.62); ctx.lineTo(r*0.15,0); ctx.closePath(); ctx.fill();
  } else if (kind==='ribbon'){
    ctx.fillStyle='#ff6fae';
    ctx.beginPath(); ctx.moveTo(-r*0.15,-r*0.65); ctx.lineTo(-r*0.5,-r*0.9); ctx.lineTo(-r*0.5,-r*0.4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-r*0.15,-r*0.65); ctx.lineTo(-r*0.5,-r*0.4); ctx.lineTo(-r*0.1,-r*0.45); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(-r*0.15,-r*0.65, r*0.09,0,Math.PI*2); ctx.fill();
  } else if (kind==='headphone'){
    ctx.strokeStyle='#333'; ctx.lineWidth=Math.max(1,r*0.16);
    ctx.beginPath(); ctx.arc(0,0, r*0.88, Math.PI*0.72, Math.PI*1.28); ctx.stroke();
    ctx.fillStyle='#333';
    ctx.beginPath(); ctx.arc(0,-r*0.88, r*0.18,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, r*0.88, r*0.18,0,Math.PI*2); ctx.fill();
  } else if (kind==='glasses'){
    ctx.strokeStyle='#222'; ctx.lineWidth=Math.max(1,r*0.09);
    ctx.beginPath(); ctx.arc(r*0.33,-r*0.32, r*0.22,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(r*0.33, r*0.32, r*0.22,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.33,-r*0.1); ctx.lineTo(r*0.33,r*0.1); ctx.stroke();
  } else if (kind==='flower'){
    ctx.fillStyle='#ff8fd6';
    for (var i=0;i<5;i++){
      var a=i/5*Math.PI*2;
      ctx.beginPath(); ctx.ellipse(-r*0.55+Math.cos(a)*r*0.16, -r*0.55+Math.sin(a)*r*0.16, r*0.11, r*0.16, a, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle='#ffe08a';
    ctx.beginPath(); ctx.arc(-r*0.55,-r*0.55, r*0.1,0,Math.PI*2); ctx.fill();
  } else if (kind==='helmet'){
    ctx.strokeStyle='#c7cbe0'; ctx.lineWidth=Math.max(1,r*0.24);
    ctx.beginPath(); ctx.arc(0,0, r*0.9, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}
// 見下ろしキャラの顔まわり(かみがた・かみのいろ・はだ・め・ぼうし)を簡略化して描く。
// 呼び出し側で「前(+x)を向く」ようにtranslate/rotate済みであること
function drawAvatarTopDown(ctx, av, r){
  ctx.fillStyle = av.hairColor;
  if (av.hair==='short'){
    ctx.beginPath(); ctx.ellipse(-r*0.55,0, r*0.55, r*0.75, 0, Math.PI*0.5, Math.PI*1.5); ctx.fill();
  } else if (av.hair==='long'){
    ctx.beginPath(); ctx.ellipse(-r*0.42,0, r*0.85, r*0.98, 0, Math.PI*0.5, Math.PI*1.5); ctx.fill();
  } else if (av.hair==='twin'){
    ctx.beginPath(); ctx.arc(-r*0.5,-r*0.72, r*0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-r*0.5, r*0.72, r*0.3,0,Math.PI*2); ctx.fill();
  } else if (av.hair==='pony'){
    ctx.beginPath(); ctx.arc(-r*0.95,0, r*0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-r*0.5,0, r*0.5, r*0.68, 0, Math.PI*0.5, Math.PI*1.5); ctx.fill();
  } else if (av.hair==='odango'){
    ctx.beginPath(); ctx.arc(-r*0.78,0, r*0.4,0,Math.PI*2); ctx.fill();
  } // bozu: かみは描かない
  ctx.fillStyle = av.skin;
  ctx.beginPath(); ctx.arc(r*0.05,0, r*0.66,0,Math.PI*2); ctx.fill();
  drawAvatarEyes(ctx, av.eyes, r);
  drawAvatarAccessory(ctx, av.accessory, r);
}
// キャラクリ画面用の正面向き上半身プレビュー(size角のCanvasに描く想定、呼び出し側でclearRect済み)
function drawAvatarPreview(ctx, av, size){
  var cx=size/2, cy=size*0.56, r=size*0.30;
  ctx.save();
  ctx.translate(cx,cy);
  // からだ(ふく)
  ctx.fillStyle=av.outfit;
  ctx.beginPath(); ctx.ellipse(0, r*1.55, r*1.35, r*1.25, 0, 0, Math.PI*2); ctx.fill();
  // しゅぞく: しっぽ/触手ふう装飾
  ctx.strokeStyle=av.outfit; ctx.lineWidth=r*0.32; ctx.lineCap='round';
  var legN = av.species==='tako'?8:6;
  for (var i=0;i<legN;i++){
    var t=(i/(legN-1)-0.5);
    ctx.beginPath();
    ctx.moveTo(t*r*1.7, r*2.5);
    ctx.quadraticCurveTo(t*r*1.9, r*3.1+Math.abs(t)*r*0.3, t*r*1.5, r*3.5);
    ctx.stroke();
  }
  // かお
  ctx.save(); ctx.rotate(Math.PI/2); // drawAvatarTopDownは+xが正面なので90度回して正面向きにする
  drawAvatarTopDown(ctx, av, r);
  ctx.restore();
  ctx.restore();
}

function drawPlayer(ctx, g, idx){
  var p=g.players[idx];
  var col = idx===0?COLOR.p1:COLOR.p2;
  var dark = idx===0?COLOR.p1dark:COLOR.p2dark;
  if (!p.alive){ drawRespawnCountdown(ctx, p, col); return; }
  var flashing = p.invuln>0 && Math.floor(g.time*10)%2===0;
  var flip = idx===1; // 第7ラウンド: P2のアバターはP2側から正しく見えるよう180度回転して描く
  var sprite = avatarSprite[idx+1];
  var S = AVATAR_DISPLAY_SIZE;

  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.globalAlpha = flashing?0.45:1;

  // 足元のかげ(チーム色の楕円。本体と一緒に回転させ、常にキャラの足元側に来るようにする)
  ctx.save();
  if (flip) ctx.rotate(Math.PI);
  var baseAlpha = ctx.globalAlpha;
  ctx.globalAlpha = baseAlpha*0.4;
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.ellipse(0, S*0.46, S*0.32, S*0.12, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // 本体: キャラクリのプレビューと同じ正面向き上半身(第7ラウンド。事前にオフスクリーンへ描いたものをdrawImageで貼るだけ)
  ctx.save();
  if (flip) ctx.rotate(Math.PI);
  if (sprite) ctx.drawImage(sprite, -S/2, -S/2, S, S);
  // 被弾フラッシュ: 一瞬全身を白く光らせる
  if (p.hitFlash>0){
    ctx.globalAlpha = flashing?0.45:Math.min(1,p.hitFlash/0.12)*0.85;
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.ellipse(0,-S*0.04,S*0.4,S*0.48,0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = flashing?0.45:1;

  // 向き(エイム)を示す小さな三角矢印(チーム色)+ 手元の武器アイコン。本体の向き(P1/P2)とは独立にp.angleで回す
  ctx.save();
  ctx.rotate(p.angle);
  ctx.fillStyle=col;
  var ar=S*0.66;
  ctx.beginPath(); ctx.moveTo(ar,0); ctx.lineTo(ar-10,-6); ctx.lineTo(ar-10,6); ctx.closePath(); ctx.fill();
  var wpn=WEAPONS[p.weapon];
  if (wpn){
    ctx.font=Math.round(S*0.26)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(wpn.emoji, S*0.4, S*0.16);
  }
  ctx.restore();

  ctx.restore(); // translate(p.x,p.y) 終わり

  // 第7ラウンド: ローラーが転がしモード(fire押下)中は、キャラの前に短い横棒(ローラー本体)を表示。離すと消える
  if (p.rolling && WEAPONS[p.weapon] && WEAPONS[p.weapon].key==='roller'){
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.angle);
    ctx.strokeStyle=dark; ctx.lineWidth=5; ctx.lineCap='round';
    var barX=S*0.62, barHalf=S*0.34;
    ctx.beginPath(); ctx.moveTo(barX,-barHalf); ctx.lineTo(barX,barHalf); ctx.stroke();
    ctx.restore();
  }

  drawHpBar(ctx, p, col, S*0.5);
  drawStatusIcons(ctx, p, S*0.5);

  if (p.specialActive){
    ctx.save();
    ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.globalAlpha=0.85;
    ctx.beginPath(); ctx.arc(p.x,p.y,S*0.56,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

// 状態異常アイコン(頭上、残り時間のリングつき)
function drawStatusIcons(ctx, p, visualRadius){
  var st=p.status, items=[];
  if (st.frozenTimer>0) items.push({icon:'❄️', frac:st.frozenTimer/SPECIALS.sensei.iceTime});
  if (st.hakkoTimer>0) items.push({icon:'🫧', frac:st.hakkoTimer/SPECIALS.utsubo.hakkoTime});
  if (st.aburiTimer>0) items.push({icon:'🔥', frac:st.aburiTimer/SPECIALS.manta.aburiTime});
  if (!items.length) return;
  var vr = visualRadius!=null ? visualRadius : p.radius;
  var baseY = p.y - vr - 24;
  for (var i=0;i<items.length;i++){
    var it=items[i], x=p.x + (i-(items.length-1)/2)*18;
    ctx.save();
    ctx.beginPath(); ctx.arc(x, baseY, 9, -Math.PI/2, -Math.PI/2+Math.PI*2*clamp(it.frac,0,1));
    ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2; ctx.stroke();
    ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(it.icon, x, baseY);
    ctx.restore();
  }
}

function drawPopups(ctx, g){
  var arr=g.popups;
  for (var i=0;i<arr.length;i++){
    var pu=arr[i];
    var t=pu.age/pu.life;
    ctx.save();
    ctx.globalAlpha = t<0.75 ? 1 : Math.max(0,1-(t-0.75)/0.25);
    ctx.fillStyle=pu.color;
    ctx.font='bold 20px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,0.55)'; ctx.lineWidth=3;
    var y=pu.y - t*26;
    ctx.strokeText(pu.text, pu.x, y);
    ctx.fillText(pu.text, pu.x, y);
    ctx.restore();
  }
}

// スペシャル発動中の予告線・範囲表示(第6ラウンド)
function drawSpecialEffects(ctx, g){
  for (var i=0;i<2;i++){
    var p=g.players[i];
    if (!p.alive || !p.specialActive) continue;
    var col = i===0?COLOR.p1:COLOR.p2;
    if (p.special==='sensei'){
      var sd=p.specialData, t=clamp(sd.timer/SPECIALS.sensei.delay,0,1);
      var len=Math.hypot(WORLD_W,WORLD_H);
      ctx.save();
      ctx.strokeStyle='rgba(255,60,60,'+(0.35+0.5*(1-t)).toFixed(2)+')';
      ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+Math.cos(sd.angle)*len, p.y+Math.sin(sd.angle)*len); ctx.stroke();
      ctx.restore();
    } else if (p.special==='utsubo'){
      var ang2=p.angle, dX=Math.cos(ang2), dY=Math.sin(ang2), pX=-dY, pY=dX;
      var sp=SPECIALS.utsubo, halfW=sp.widthCells*CELL/2, depth=sp.depthCells*CELL;
      ctx.save();
      ctx.fillStyle=col; ctx.globalAlpha=0.12;
      ctx.beginPath();
      ctx.moveTo(p.x-pX*halfW, p.y-pY*halfW);
      ctx.lineTo(p.x+pX*halfW, p.y+pY*halfW);
      ctx.lineTo(p.x+pX*halfW+dX*depth, p.y+pY*halfW+dY*depth);
      ctx.lineTo(p.x-pX*halfW+dX*depth, p.y-pY*halfW+dY*depth);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}

/* ==================== 9b. 3D描画 (three.js) ====================
   第11ラウンド: 対戦画面を three.js による3D表示に作り直した。
   ゲームのロジック(当たり判定・塗り・CPU)は2Dのまま一切変えておらず、ここは「見せ方」だけを担当する。

   座標の対応: ゲームのワールド座標 (wx, wy) → 3Dの (x, y, z) = (wx, 高さ, wy)。
   数値の尺度はそのままなので、ロジック側の値を変換なしで使える。

   カメラ: マップ中央を、P1側(+Z)の斜め上から CAM_TILT だけ見下ろす1台の「平行投影(Orthographic)」カメラ。
   上下に向かい合う2人で1画面を共有するゲームなので、遠近法(Perspective)で斜めに見下ろすと
   カメラに近いP1側だけ大きく写って不公平になる。平行投影なら距離で大きさが変わらないので、
   斜めに見下ろしても上半分と下半分がまったく同じ縮尺で写る(どちらのプレイヤーにも公平)。
   画面の右=ワールド+X、画面の上=ワールド-Y(=-Z)で、2Dのときと画面の向きが一致するため、
   ツインスティックの操作感は変わらない。高さ(+Y)は画面の上方向に立ち上がるので、
   壁もキャラも「立っている」ように見える。

   WebGLが使えない/three.jsが読めない環境(file:// で直接開いた場合など)では
   R3D.state='failed' になり、従来の2D描画(render2D)にそのまま切り替わる。 */

var WALL_H = CELL*1.5;            // 壁の高さ(ワールドpx)
var STAGE_THICK = CELL*6;         // ステージ土台の厚み(浮いているステージに見せる)
var CAM_TILT = 42*Math.PI/180;    // 真上からの傾き(大きいほど寝かせた見下ろしになる)
var CAM_DIST = 2600;              // 平行投影なので距離は見た目に影響しない(影・クリップ用)
var INK_TILE_CELLS = 12;          // 塗りテクスチャを何セルごとのタイルに割るか
var INK_TILE_RES = 1.5;           // タイルテクスチャの解像度倍率(高いほどきれいだが毎フレームの転送が重くなる)
var INK_TILES_X = Math.ceil(GRID_W/INK_TILE_CELLS), INK_TILES_Y = Math.ceil(GRID_H/INK_TILE_CELLS);
var CHAR_SCALE = 1.3;             // キャラの見た目の拡大率(当たり判定のPLAYER_RADIUSとは無関係)
var CHAR_H = 44*CHAR_SCALE;       // キャラの全高(ワールドpx。頭上のHPバーの位置に使う)

var R3D = {
  state:'idle',                   // idle / loading / ready / failed
  T:null, renderer:null, scene:null, camera:null, camTarget:null, light:null,
  tiles:[],                                        // 床タイル {mesh, canvas, ctx, tex, x0, y0}
  dirty:new Uint8Array(INK_TILES_X*INK_TILES_Y),   // 塗り直しが必要なタイル
  rigs:[null,null], rigSig:['',''],                // キャラのモデルと、作り直し判定用の署名
  pools:null, ringGeos:null,
  cssW:1, cssH:1, dpr:1, pxPerWorld:1,             // オーバーレイ(2D)の描画に使う画面情報
  av:null,                                         // 選択画面などのアバター用の小さなレンダラ
};

function is3D(){ return R3D.state==='ready'; }

/* ---- 塗りの差分管理: 塗った場所のタイルだけテクスチャを作り直す ----
   塗りキャンバス全体(1344x2016)を毎フレームGPUへ送ると重いので、
   12セル(168px)角のタイルに割って、塗られたタイルだけを更新する */
function markInkDirty(x0,y0,x1,y1){
  var ts=INK_TILE_CELLS*CELL;
  var tx0=Math.max(0,Math.floor(x0/ts)), tx1=Math.min(INK_TILES_X-1,Math.floor(x1/ts));
  var ty0=Math.max(0,Math.floor(y0/ts)), ty1=Math.min(INK_TILES_Y-1,Math.floor(y1/ts));
  for (var ty=ty0; ty<=ty1; ty++)
    for (var tx=tx0; tx<=tx1; tx++) R3D.dirty[ty*INK_TILES_X+tx]=1;
}
function markInkDirtyAll(){ R3D.dirty.fill(1); }

/* ---- 使い回しプール: 毎フレーム作り直さず、必要な数だけ見せる ---- */
function Pool3(factory){ this.items=[]; this.n=0; this.factory=factory; }
Pool3.prototype.get=function(){
  var it=this.items[this.n];
  if (!it){ it=this.factory(); this.items.push(it); R3D.scene.add(it); }
  this.n++; it.visible=true; return it;
};
Pool3.prototype.begin=function(){ this.n=0; };
Pool3.prototype.end=function(){ for (var i=this.n;i<this.items.length;i++) this.items[i].visible=false; };

function init3D(){
  if (R3D.state!=='idle') return;
  R3D.state='loading';
  import('./vendor/three.module.min.js').then(function(T){
    try{
      setup3D(T);
      R3D.state='ready';
      $('mapArea').classList.add('mode3d');
      markInkDirtyAll();
      resizeCanvas();
    }catch(e){
      R3D.state='failed';
      console.warn('3Dの初期化に失敗したため、2D表示で続けます', e);
    }
  }).catch(function(e){
    R3D.state='failed';
    console.warn('three.js を読み込めなかったため、2D表示で続けます。'+
                 'file:// で直接開いた場合はブラウザがモジュールを読めないので、HTTP経由(例: python3 -m http.server)で開き直してください', e);
  });
}

function setup3D(T){
  R3D.T=T;
  var renderer = new T.WebGLRenderer({ canvas:$('gameCanvas3d'), antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFShadowMap;
  R3D.renderer = renderer;

  var scene = new T.Scene();
  scene.background = new T.Color(COLOR.bg);
  R3D.scene = scene;

  var camera = new T.OrthographicCamera(-500,500,500,-500, 1, CAM_DIST*3);
  R3D.camera = camera;
  R3D.camTarget = new T.Vector3(WORLD_W/2, WALL_H*0.5, WORLD_H/2);

  scene.add(new T.HemisphereLight(0xcfe0ff, 0x2a3352, 1.6));
  var dir = new T.DirectionalLight(0xfff3dc, 2.2);
  dir.position.set(WORLD_W/2+520, 1100, WORLD_H/2-420);
  dir.target.position.copy(R3D.camTarget);
  dir.castShadow = true;
  dir.shadow.mapSize.set(2048,2048);
  var sc=dir.shadow.camera;
  sc.left=-620; sc.right=620; sc.top=820; sc.bottom=-820; sc.near=200; sc.far=2600;
  dir.shadow.bias=-0.0012; dir.shadow.normalBias=0.8;
  scene.add(dir); scene.add(dir.target);
  R3D.light = dir;

  buildStage3D(T, scene);
  buildPools3D(T);
  fitCamera3D();
}

/* ---- ステージ(床タイル・土台・壁・スポーン地点) ---- */
function buildStage3D(T, scene){
  var ts=INK_TILE_CELLS*CELL;
  R3D.tiles.length=0;
  for (var ty=0; ty<INK_TILES_Y; ty++){
    for (var tx=0; tx<INK_TILES_X; tx++){
      var x0=tx*ts, y0=ty*ts;
      var tw=Math.min(ts, WORLD_W-x0), th=Math.min(ts, WORLD_H-y0);
      var cv=document.createElement('canvas');
      cv.width=Math.round(tw*INK_TILE_RES); cv.height=Math.round(th*INK_TILE_RES);
      var tex=new T.CanvasTexture(cv);
      tex.colorSpace=T.SRGBColorSpace;
      // 塗るたびに転送し直すテクスチャなので、ミップマップは作らない(毎回の生成が重いため)。
      // ほぼ等倍で見るので画質の差は出ない
      tex.generateMipmaps=false;
      tex.minFilter=T.LinearFilter;
      var m=new T.Mesh(new T.PlaneGeometry(tw,th), new T.MeshLambertMaterial({map:tex}));
      m.rotation.x=-Math.PI/2;
      m.position.set(x0+tw/2, 0, y0+th/2);
      m.receiveShadow=true;
      scene.add(m);
      R3D.tiles.push({mesh:m, canvas:cv, ctx:cv.getContext('2d'), tex:tex, x0:x0, y0:y0, w:tw, h:th});
    }
  }

  // 床の下の土台(厚みを見せて「浮いているステージ」にする)+ 縁のふち
  var base=new T.Mesh(new T.BoxGeometry(WORLD_W+16, STAGE_THICK, WORLD_H+16),
                      new T.MeshLambertMaterial({color:0x161c34}));
  base.position.set(WORLD_W/2, -STAGE_THICK/2-7, WORLD_H/2);
  scene.add(base);
  var lip=new T.Mesh(new T.BoxGeometry(WORLD_W+22, 7, WORLD_H+22),
                     new T.MeshLambertMaterial({color:0x3a4674}));
  lip.position.set(WORLD_W/2, -4, WORLD_H/2);   // 床タイル(y=0)より必ず下に置く
  scene.add(lip);

  // 壁: 上面だけ明るい箱+輪郭線(スプラトゥーンの低い段差のイメージ)
  var sideMat=new T.MeshLambertMaterial({color:COLOR.wall});
  var topMat=new T.MeshLambertMaterial({color:0x6d7cb4});
  for (var i=0;i<WALLS_CELL.length;i++){
    var w=WALLS_CELL[i];
    var px=w[0]*CELL, py=w[1]*CELL, pw=w[2]*CELL, ph=w[3]*CELL;
    var geo=new T.BoxGeometry(pw, WALL_H, ph);
    var box=new T.Mesh(geo, [sideMat,sideMat,topMat,sideMat,sideMat,sideMat]);
    box.position.set(px+pw/2, WALL_H/2, py+ph/2);
    box.castShadow=true; box.receiveShadow=true;
    scene.add(box);
    var edge=new T.LineSegments(new T.EdgesGeometry(geo),
              new T.LineBasicMaterial({color:COLOR.wallEdge, transparent:true, opacity:0.8}));
    edge.position.copy(box.position);
    scene.add(edge);
  }

  // スポーン地点のパッド(塗った床の上でも埋もれないよう、白ふちの低い台にする)
  for (var s=0;s<2;s++){
    var padCol=(s===0?COLOR.p1:COLOR.p2);
    var pad=new T.Mesh(new T.CylinderGeometry(36, 38, 3.5, 40),
            new T.MeshLambertMaterial({color:padCol}));
    pad.position.set(SPAWN[s].x, 1.6, SPAWN[s].y);
    pad.receiveShadow=true;
    scene.add(pad);
    var padRing=new T.Mesh(new T.RingGeometry(0.86, 1, 40),
            new T.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.55}));
    padRing.rotation.x=-Math.PI/2;
    padRing.scale.set(36,1,36);
    padRing.position.set(SPAWN[s].x, 3.45, SPAWN[s].y);
    scene.add(padRing);
  }
}

/* ---- 動くものの使い回しプール ---- */
function buildPools3D(T){
  // 輪(リング): 太さを半径に対する比で持つ複数の形を用意し、毎フレーム近いものを選ぶ
  // (WebGLでは線の太さを指定できないので、輪はリング形状の板で描く)
  R3D.ringRels=[0.03,0.06,0.12,0.25,0.5,1.0];
  R3D.ringGeos=R3D.ringRels.map(function(rel){
    var ge=new T.RingGeometry(1-rel, 1, 48); ge.rotateX(-Math.PI/2); return ge;
  });
  var ringGeo=R3D.ringGeos[2];
  var dropGeo=new T.SphereGeometry(1, 8, 6);
  var bulletGeo=new T.SphereGeometry(1, 10, 8);
  var boxGeo=new T.BoxGeometry(1,1,1);
  var circGeo=new T.CircleGeometry(1, 24); circGeo.rotateX(-Math.PI/2);
  var planeGeo=new T.PlaneGeometry(1,1); planeGeo.rotateX(-Math.PI/2);

  function basic(opt){ return new T.MeshBasicMaterial(opt); }
  R3D.pools = {
    ring:  new Pool3(function(){ var m=new T.Mesh(ringGeo, basic({transparent:true, depthWrite:false, side:T.DoubleSide})); m.renderOrder=3; return m; }),
    drop:  new Pool3(function(){ var m=new T.Mesh(dropGeo, new T.MeshLambertMaterial({transparent:true})); m.castShadow=false; return m; }),
    bullet:new Pool3(function(){ return new T.Mesh(bulletGeo, new T.MeshLambertMaterial({})); }),
    streak:new Pool3(function(){ var m=new T.Mesh(boxGeo, basic({transparent:true, depthWrite:false})); m.renderOrder=3; return m; }),
    shadow:new Pool3(function(){ var m=new T.Mesh(circGeo, basic({color:0x000000, transparent:true, opacity:0.3, depthWrite:false})); m.renderOrder=2; return m; }),
    area:  new Pool3(function(){ var m=new T.Mesh(planeGeo, basic({transparent:true, depthWrite:false, side:T.DoubleSide})); m.renderOrder=3; return m; }),
    sprinkler:new Pool3(function(){ return makeSprinkler3D(T); }),
    shield:new Pool3(function(){ return makeShield3D(T); }),
    manta: new Pool3(function(){ return makeManta3D(T); }),
  };
}

function makeSprinkler3D(T){
  var g=new T.Group();
  var mat=new T.MeshLambertMaterial({color:0xffffff});
  g.userData.mat=mat;
  var post=new T.Mesh(new T.CylinderGeometry(2,2.6,12,10), mat);
  post.position.y=6; post.castShadow=true; g.add(post);
  var head=new T.Mesh(new T.SphereGeometry(4.5,12,10), mat);
  head.position.y=13; g.add(head);
  var arms=new T.Group(); arms.position.y=13;
  for (var i=0;i<2;i++){
    var a=new T.Mesh(new T.BoxGeometry(20,1.6,1.6), mat);
    a.rotation.y=i*Math.PI/2; arms.add(a);
  }
  g.add(arms); g.userData.arms=arms;
  return g;
}

function makeShield3D(T){
  var g=new T.Group();
  var mat=new T.MeshLambertMaterial({transparent:true, opacity:0.45, side:T.DoubleSide});
  var body=new T.Mesh(new T.BoxGeometry(1,1,1), mat);
  g.add(body);
  g.userData.body=body; g.userData.mat=mat;
  var rim=new T.Mesh(new T.BoxGeometry(1,1,1), new T.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.65}));
  g.add(rim); g.userData.rim=rim;
  return g;
}

// マンタりんぶ: 乗っているマンタ。ひれを上下させる
function makeManta3D(T){
  var g=new T.Group();
  var mat=new T.MeshLambertMaterial({color:0xffffff});
  g.userData.mat=mat;
  var body=new T.Mesh(new T.SphereGeometry(10,14,10), mat);
  body.scale.set(1.5,0.38,1.1); g.add(body);
  var wings=[];
  for (var s=-1;s<=1;s+=2){
    var w=new T.Mesh(new T.ConeGeometry(13, 26, 3), mat);
    w.rotation.x = s>0 ? Math.PI/2 : -Math.PI/2;
    w.scale.set(1,1,0.22);
    w.position.set(-2, 0, s*13);
    var pivot=new T.Group(); pivot.add(w); g.add(pivot); wings.push(pivot);
  }
  g.userData.wings=wings;
  var tail=new T.Mesh(new T.ConeGeometry(2.5, 22, 6), mat);
  tail.rotation.z=Math.PI/2; tail.position.set(-18,0,0); g.add(tail);
  return g;
}

/* ---- カメラ: マップ全体(壁の上・キャラの背の高さも含む)が必ず画面に収まる倍率を求める ---- */
function fitCamera3D(){
  var T=R3D.T, cam=R3D.camera;
  var dirV=new T.Vector3(0, Math.cos(CAM_TILT), Math.sin(CAM_TILT)); // P1側(+Z)の斜め上
  R3D.camDir=dirV;
  cam.position.copy(R3D.camTarget).addScaledVector(dirV, CAM_DIST);
  cam.up.set(0,1,0);
  cam.lookAt(R3D.camTarget);
  cam.updateMatrixWorld(true);
  // マップの隅(床下〜キャラの頭上まで)がカメラから見てどこに来るかを測る
  var inv=cam.matrixWorldInverse, v=new T.Vector3();
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for (var i=0;i<2;i++) for (var j=0;j<2;j++) for (var k=0;k<2;k++){
    v.set(i?WORLD_W+12:-12, k?CHAR_H+26:-STAGE_THICK, j?WORLD_H+12:-12).applyMatrix4(inv);
    minX=Math.min(minX,v.x); maxX=Math.max(maxX,v.x);
    minY=Math.min(minY,v.y); maxY=Math.max(maxY,v.y);
  }
  var needW=(maxX-minX)*1.02, needH=(maxY-minY)*1.02;
  // ワールド1pxが画面何pxか(平行投影なのでどこでも同じ倍率)
  var scale=Math.max(needW/Math.max(1,R3D.cssW), needH/Math.max(1,R3D.cssH));
  var cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  cam.left=cx-R3D.cssW*scale/2;  cam.right=cx+R3D.cssW*scale/2;
  cam.top =cy+R3D.cssH*scale/2;  cam.bottom=cy-R3D.cssH*scale/2;
  cam.near=1; cam.far=CAM_DIST*3;
  cam.updateProjectionMatrix();
  R3D.pxPerWorld = 1/scale;
}

function resize3D(w,h){
  if (!is3D()) return;
  R3D.cssW=w; R3D.cssH=h;
  R3D.dpr=Math.min(window.devicePixelRatio||1, 2);
  R3D.renderer.setPixelRatio(R3D.dpr);
  R3D.renderer.setSize(w, h, false);
  fitCamera3D();
}

/* ---- キャラクターのモデル(アバターの設定から組み立てる) ---- */
function avatarSig(av, weaponKey){
  return [av.species,av.hair,av.hairColor,av.eyes,av.skin,av.accessory,av.outfit,weaponKey].join('|');
}

function buildAvatar3D(T, av, teamCol, weaponKey){
  var g=new T.Group();
  var skin=new T.MeshLambertMaterial({color:av.skin});
  var outfit=new T.MeshLambertMaterial({color:av.outfit});
  var hair=new T.MeshLambertMaterial({color:av.hairColor});
  var team=new T.MeshLambertMaterial({color:teamCol});
  var dark=new T.MeshLambertMaterial({color:0x2a2e44});

  function add(parent, geo, mat, x,y,z){
    var m=new T.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=true; parent.add(m); return m;
  }

  // からだ(下半身→胴)。+X が正面
  add(g, new T.CylinderGeometry(8.5, 6.5, 15, 14), outfit, 0, 7.5, 0);
  add(g, new T.CapsuleGeometry(8.5, 7, 8, 14), outfit, 0, 20, 0);
  // インクタンク(チーム色。どちらの色かを後ろ姿でも分かるようにする)
  add(g, new T.CapsuleGeometry(4.4, 7, 6, 10), team, -7.5, 21, 0);
  // うで(前に出して武器を持つ)
  for (var s=-1;s<=1;s+=2){
    var arm=add(g, new T.CapsuleGeometry(2.4, 9, 5, 8), skin, 4.5, 20.5, s*7.5);
    arm.rotation.z=Math.PI/2*0.85; arm.rotation.y=-s*0.25;
  }

  // あたま
  var head=new T.Group(); head.position.set(0, 32.5, 0); g.add(head);
  add(head, new T.SphereGeometry(10.5, 20, 16), skin, 0.5, 0, 0);

  // かみがた(+しゅぞくのゲソ)
  if (av.hair!=='bozu'){
    var cap=add(head, new T.SphereGeometry(10.8, 18, 14), hair, -1.2, 1.2, 0);
    cap.scale.set(0.96, 0.92, 1.02);
  }
  if (av.hair==='long'){
    var bk=add(g, new T.CapsuleGeometry(6.5, 14, 6, 12), hair, -8, 24, 0);
    bk.scale.set(0.8,1,1.1);
  } else if (av.hair==='twin'){
    for (var t=-1;t<=1;t+=2) add(head, new T.SphereGeometry(5.2,12,10), hair, -3, -1, t*10.5);
  } else if (av.hair==='pony'){
    var tail=add(head, new T.CapsuleGeometry(3.6, 13, 6, 10), hair, -10, -3, 0);
    tail.rotation.z=0.5;
  } else if (av.hair==='odango'){
    add(head, new T.SphereGeometry(6.2,14,12), hair, -7, 8, 0);
  }
  // ゲソ(イカは2本・タコは4本、後ろに垂らす)
  var legN = av.species==='tako' ? 4 : 2;
  for (var i=0;i<legN;i++){
    var zz = legN===2 ? (i?5.5:-5.5) : (i-1.5)*5.2;
    var geso=add(head, new T.CapsuleGeometry(2.6, 16, 5, 8), hair, -8.5, -5-Math.abs(zz)*0.2, zz);
    geso.rotation.z=0.42; geso.rotation.x=zz*0.02;
  }

  // め(+Xが正面なので顔の前面につける)
  var eyeW=new T.MeshLambertMaterial({color:0xffffff});
  var eyeB=new T.MeshLambertMaterial({color:av.eyes==='hoshi'?0xffd84d:0x17171f});
  for (var e=-1;e<=1;e+=2){
    var ey=0, sy=1, rot=0;
    if (av.eyes==='tare'){ ey=-1.2; }
    else if (av.eyes==='tsuri'){ rot=e*0.45; }
    else if (av.eyes==='nemui'){ sy=0.35; }
    var w=add(head, new T.SphereGeometry(3.0,12,10), eyeW, 7.6, 1.2+ey, e*4.3);
    w.scale.set(0.55, sy, 1); w.rotation.x=rot; w.castShadow=false;
    var b=add(head, new T.SphereGeometry(1.5,10,8), eyeB, 9.4, 1.2+ey, e*4.5);
    b.scale.set(0.6, Math.max(0.4,sy), 1); b.castShadow=false;
  }

  // ぼうし・アクセ
  var ac=av.accessory;
  if (ac==='cap' || ac==='helmet'){
    var domeCol = ac==='cap' ? 0xe05a5a : 0xc7cbe0;
    var dome=add(head, new T.SphereGeometry(11.2, 20, 12, 0, Math.PI*2, 0, Math.PI*0.55),
                 new T.MeshLambertMaterial({color:domeCol}), 0, 1.5, 0);
    if (ac==='cap'){
      var visor=add(head, new T.BoxGeometry(9, 1.4, 13), new T.MeshLambertMaterial({color:domeCol}), 11, 2.2, 0);
      visor.rotation.z=-0.12;
    }
  } else if (ac==='ribbon'){
    for (var r=-1;r<=1;r+=2){
      var rb=add(head, new T.ConeGeometry(4.2, 7, 10), new T.MeshLambertMaterial({color:0xff6fae}), -2, 9, r*5);
      rb.rotation.x=r*Math.PI/2*0.8; rb.rotation.z=-0.3;
    }
    add(head, new T.SphereGeometry(2.2,10,8), new T.MeshLambertMaterial({color:0xff6fae}), -2, 9.5, 0);
  } else if (ac==='headphone'){
    var band=add(head, new T.TorusGeometry(11, 1.5, 8, 24, Math.PI), dark, 0, 1, 0);
    band.rotation.y=Math.PI/2;
    for (var hp=-1;hp<=1;hp+=2){
      var pad=add(head, new T.CylinderGeometry(4,4,2.4,14), dark, 0, 1, hp*11);
      pad.rotation.x=Math.PI/2;
    }
  } else if (ac==='glasses'){
    for (var gl=-1;gl<=1;gl+=2){
      var lens=add(head, new T.TorusGeometry(3.4, 0.7, 8, 18), dark, 8.6, 1.2, gl*4.3);
      lens.rotation.y=Math.PI/2;
    }
  } else if (ac==='flower'){
    for (var f=0;f<5;f++){
      var a2=f/5*Math.PI*2;
      add(head, new T.SphereGeometry(2.2,10,8), new T.MeshLambertMaterial({color:0xff8fd6}),
          -3, 7+Math.sin(a2)*3.4, 8.5+Math.cos(a2)*3.4);
    }
    add(head, new T.SphereGeometry(1.6,8,6), new T.MeshLambertMaterial({color:0xffe08a}), -3, 7, 8.5);
  }

  // 武器(右手の前に持たせる)
  var wp=new T.Group(); wp.position.set(9, 22, -5.5); g.add(wp);
  var metal=new T.MeshLambertMaterial({color:0x50597f});
  if (weaponKey==='shooter'){
    add(wp, new T.BoxGeometry(16,6,6), team, 4, 0, 0);
    add(wp, new T.CylinderGeometry(2.2,2.8,7,10), metal, 14, 0, 0).rotation.z=Math.PI/2;
    add(wp, new T.BoxGeometry(4,7,4), dark, -2, -4, 0);
  } else if (weaponKey==='roller'){
    add(wp, new T.BoxGeometry(17,3,3), metal, 6, 1, 0);
    var drum=add(wp, new T.CylinderGeometry(7,7,16,16), team, 17, -2, 0);
    drum.rotation.x=Math.PI/2;
  } else if (weaponKey==='charger'){
    add(wp, new T.CylinderGeometry(1.8,2.4,30,10), metal, 11, 0, 0).rotation.z=Math.PI/2;
    add(wp, new T.BoxGeometry(9,4,4), team, 2, 3.5, 0);
    add(wp, new T.BoxGeometry(5,5,5), dark, 0, 0, 0);
  } else if (weaponKey==='bucket'){
    var bk2=add(wp, new T.CylinderGeometry(8,6,11,16,1,true), team, 8, 0, 0);
    bk2.rotation.z=-0.5;
    add(wp, new T.TorusGeometry(7, 0.9, 6, 16), metal, 10.5, 4.2, 0).rotation.x=Math.PI/2;
  } else {
    add(wp, new T.CylinderGeometry(1.6,1.6,14,8), metal, 5, 0, 0).rotation.z=Math.PI/2;
    add(wp, new T.BoxGeometry(4,8,9), team, 13, 0, 0);
  }
  g.userData.weaponGroup=wp;

  // 足元のチーム色のインク跡(どちらの色か一目で分かるように)
  var footGeo=new T.CircleGeometry(11, 28); footGeo.rotateX(-Math.PI/2);
  var foot=new T.Mesh(footGeo, new T.MeshBasicMaterial({color:teamCol, transparent:true, opacity:0.32, depthWrite:false}));
  foot.position.y=1.0; foot.renderOrder=2; g.add(foot);
  g.userData.foot=foot;

  // 向きを示す床の矢印(エイム方向。2Dの三角矢印の代わり)
  var arrowShape=new T.Shape();
  arrowShape.moveTo(10,0); arrowShape.lineTo(-4,6); arrowShape.lineTo(-1,0); arrowShape.lineTo(-4,-6);
  var arrow=new T.Mesh(new T.ShapeGeometry(arrowShape),
             new T.MeshBasicMaterial({color:teamCol, transparent:true, opacity:0.85, depthWrite:false, side:T.DoubleSide}));
  arrow.rotation.x=-Math.PI/2;   // 形状のローカル+x がそのままワールド+X(キャラの正面)になる
  arrow.position.set(24, 1.4, 0); arrow.renderOrder=3;
  g.add(arrow); g.userData.arrow=arrow;

  // ローラーの転がし棒(転がしモード中だけ見せる)
  var rollBar=new T.Mesh(new T.CylinderGeometry(5,5,34,14), new T.MeshLambertMaterial({color:teamCol}));
  rollBar.rotation.x=Math.PI/2; rollBar.position.set(22, 5.5, 0); rollBar.visible=false; rollBar.castShadow=true;
  g.add(rollBar); g.userData.rollBar=rollBar;

  // 被弾フラッシュ用の白い body(一瞬だけ重ねて光らせる)
  var flash=new T.Mesh(new T.SphereGeometry(13, 16, 12),
            new T.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.8, depthWrite:false}));
  flash.position.y=22; flash.scale.set(0.95,1.5,0.95); flash.visible=false; flash.renderOrder=4;
  g.add(flash); g.userData.flash=flash;

  g.userData.head=head;
  g.scale.setScalar(CHAR_SCALE);
  return g;
}

// 作り直したモデルのGPU資源を解放する(アバターや武器を変えるたびに積み上がらないように)
function dispose3D(obj){
  obj.traverse(function(o){
    if (o.geometry && R3D.ringGeos.indexOf(o.geometry)<0) o.geometry.dispose();
    if (o.material){
      var ms=Array.isArray(o.material)?o.material:[o.material];
      for (var i=0;i<ms.length;i++){ if (ms[i].map) ms[i].map.dispose(); ms[i].dispose(); }
    }
  });
}

// アバターや武器を変えたら作り直す
function syncRigs3D(g){
  var T=R3D.T;
  for (var i=0;i<2;i++){
    var av=avatarState[i+1], wk=g.players[i].weapon;
    var sig=avatarSig(av, wk);
    if (R3D.rigSig[i]===sig && R3D.rigs[i]) continue;
    if (R3D.rigs[i]){ R3D.scene.remove(R3D.rigs[i]); dispose3D(R3D.rigs[i]); }
    R3D.rigs[i]=buildAvatar3D(T, av, i===0?COLOR.p1:COLOR.p2, wk);
    R3D.rigSig[i]=sig;
    R3D.scene.add(R3D.rigs[i]);
  }
}

/* ---- 床テクスチャ(床の地色+マス目+塗り)の更新 ---- */
function updateInkTiles3D(g){
  for (var i=0;i<R3D.tiles.length;i++){
    if (!R3D.dirty[i]) continue;
    R3D.dirty[i]=0;
    var t=R3D.tiles[i], ctx=t.ctx, k=INK_TILE_RES;
    ctx.setTransform(k,0,0,k,0,0);
    ctx.clearRect(0,0,t.w,t.h);
    ctx.fillStyle=COLOR.floor;
    ctx.fillRect(0,0,t.w,t.h);
    // マス目(うっすら)。床が単色だと3Dで奥行きが分かりにくいので残す
    ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
    ctx.beginPath();
    for (var x=0; x<=t.w; x+=CELL){ ctx.moveTo(x,0); ctx.lineTo(x,t.h); }
    for (var y=0; y<=t.h; y+=CELL){ ctx.moveTo(0,y); ctx.lineTo(t.w,y); }
    ctx.stroke();
    ctx.drawImage(g.inkCanvas, t.x0*INK_SCALE, t.y0*INK_SCALE, t.w*INK_SCALE, t.h*INK_SCALE, 0, 0, t.w, t.h);
    t.tex.needsUpdate=true;
  }
}

/* ---- プレイヤー ---- */
function updatePlayers3D(g){
  var T=R3D.T;
  for (var i=0;i<2;i++){
    var p=g.players[i], rig=R3D.rigs[i];
    if (!rig) continue;
    if (!p.alive){ rig.visible=false; continue; }
    rig.visible=true;
    rig.position.set(p.x, 0, p.y);
    rig.rotation.y = -p.angle;   // ワールドの角度(xy平面) → Y軸まわりの回転
    // 歩いているときは上下にはねる。無敵(復活直後)は点滅
    var moving=Math.hypot(p.input&&p.input.move?p.input.move.x:0, p.input&&p.input.move?p.input.move.y:0);
    var bob = moving>0.1 ? Math.abs(Math.sin(g.time*11))*2.6 : Math.sin(g.time*2.2)*0.5;
    rig.position.y = bob;
    rig.rotation.z = moving>0.1 ? -0.06 : 0;
    // 復活直後の無敵は、足元の白い輪の明滅で見せる(キャラ自体は消さず、位置が分かるようにする)
    if (p.invuln>0) putRing3D(p.x, p.y, 17, 2.4, 0xffffff, 0.3+0.5*Math.abs(Math.sin(g.time*12)), 1.9);
    var fl=rig.userData.flash;
    fl.visible = p.hitFlash>0;
    if (fl.visible) fl.material.opacity=Math.min(1,p.hitFlash/0.12)*0.75;
    rig.userData.rollBar.visible = !!(p.rolling && p.weapon==='roller');
    rig.userData.arrow.material.opacity = 0.5+0.35*Math.abs(Math.sin(g.time*4));
    // チャージャーのため具合を足元の輪で見せる
    if (p.weapon==='charger' && p.charging){
      var frac=clamp(p.charge/WEAPONS.charger.maxCharge,0,1);
      var r=p.radius+8+16*frac;
      putRing3D(p.x, p.y, r, Math.max(1.6,2.6), frac>=1?0xffe08a:0xffffff, 0.85, 2.2);
    }
    if (p.specialActive){
      putRing3D(p.x, p.y, 26+Math.sin(g.time*8)*3, 3, i===0?COLOR.p1:COLOR.p2, 0.9, 2.4);
    }
  }
}

/* ---- 輪・板・しぶきなどの共通ヘルパ ---- */
function putRing3D(x, y, radius, width, color, opacity, h){
  if (radius<=0.5) return;
  var m=R3D.pools.ring.get();
  var rel=clamp(width/radius, 0.02, 1);
  var gi=0, best=1e9;
  for (var i=0;i<R3D.ringRels.length;i++){
    var d=Math.abs(Math.log(R3D.ringRels[i]/rel));
    if (d<best){ best=d; gi=i; }
  }
  if (m.geometry!==R3D.ringGeos[gi]) m.geometry=R3D.ringGeos[gi];
  m.position.set(x, h||1.6, y);
  m.scale.set(radius, 1, radius);
  m.material.color.set(color);
  m.material.opacity=opacity;
}

function putStreak3D(x1,y1,x2,y2,width,color,opacity,h){
  var m=R3D.pools.streak.get();
  var dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||0.001;
  m.position.set((x1+x2)/2, h||2.4, (y1+y2)/2);
  m.rotation.set(0, -Math.atan2(dy,dx), 0);
  m.scale.set(len, Math.max(1.5,width*0.5), width);
  m.material.color.set(color);
  m.material.opacity=opacity;
}

function putArea3D(x,y,w,d,angle,color,opacity,h){
  var m=R3D.pools.area.get();
  m.position.set(x, h||2.0, y);
  m.rotation.set(0, -angle, 0);
  m.scale.set(w, 1, d);
  m.material.color.set(color);
  m.material.opacity=opacity;
}

function teamHex(owner){ return owner===0 ? COLOR.p1 : COLOR.p2; }

/* ---- 弾・しぶき・輪・閃光 ---- */
function updateProjectiles3D(g){
  for (var i=0;i<g.bullets.length;i++){
    var b=g.bullets[i];
    var m=R3D.pools.bullet.get();
    var r = b.weaponKey==='manta' ? 7 : 4;
    m.position.set(b.x, 12, b.y);
    m.rotation.set(0, -Math.atan2(b.vy,b.vx), 0);
    m.scale.set(r*1.8, r, r);
    m.material.color.set(teamHex(b.owner));
  }
  for (var j=0;j<g.particles.length;j++){
    var pt=g.particles[j];
    var col=pt.white ? 0xffffff : teamHex(pt.owner);
    if (pt.ring){
      var rt=clamp(pt.age/pt.life,0,1);
      var rr=pt.r0+(pt.r1-pt.r0)*(1-(1-rt)*(1-rt));
      putRing3D(pt.x, pt.y, rr, Math.max(1.2, pt.w*(1-rt*0.6)), col, (1-rt)*pt.alpha, 1.8);
      continue;
    }
    if (pt.streak){
      var st=clamp(pt.age/pt.life,0,1);
      putStreak3D(pt.x1,pt.y1,pt.x2,pt.y2, pt.w*(1-st*0.5), col, 1-st, 5);
      continue;
    }
    if (pt.beam){
      var at=1-pt.age/pt.life;
      putStreak3D(pt.x1,pt.y1,pt.x2,pt.y2, 5*at+2, col, at*0.9, 6);
      continue;
    }
    var alpha=1-pt.age/pt.life;
    if (alpha<=0) continue;
    // 平面のしぶきを、飛んでいる間だけ山なりに浮かせて立体的に見せる
    var t2=clamp(pt.age/pt.life,0,1);
    var d3=R3D.pools.drop.get();
    d3.position.set(pt.x, 3+Math.sin(Math.PI*t2)*9, pt.y);
    d3.scale.setScalar(pt.r*1.25);
    d3.material.color.set(teamHex(pt.owner));
    d3.material.opacity=Math.min(1,alpha*1.4);
  }
}

/* ---- サブウェポン(投擲・設置) ---- */
function updateSubs3D(g){
  for (var i=0;i<g.subThrows.length;i++){
    var b=g.subThrows[i];
    var col=teamHex(b.owner);
    var rr=(b.sub.radius||0)*CELL;
    if (!b.landed){
      var t=clamp(b.age/b.travelTime,0,1);
      var x=b.x0+(b.x-b.x0)*t, y=b.y0+(b.y-b.y0)*t;
      var hh=8+Math.sin(Math.PI*t)*62;       // 本物の放物線として高さを持たせる
      var m=R3D.pools.bullet.get();
      m.position.set(x, hh, y);
      var br=b.kind==='quickbomb'?6:7.5;
      m.scale.setScalar(br);
      m.material.color.set(col);
      var sh=R3D.pools.shadow.get();
      sh.position.set(x, 0.9, y);
      sh.scale.setScalar(br*(1.3-hh/150));
      sh.material.opacity=0.32*(1-hh/220);
      // 着地予定地点の目印
      putRing3D(x, y, rr*0.25, 1.6, col, 0.35, 1.3);
    } else {
      var pulse=0.6+0.4*Math.sin(g.time*14);
      var warn=clamp(1-(b.fuse>0 ? b.age/b.fuse : 1),0,1);
      var m2=R3D.pools.bullet.get();
      m2.position.set(b.x, 7.5+2*(1-warn), b.y);
      m2.scale.setScalar(7.5+2.5*(1-warn));
      m2.material.color.set(col);
      if (rr>0) putRing3D(b.x, b.y, rr, 2+3*(1-warn), col, 0.25+0.55*(1-warn)*pulse, 1.5);
    }
  }
  for (var s=0;s<g.sprinklers.length;s++){
    var sp=g.sprinklers[s];
    var o=R3D.pools.sprinkler.get();
    o.position.set(sp.x, 0, sp.y);
    o.userData.arms.rotation.y=g.time*5;
    o.userData.mat.color.set(teamHex(sp.ownerIdx));
  }
  for (var k=0;k<g.shields.length;k++){
    var sh2=g.shields[k];
    var o2=R3D.pools.shield.get();
    var len=sh2.halfLen*2, th=sh2.thickness*1.6, hgt=30;
    o2.position.set(sh2.cx, hgt/2, sh2.cy);
    o2.rotation.y = -Math.atan2(sh2.dy, sh2.dx);
    o2.userData.body.scale.set(len, hgt, th);
    o2.userData.rim.scale.set(len, 2.5, th*1.25);
    o2.userData.rim.position.y = hgt/2+0.5;
    o2.userData.mat.color.set(teamHex(sh2.ownerIdx));
  }
}

/* ---- スペシャルの範囲表示 ---- */
function updateSpecials3D(g){
  for (var i=0;i<2;i++){
    var p=g.players[i];
    if (!p.alive || !p.specialActive) continue;
    var col=teamHex(i);
    if (p.special==='sensei'){
      var sd=p.specialData, t=clamp(sd.timer/SPECIALS.sensei.delay,0,1);
      var len=Math.hypot(WORLD_W,WORLD_H);
      var w=SPECIALS.sensei.halfWidthCells*2*CELL;
      var cx=p.x+Math.cos(sd.angle)*len/2, cy=p.y+Math.sin(sd.angle)*len/2;
      putArea3D(cx, cy, len, w, sd.angle, 0xff3c3c, 0.18+0.3*(1-t), 2.6);
      putStreak3D(p.x, p.y, p.x+Math.cos(sd.angle)*len, p.y+Math.sin(sd.angle)*len,
                  3+2*(1-t), 0xff5a5a, 0.55+0.35*(1-t), 6);
    } else if (p.special==='utsubo'){
      var sp2=SPECIALS.utsubo, ang=p.angle;
      var depth=sp2.depthCells*CELL, halfW=sp2.widthCells*CELL/2;
      var mx=p.x+Math.cos(ang)*depth/2, my=p.y+Math.sin(ang)*depth/2;
      putArea3D(mx, my, depth, halfW*2, ang, col, 0.16, 2.2);
    } else if (p.special==='manta'){
      var mt=R3D.pools.manta.get();
      mt.position.set(p.x, 6+Math.sin(g.time*6)*1.6, p.y);
      mt.rotation.y=-p.angle;
      mt.userData.mat.color.set(col);
      var ws=mt.userData.wings;
      for (var w2=0;w2<ws.length;w2++) ws[w2].rotation.x=Math.sin(g.time*9+w2*Math.PI)*0.45;
    }
  }
}

/* ---- 2Dオーバーレイ(HPバー・状態アイコン・ポップアップ・スペシャル演出の文字) ----
   文字や細いバーはWebGLで描くと読みにくくなるので、3Dの上に重ねた2Dキャンバスに描く。
   world→screen の変換はカメラの射影をそのまま使う */
var _v3=null;
function project3D(wx, h, wy){
  if (!_v3) _v3=new R3D.T.Vector3();
  _v3.set(wx, h, wy).project(R3D.camera);
  return { x:(_v3.x*0.5+0.5)*R3D.cssW, y:(-_v3.y*0.5+0.5)*R3D.cssH };
}

function drawOverlay3D(g){
  var ctx=g.ctx;
  if (!ctx) return;
  var W=R3D.cssW, H=R3D.cssH, K=R3D.pxPerWorld;
  ctx.setTransform(R3D.dpr,0,0,R3D.dpr,0,0);
  ctx.clearRect(0,0,W,H);

  for (var i=0;i<2;i++){
    var p=g.players[i], col=i===0?COLOR.p1:COLOR.p2;
    if (!p.alive){
      if (p.respawnTimer>0){
        var ps=project3D(p.x, 16, p.y);
        var n=Math.ceil(p.respawnTimer);
        ctx.save();
        ctx.globalAlpha=0.85;
        ctx.fillStyle='rgba(6,10,22,0.55)';
        ctx.beginPath(); ctx.arc(ps.x, ps.y, 22*K, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle=col;
        ctx.font='bold '+Math.round(28*K)+'px sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(n>0?String(n):'GO', ps.x, ps.y);
        ctx.restore();
      }
      continue;
    }
    // 頭上のHPバー
    var hp=project3D(p.x, CHAR_H+13, p.y);
    var bw=34*K, bh=5*K, bx=hp.x-bw/2, by=hp.y-bh;
    var frac=clamp(p.hp/100,0,1);
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(bx-1.5, by-1.5, bw+3, bh+3);
    ctx.fillStyle = frac>0.5 ? '#57e08a' : (frac>0.2 ? '#ffcc4d' : '#ff5252');
    ctx.fillRect(bx, by, bw*frac, bh);
    ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,1.2*K);
    ctx.strokeRect(bx-1.5, by-1.5, bw+3, bh+3);
    // 状態異常アイコン
    var st=p.status, items=[];
    if (st.frozenTimer>0) items.push({icon:'❄️', frac:st.frozenTimer/SPECIALS.sensei.iceTime});
    if (st.hakkoTimer>0) items.push({icon:'🫧', frac:st.hakkoTimer/SPECIALS.utsubo.hakkoTime});
    if (st.aburiTimer>0) items.push({icon:'🔥', frac:st.aburiTimer/SPECIALS.manta.aburiTime});
    for (var k=0;k<items.length;k++){
      var it=items[k];
      var ix=hp.x+(k-(items.length-1)/2)*20*K, iy=by-14*K;
      ctx.save();
      ctx.beginPath();
      ctx.arc(ix, iy, 10*K, -Math.PI/2, -Math.PI/2+Math.PI*2*clamp(it.frac,0,1));
      ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=Math.max(1,2*K); ctx.stroke();
      ctx.font=Math.round(13*K)+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(it.icon, ix, iy);
      ctx.restore();
    }
  }

  // やられた!/たおした! のポップアップ
  for (var q=0;q<g.popups.length;q++){
    var pu=g.popups[q], t2=pu.age/pu.life;
    var sp=project3D(pu.x, 30+t2*46, pu.y);
    ctx.save();
    ctx.globalAlpha = t2<0.75 ? 1 : Math.max(0,1-(t2-0.75)/0.25);
    ctx.fillStyle=pu.color;
    ctx.font='bold '+Math.round(22*K)+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=Math.max(2,3.4*K);
    ctx.strokeText(pu.text, sp.x, sp.y);
    ctx.fillText(pu.text, sp.x, sp.y);
    ctx.restore();
  }

  // 発動中は画面の縁を発動者の色で脈打たせる
  for (var pi=0;pi<2;pi++){
    if (g.players[pi].specialActive){
      ctx.save();
      ctx.strokeStyle=pi===0?COLOR.p1:COLOR.p2;
      ctx.globalAlpha=0.25+0.25*Math.abs(Math.sin(g.time*6));
      ctx.lineWidth=16;
      ctx.strokeRect(8,8,W-16,H-16);
      ctx.restore();
    }
  }

  // スペシャル発動の演出(名前を大きく)
  if (g.specialFlash){
    var f=g.specialFlash, ft=clamp(f.age/f.life,0,1);
    var fade = ft<0.6 ? 1 : 1-(ft-0.6)/0.4;
    var pop = 1 + 0.35*(1-Math.min(1,ft/0.18));
    var base=Math.min(W,H*0.8);
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,'+(0.45*fade).toFixed(2)+')';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=0.55*fade;
    ctx.fillStyle = f.owner===0?COLOR.p1:COLOR.p2;
    ctx.fillRect(0, H/2-base*0.075, W, base*0.15);
    ctx.globalAlpha=fade;
    ctx.translate(W/2, H/2);
    ctx.scale(pop,pop);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if (f.emoji){
      ctx.font=Math.round(base*0.09)+'px sans-serif';
      ctx.fillStyle='#ffffff';
      ctx.fillText(f.emoji, 0, -base*0.085);
    }
    ctx.fillStyle='#ffffff';
    ctx.font='bold '+Math.round(base*0.075)+'px sans-serif';
    ctx.strokeStyle='rgba(0,0,0,0.75)'; ctx.lineWidth=6;
    ctx.strokeText(f.name+'!', 0, 0);
    ctx.fillText(f.name+'!', 0, 0);
    ctx.restore();
  }
}

/* ---- 1フレームの3D描画 ---- */
function render3D(g){
  var T=R3D.T;
  syncRigs3D(g);
  updateInkTiles3D(g);
  var pools=R3D.pools;
  for (var key in pools) pools[key].begin();
  updatePlayers3D(g);
  updateProjectiles3D(g);
  updateSubs3D(g);
  updateSpecials3D(g);
  for (var key2 in pools) pools[key2].end();

  // 画面のゆれ: カメラを画面右(X)・画面上(-Z)方向へずらす(2Dと同じ time ベースの式)
  var shx=0, shz=0;
  if (g.shakeTimer>0){
    var m=g.shakeMag*(g.shakeTimer/0.28);
    shx=Math.sin(g.time*53.0)*m; shz=Math.cos(g.time*47.0)*m;
  }
  var cam=R3D.camera;
  cam.position.copy(R3D.camTarget).addScaledVector(R3D.camDir, CAM_DIST);
  cam.position.x+=shx; cam.position.z+=shz;
  cam.updateMatrixWorld(true);

  R3D.renderer.render(R3D.scene, cam);
  drawOverlay3D(g);
}

/* ---- 画面タップ位置 → ワールド座標(PC用のマウス操作フォールバック) ---- */
var _ray=null, _plane=null, _hit=null;
function screenToWorld3D(clientX, clientY){
  var T=R3D.T, canvas=$('gameCanvas3d');
  var rect=canvas.getBoundingClientRect();
  if (!_ray){ _ray=new T.Raycaster(); _plane=new T.Plane(new T.Vector3(0,1,0), 0); _hit=new T.Vector3(); }
  var nx=(clientX-rect.left)/rect.width*2-1;
  var ny=-((clientY-rect.top)/rect.height*2-1);
  _ray.setFromCamera({x:nx, y:ny}, R3D.camera);
  var p=_ray.ray.intersectPlane(_plane, _hit);
  if (!p) return {x:WORLD_W/2, y:WORLD_H/2};
  return {x:p.x, y:p.z};
}

/* ---- 選択画面・VS画面・リザルト画面のアバターを3Dで描く ----
   対戦画面のレンダラとは別に、小さな専用レンダラで1体だけ描いて各canvasへコピーする */
function ensureAvatar3D(){
  if (R3D.av || !is3D()) return R3D.av;
  var T=R3D.T;
  try{
    var cv=document.createElement('canvas');
    cv.width=320; cv.height=320;
    var r=new T.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
    r.setPixelRatio(1);
    r.setSize(320,320,false);
    var sc=new T.Scene();
    sc.add(new T.HemisphereLight(0xdfe9ff, 0x303a5c, 2.0));
    var dl=new T.DirectionalLight(0xffffff, 1.8);
    dl.position.set(60, 90, 120);
    sc.add(dl);
    var cam=new T.PerspectiveCamera(28, 1, 1, 600);
    cam.position.set(150, 30, 0);     // 正面(+X)から見る
    cam.lookAt(0, 26, 0);
    R3D.av={ renderer:r, canvas:cv, scene:sc, camera:cam, rigs:{}, sigs:{} };
  }catch(e){
    R3D.av=null; R3D.avFailed=true;
  }
  return R3D.av;
}

// canvas に pn(1/2)のアバターを3Dで描く。spin: Y軸まわりの追加回転(ゆっくり回して立体感を見せる)
function drawAvatar3DInto(canvas, pn, spin){
  if (!canvas || R3D.avFailed) return false;
  var av=ensureAvatar3D();
  if (!av) return false;
  var T=R3D.T;
  var a=avatarState[pn];
  var sig=avatarSig(a, selState[pn]||'shooter');
  if (av.sigs[pn]!==sig){
    if (av.rigs[pn]){ av.scene.remove(av.rigs[pn]); dispose3D(av.rigs[pn]); }
    av.rigs[pn]=buildAvatar3D(T, a, pn===1?COLOR.p1:COLOR.p2, selState[pn]||'shooter');
    av.sigs[pn]=sig;
    av.scene.add(av.rigs[pn]);
  }
  for (var k in av.rigs) av.rigs[k].visible=false;
  var rig=av.rigs[pn];
  rig.visible=true;
  rig.position.set(0,0,0);
  rig.rotation.set(0, (spin||0), 0);
  av.renderer.render(av.scene, av.camera);
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(av.canvas, 0, 0, canvas.width, canvas.height);
  return true;
}

// 表示中のアバターcanvasを毎フレーム描き直して、ゆっくり回転させる
function update3DAvatarUI(t){
  if (!is3D() || R3D.avFailed) return;
  var spin=Math.sin(t*0.0007)*0.85;
  for (var pn=1; pn<=2; pn++){
    var ed=$('avatarEditorP'+pn);
    if (ed && !ed.classList.contains('hidden')) drawAvatar3DInto($('avatarPreviewP'+pn), pn, spin);
  }
  if (!$('vsWrap').classList.contains('hidden')){
    drawAvatar3DInto($('vsAvatarP1'), 1, spin);
    drawAvatar3DInto($('vsAvatarP2'), 2, spin);
  }
  if ($('panelResult').classList.contains('show')){
    drawAvatar3DInto($('resultAvatarP1'), 1, spin);
    drawAvatar3DInto($('resultAvatarP2'), 2, spin);
  }
  if ($('panelSeries').classList.contains('show')){
    drawAvatar3DInto($('champAvatarP1'), 1, spin);
    drawAvatar3DInto($('champAvatarP2'), 2, spin);
  }
}

/* ==================== 9c. 2D描画(WebGLが使えない環境へのフォールバック) ==================== */
// 3Dが使えるときは render3D、使えないときだけ従来どおりこちらで全部描く
function render(g){
  if (is3D()) render3D(g); else render2D(g);
}

function render2D(g){
  var ctx=g.ctx;
  if (!ctx) return;
  ctx.save();
  if (g.shakeTimer>0){
    // 決定論性を壊さないよう、rngではなくgame.timeベースの揺れにする(描画専用)
    var m=g.shakeMag*(g.shakeTimer/0.28);
    ctx.translate(Math.sin(g.time*53.0)*m, Math.cos(g.time*47.0)*m);
  }
  ctx.clearRect(-24,-24,WORLD_W+48,WORLD_H+48);
  ctx.fillStyle=COLOR.floor;
  ctx.fillRect(0,0,WORLD_W,WORLD_H);
  ctx.drawImage(g.inkCanvas,0,0,WORLD_W,WORLD_H);
  drawWalls(ctx,g);
  drawShields(ctx,g);
  drawSprinklers(ctx,g);
  drawChargeRings(ctx,g);
  drawSpecialEffects(ctx,g);
  drawBullets(ctx,g);
  drawSubThrows(ctx,g);
  drawParticles(ctx,g);
  drawPlayer(ctx,g,0);
  drawPlayer(ctx,g,1);
  drawPopups(ctx,g);
  // 発動中: 画面縁を発動者の色で脈打たせる
  for (var pi=0;pi<2;pi++){
    if (g.players[pi].specialActive){
      var pulseCol = pi===0?COLOR.p1:COLOR.p2;
      var pulse=0.25+0.25*Math.abs(Math.sin(g.time*6));
      ctx.save();
      ctx.strokeStyle=pulseCol; ctx.globalAlpha=pulse; ctx.lineWidth=14;
      ctx.strokeRect(7,7,WORLD_W-14,WORLD_H-14);
      ctx.restore();
    }
  }
  // スペシャル発動演出: 0.3秒暗転+スペシャル名を大きく表示
  if (g.specialFlash){
    var f=g.specialFlash, ft=clamp(f.age/f.life,0,1);
    var fade = ft<0.6 ? 1 : 1-(ft-0.6)/0.4;          // 6割までしっかり見せてから消える
    var pop = 1 + 0.35*(1-Math.min(1,ft/0.18));       // 出た瞬間だけ少し大きい
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,'+(0.55*fade).toFixed(2)+')';
    ctx.fillRect(0,0,WORLD_W,WORLD_H);
    // 発動者の色の帯を画面いっぱいに走らせる
    ctx.globalAlpha=0.55*fade;
    ctx.fillStyle = f.owner===0?COLOR.p1:COLOR.p2;
    ctx.fillRect(0, WORLD_H/2-WORLD_W*0.075, WORLD_W, WORLD_W*0.15);
    ctx.globalAlpha = fade;
    ctx.translate(WORLD_W/2, WORLD_H/2);
    ctx.scale(pop, pop);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if (f.emoji){
      ctx.font=Math.round(WORLD_W*0.09)+'px sans-serif';
      ctx.fillStyle='#ffffff';
      ctx.fillText(f.emoji, 0, -WORLD_W*0.085);
    }
    ctx.fillStyle='#ffffff';
    ctx.font='bold '+Math.round(WORLD_W*0.075)+'px sans-serif';
    ctx.strokeStyle='rgba(0,0,0,0.75)'; ctx.lineWidth=6;
    ctx.strokeText(f.name+'!', 0, 0);
    ctx.fillText(f.name+'!', 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

// 前回選んだ組み合わせをlocalStorageに読み書きする(使えない環境でも動くようtry/catchで囲む)
function loadSavedLoadout(){
  try{
    var raw = window.localStorage && localStorage.getItem(LOADOUT_KEY);
    if (!raw) return;
    var d = JSON.parse(raw);
    if (d && d.p1 && WEAPONS[d.p1.main]) selState[1]=d.p1.main;
    if (d && d.p1 && SUBS[d.p1.sub]) subState[1]=d.p1.sub;
    if (d && d.p1 && SPECIALS[d.p1.special]) specState[1]=d.p1.special;
    if (d && d.p2 && WEAPONS[d.p2.main]) selState[2]=d.p2.main;
    if (d && d.p2 && SUBS[d.p2.sub]) subState[2]=d.p2.sub;
    if (d && d.p2 && SPECIALS[d.p2.special]) specState[2]=d.p2.special;
  }catch(e){ /* localStorageが使えなくても無視して既定値のまま進める */ }
}
function saveLoadout(){
  try{
    if (!window.localStorage) return;
    localStorage.setItem(LOADOUT_KEY, JSON.stringify({
      p1:{main:selState[1], sub:subState[1], special:specState[1]},
      p2:{main:selState[2], sub:subState[2], special:specState[2]},
    }));
  }catch(e){ /* 保存に失敗しても対戦は続行できる */ }
}

function drawFaceIconOn(canvas, pn){
  if (!canvas) return;
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.rotate(Math.PI/2);
  drawAvatarTopDown(ctx, avatarState[pn], canvas.width*0.42);
  ctx.restore();
}
function renderAvatarFaceIcon(pn){
  drawFaceIconOn($('avatarFaceP'+pn), pn);
  drawFaceIconOn($('hudFaceP'+pn), pn); // 第7ラウンド: HUDの名前横の顔アイコン
}
function renderAvatarPreview(pn){
  var canvas=$('avatarPreviewP'+pn); if (!canvas) return;
  if (drawAvatar3DInto(canvas, pn, 0)) return;
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawAvatarPreview(ctx, avatarState[pn], canvas.width);
}
// 第7ラウンド: ゲーム中にdrawImageで貼るだけで済むよう、正面向き上半身をオフスクリーンcanvasに描いておく
var avatarSprite = {1:null, 2:null};
function renderAvatarSprite(pn){
  var c=avatarSprite[pn];
  if (!c){ c=document.createElement('canvas'); c.width=AVATAR_SPRITE_RES; c.height=AVATAR_SPRITE_RES; avatarSprite[pn]=c; }
  var ctx=c.getContext('2d');
  ctx.clearRect(0,0,AVATAR_SPRITE_RES,AVATAR_SPRITE_RES);
  drawAvatarPreview(ctx, avatarState[pn], AVATAR_SPRITE_RES);
}
function refreshAvatarEditor(pn){
  var root=$('avatarEditorP'+pn); if (!root) return;
  var av=avatarState[pn];
  ['species','hair','hairColor','eyes','skin','accessory','outfit'].forEach(function(cat){
    var row=root.querySelector('.avatarCatRow[data-avatar-cat="'+cat+'"]');
    if (!row) return;
    row.querySelectorAll('button').forEach(function(b){ b.classList.toggle('selected', b.dataset.val===av[cat]); });
  });
  var nameInput=$('avatarNameP'+pn);
  if (nameInput && document.activeElement!==nameInput) nameInput.value=av.name;
  renderAvatarPreview(pn);
  renderAvatarFaceIcon(pn);
  renderAvatarSprite(pn);
}
function randomAvatar(pn){
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  var av=avatarState[pn];
  av.species=pick(AVATAR_PARTS.species); av.hair=pick(AVATAR_PARTS.hair);
  av.hairColor=pick(AVATAR_PARTS.hairColor); av.eyes=pick(AVATAR_PARTS.eyes);
  av.skin=pick(AVATAR_PARTS.skin); av.accessory=pick(AVATAR_PARTS.accessory);
  av.outfit=pick(AVATAR_PARTS.outfit);
  refreshAvatarEditor(pn);
}
function openAvatarEditor(pn){
  refreshAvatarEditor(pn);
  $('avatarEditorP'+pn).classList.remove('hidden');
}
function closeAvatarEditor(pn){
  var nameInput=$('avatarNameP'+pn);
  var v = nameInput ? (nameInput.value||'').slice(0,6).trim() : '';
  avatarState[pn].name = v || ('P'+pn);
  saveAvatar(pn, avatarState[pn]);
  $('avatarEditorP'+pn).classList.add('hidden');
  refreshAvatarEditor(pn);
}
// HUDや結果画面のラベルを、なまえ未設定なら「P1」「P2」、設定していればその名前で表示する

  var n = avatarState[pn] && avatarState[pn].name;

}

function drawAvatarInto(canvasId, pn){
  var canvas=$(canvasId); if (!canvas) return;
  if (drawAvatar3DInto(canvas, pn, 0)) return;
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);

// 第7ラウンド: 結果画面・優勝画面の対戦アバター表示。winnerIdx: 0=P1の勝ち/1=P2の勝ち/null=ひきわけ
function updateDuelAvatars(prefix, winnerIdx){
  drawAvatarInto(prefix+'AvatarP1', 1);
  drawAvatarInto(prefix+'AvatarP2', 2);
  var c1=$(prefix+'AvatarP1'), c2=$(prefix+'AvatarP2');
  if (!c1 || !c2) return;
  c1.className='duelAvatar'; c2.className='duelAvatar';
  if (winnerIdx===null){ c1.classList.add('big'); c2.classList.add('big'); }
  else if (winnerIdx===0){ c1.classList.add('big'); c2.classList.add('small'); }
  else { c1.classList.add('small'); c2.classList.add('big'); }
  // クラスをリセットしてから付け直し、切り替えのたびにはねるアニメーションを再生させる
  void c1.offsetWidth; void c2.offsetWidth;
  if (winnerIdx===null || winnerIdx===0) c1.classList.add('bounce');
  if (winnerIdx===null || winnerIdx===1) c2.classList.add('bounce');
}

function onRoundEndUI(g){
  $('countdownWrap').classList.add('hidden');
  $('vsWrap').classList.add('hidden');
  $('bigCount').style.opacity=0;
  var pct1=g.lastRoundPct[0].toFixed(1), pct2=g.lastRoundPct[1].toFixed(1);
  $('wipeFillP1').style.width='50%';
  $('wipeFillP2').style.width='50%';
  $('rollerIcon').style.left='0%';
  showPanel('panelResult');
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      $('wipeFillP1').style.width=g.lastRoundPct[0]+'%';
      $('wipeFillP2').style.width=g.lastRoundPct[1]+'%';
      $('rollerIcon').style.left=g.lastRoundPct[0]+'%';
    });
  });
  var lastResult=g.roundResults[g.roundResults.length-1];
  var winnerIdx=lastResult.winnerIdx;
  updateDuelAvatars('result', winnerIdx);
  var n1=avatarDisplayName(1), n2=avatarDisplayName(2);
  var label = winnerIdx===null ? 'ひきわけ!' : (winnerIdx===0 ? '<span class="win1">'+n1+' の かち!</span>' : '<span class="win2">'+n2+' の かち!</span>');
  var kills = lastResult.kills || [0,0];
  setTimeout(function(){
    $('resultText').innerHTML = n1+' '+pct1+'% / '+n2+' '+pct2+'%<br>'+label;
    $('killSummary').innerHTML =
      '<span><b class="p1">'+n1+'</b> たおした:'+kills[0]+' / やられた:'+kills[1]+'</span>'+
      '<span><b class="p2">'+n2+'</b> たおした:'+kills[1]+' / やられた:'+kills[0]+'</span>';
  }, 600);
  // 左からP1の勝ち分、右からP2の勝ち分を塗る (SERIES_MAX_ROUNDS個の丸)
  var dotsEl=$('seriesDots'); dotsEl.innerHTML='';
  var left=g.seriesScore[0], right=g.seriesScore[1];
  for (var j=0;j<SERIES_MAX_ROUNDS;j++){
    var sp=document.createElement('span');
    if (j<left) sp.className='p1';
    else if (j>=SERIES_MAX_ROUNDS-right) sp.className='p2';
    dotsEl.appendChild(sp);
  }
  $('resultNextBtn').textContent = g.seriesDone ? 'けっか へ' : 'つぎのラウンドへ';
}

function proceedFromResult(){
  var g=activeLiveGame;
  if (g.seriesDone){
    var scoreSub = '<br><span style="font-size:0.55em;color:#9aa6cf;">('+g.seriesScore[0]+' - '+g.seriesScore[1]+')</span>';
    if (g.seriesScore[0]===g.seriesScore[1]){
      $('champTitle').innerHTML = 'ひきわけ!'+scoreSub;
      updateDuelAvatars('champ', null);
    } else {
      var champWinnerIdx = g.seriesScore[0]>g.seriesScore[1] ? 0 : 1;
      $('champTitle').innerHTML = avatarDisplayName(champWinnerIdx+1)+' の ゆうしょう!'+scoreSub;
      updateDuelAvatars('champ', champWinnerIdx);
    }
    showPanel('panelSeries');
  } else {
    startRound(g, g.lastRoundLoserIdx);
    updateWeaponIcons();
    showPanel(null);
  }
}

// 武器選択画面をモードに合わせて組み替える。
// CPUモードでは: P2側のラベルを「CPU」に、P2側の武器行を見た目専用(操作不可)にし、
// P2の「じゅんび」は自動でON、P1側に「CPUのぶき」「CPUのつよさ」の操作パネルを出す。
function applySelectModeUI(){
  var isCpu = gameMode==='cpu';
  $('labelP2').textContent = isCpu ? 'CPU (うえ) の ぶき' : 'P2 (うえ) ぶきをえらぼう';
  $('cpuPanel').classList.toggle('hidden', !isCpu);
  var p2Row=document.querySelector('.weaponRow[data-select-player="2"]');
  p2Row.classList.toggle('readOnly', isCpu);
  var p2SubRow=document.querySelector('.weaponRow[data-select-sub="2"]');
  if (p2SubRow) p2SubRow.classList.toggle('readOnly', isCpu);
  var p2SpecialRow=document.querySelector('.weaponRow[data-select-special="2"]');
  if (p2SpecialRow) p2SpecialRow.classList.toggle('readOnly', isCpu);
  var readyBtn2=$('readyP2');

    selState.readyP2=true;
    readyBtn2.classList.add('on'); readyBtn2.textContent='CPU じゅんび OK';

    readyBtn2.disabled=false;
    readyBtn2.textContent = selState.readyP2 ? 'じゅんび かんりょう' : 'じゅんび OK';
