<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ボムよけゲーム</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #141c33;
    --accent: #ffcc4d;
    --danger: #ff5d5d;
    --text: #e9eefb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0.08em;
  }
  #wrap {
    position: relative;
    width: min(100%, 480px);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: linear-gradient(#101838, #060a16);
    border: 2px solid #2b3866;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
    text-align: center;
    background: rgba(6, 10, 22, 0.82);
    border-radius: 12px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 {
    margin: 0;
    font-size: 26px;
    color: var(--accent);
  }
  #overlay p {
    margin: 0;
    font-size: 14px;
    line-height: 1.7;
    color: #b9c4e6;
  }
  button {
    font: inherit;
    font-weight: 700;
    color: #1a1206;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  #hint {
    font-size: 12px;
    color: #7d89b3;
    text-align: center;
  }
</style>
</head>
<body>
<h1>ボムよけゲーム</h1>
<div id="wrap">
  <canvas id="game" width="480" height="720"></canvas>
  <div id="overlay">
    <h2 id="title">ボムよけゲーム</h2>
    <p id="desc">
      上から降ってくる爆弾をよけよう。<br>
      ★アイテムを取るとボーナス点。<br>
      <br>
      ← → キー / A・D キー / ドラッグで移動
    </p>
    <button id="startBtn">スタート</button>
  </div>
</div>
<div id="hint">操作: ← → キー、またはタッチでドラッグ　/　P で一時停止</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const titleEl = document.getElementById("title");
  const descEl = document.getElementById("desc");
  const startBtn = document.getElementById("startBtn");

  const W = canvas.width;
  const H = canvas.height;
  const GROUND = H - 40;

  const STATE = { READY: 0, PLAYING: 1, OVER: 2, PAUSED: 3 };

  const HISCORE_KEY = "bombDodgeHiScore";
  let hiScore = Number(localStorage.getItem(HISCORE_KEY) || 0);

  const player = {
    x: W / 2,
    y: GROUND,
    w: 34,
    h: 40,
    speed: 560,
    vx: 0,
    lives: 3,
    invuln: 0,
  };

  let state = STATE.READY;
  let bombs = [];
  let items = [];
  let particles = [];
  let score = 0;
  let scoreAcc = 0;
  let elapsed = 0;
  let spawnTimer = 0;
  let itemTimer = 0;
  let shake = 0;
  let lastTime = 0;

  const keys = new Set();
  let pointerX = null;

  // ---------- 入力 ----------
  window.addEventListener("keydown", (e) => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
    keys.add(e.key.toLowerCase());
    if (e.key.toLowerCase() === "p") togglePause();
    if (e.key === " " && state !== STATE.PLAYING) startGame();
  });
  window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));

  const toCanvasX = (clientX) => {
    const r = canvas.getBoundingClientRect();
    return ((clientX - r.left) / r.width) * W;
  };
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointerX = toCanvasX(e.clientX);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (pointerX !== null) pointerX = toCanvasX(e.clientX);
  });
  const releasePointer = () => { pointerX = null; };
  canvas.addEventListener("pointerup", releasePointer);
  canvas.addEventListener("pointercancel", releasePointer);

  startBtn.addEventListener("click", () => {
    if (state === STATE.PAUSED) togglePause();
    else startGame();
  });

  // ---------- ゲーム進行 ----------
  function startGame() {
    bombs = [];
    items = [];
    particles = [];
    score = 0;
    scoreAcc = 0;
    elapsed = 0;
    spawnTimer = 0;
    itemTimer = 2;
    shake = 0;
    player.x = W / 2;
    player.vx = 0;
    player.lives = 3;
    player.invuln = 0;
    state = STATE.PLAYING;
    overlay.classList.add("hidden");
  }

  function togglePause() {
    if (state === STATE.PLAYING) {
      state = STATE.PAUSED;
      showOverlay("一時停止", "P キー、またはボタンで再開", "再開");
    } else if (state === STATE.PAUSED) {
      state = STATE.PLAYING;
      overlay.classList.add("hidden");
    }
  }

  function gameOver() {
    state = STATE.OVER;
    if (score > hiScore) {
      hiScore = score;
      localStorage.setItem(HISCORE_KEY, String(hiScore));
    }
    showOverlay(
      "ゲームオーバー",
      `スコア: <b>${score}</b><br>ハイスコア: ${hiScore}<br>生存時間: ${elapsed.toFixed(1)} 秒`,
      "もう一度"
    );
  }

  function showOverlay(title, desc, btn) {
    titleEl.textContent = title;
    descEl.innerHTML = desc;
    startBtn.textContent = btn;
    overlay.classList.remove("hidden");
  }

  // ---------- 難易度 ----------
  const difficulty = () => Math.min(1, elapsed / 90);
  const spawnInterval = () => 0.62 - 0.45 * difficulty();
  const bombSpeed = () => 130 + 260 * difficulty();

  function spawnBomb() {
    const r = 12 + Math.random() * 8;
    bombs.push({
      x: r + Math.random() * (W - r * 2),
      y: -r,
      r,
      vy: bombSpeed() * (0.85 + Math.random() * 0.4),
      vx: (Math.random() - 0.5) * 60 * difficulty(),
      spin: Math.random() * Math.PI * 2,
    });
  }

  function spawnItem() {
    items.push({
      x: 16 + Math.random() * (W - 32),
      y: -14,
      r: 11,
      vy: 110 + 60 * Math.random(),
      t: 0,
    });
  }

  function burst(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 220;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.4 + Math.random() * 0.5,
        max: 0.9,
        color,
        size: 2 + Math.random() * 3,
      });
    }
  }

  // ---------- 更新 ----------
  function update(dt) {
    elapsed += dt;
    // 生存スコアは端数を持ち越して加算する（毎フレーム丸めると 0 になるため）
    scoreAcc += dt * 20;
    const gained = Math.floor(scoreAcc);
    score += gained;
    scoreAcc -= gained;

    // プレイヤー移動
    let dir = 0;
    if (keys.has("arrowleft") || keys.has("a")) dir -= 1;
    if (keys.has("arrowright") || keys.has("d")) dir += 1;

    if (pointerX !== null) {
      const diff = pointerX - player.x;
      // dt で割ることで「1 フレームで届く距離」を上限速度まで出す。
      // 行き過ぎて振動しないよう、残り距離ぶんに丸める。
      const want = diff / dt;
      player.vx = Math.max(-player.speed, Math.min(player.speed, want));
    } else {
      player.vx = dir * player.speed;
    }
    player.x += player.vx * dt;
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

    if (player.invuln > 0) player.invuln -= dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 3);

    // 出現
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnBomb();
      spawnTimer = spawnInterval();
      // 後半は同時出現
      if (Math.random() < difficulty() * 0.5) spawnBomb();
    }
    itemTimer -= dt;
    if (itemTimer <= 0) {
      spawnItem();
      itemTimer = 5 + Math.random() * 5;
    }

    // 爆弾
    const px = player.x;
    const py = player.y - player.h / 2;
    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i];
      b.y += b.vy * dt;
      b.x += b.vx * dt;
      b.spin += dt * 4;
      if (b.x < b.r || b.x > W - b.r) b.vx *= -1;

      // 地面に落ちて爆発
      if (b.y - b.r > GROUND + 10) {
        burst(b.x, GROUND, "#ff9d3d", 8);
        bombs.splice(i, 1);
        score += 5;
        continue;
      }

      // 当たり判定（円 vs 矩形の近似）
      if (player.invuln <= 0) {
        const nx = Math.max(px - player.w / 2, Math.min(b.x, px + player.w / 2));
        const ny = Math.max(py - player.h / 2, Math.min(b.y, py + player.h / 2));
        const dx = b.x - nx;
        const dy = b.y - ny;
        if (dx * dx + dy * dy < b.r * b.r) {
          bombs.splice(i, 1);
          burst(b.x, b.y, "#ff5d5d", 26);
          player.lives -= 1;
          player.invuln = 1.6;
          shake = 1;
          if (player.lives <= 0) {
            burst(px, py, "#ffcc4d", 40);
            gameOver();
            return;
          }
        }
      }
    }

    // アイテム
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt;
      it.t += dt;
      if (it.y - it.r > H) { items.splice(i, 1); continue; }
      const dx = it.x - px;
      const dy = it.y - py;
      if (Math.hypot(dx, dy) < it.r + Math.max(player.w, player.h) / 2) {
        items.splice(i, 1);
        score += 100;
        burst(it.x, it.y, "#7ef0c0", 18);
      }
    }

    // パーティクル
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += 500 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  // ---------- 描画 ----------
  const stars = Array.from({ length: 60 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.4 + 0.3,
    a: Math.random() * 0.6 + 0.2,
  }));

  function drawBackground() {
    ctx.fillStyle = "#080d1d";
    ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      ctx.globalAlpha = s.a;
      ctx.fillStyle = "#cfe0ff";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 地面
    const g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, "#243158");
    g.addColorStop(1, "#131a30");
    ctx.fillStyle = g;
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = "#3d4d84";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    ctx.lineTo(W, GROUND);
    ctx.stroke();
  }

  // 見た目だけのパラメータ。当たり判定は player.w / player.h のままなので
  // ここをいじっても難易度は変わらない。
  function drawPlayer() {
    if (player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0) return;

    const t = performance.now() / 1000;
    const moving = Math.abs(player.vx) > 20;
    const lean = Math.max(-1, Math.min(1, player.vx / player.speed));

    // 待機時のふわふわ、移動時の弾み
    const bob = moving ? Math.abs(Math.sin(t * 9)) * 3 : Math.sin(t * 2.2) * 1.6;
    // 弾んだぶんだけ潰れる（スカッシュ＆ストレッチ）
    const squash = 1 + bob * 0.012;

    // まばたき: 3.4 秒ごとに一瞬だけ閉じる
    const bt = t % 3.4;
    const eyeOpen = bt > 3.2 ? Math.abs(bt - 3.3) / 0.1 : 1;

    ctx.save();
    ctx.translate(player.x, player.y);

    // 影（跳ねると小さくなる）
    ctx.fillStyle = "rgba(0,0,0,0.32)";
    ctx.beginPath();
    ctx.ellipse(0, 1, 17 - bob * 0.5, 4.5 - bob * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(lean * 2, -bob);
    ctx.rotate(lean * 0.16);
    ctx.scale(1 / squash, squash);

    const cx = 0;
    const cy = -19; // 体の中心
    const rx = 17;
    const ry = 18;

    // しっぽ（ふりふり）
    ctx.strokeStyle = "#3fbfe8";
    ctx.lineCap = "round";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(rx - 3, cy + 6);
    ctx.quadraticCurveTo(
      rx + 10, cy + 6 + Math.sin(t * 6) * 4,
      rx + 8, cy - 4 + Math.sin(t * 6) * 6
    );
    ctx.stroke();

    // 耳。内側のピンクは耳の先端に向かって縮めた相似形にして、
    // 体に隠れない上側だけに収める。
    const ear = (ex, dir, shrink) => {
      const tipX = cx + ex + 1 * dir;
      const tipY = cy - ry - 11;
      const mix = (px2, py2) => [
        px2 + (tipX - px2) * shrink,
        py2 + (tipY - py2) * shrink,
      ];
      const [ax, ay] = mix(cx + ex - 6 * dir, cy - ry + 5);
      const [bx2, by2] = mix(cx + ex + 7 * dir, cy - ry + 1);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo(tipX, tipY, bx2, by2);
      ctx.closePath();
      ctx.fill();
    };
    ctx.fillStyle = "#4dd0ff";
    ear(-8, -1, 0);
    ear(8, 1, 0);
    ctx.fillStyle = "#ff9ec0";
    ear(-8, -1, 0.42);
    ear(8, 1, 0.42);

    // 体（下がふっくらした丸）
    const grad = ctx.createLinearGradient(0, cy - ry, 0, cy + ry);
    grad.addColorStop(0, "#8ae9ff");
    grad.addColorStop(1, "#35b6e6");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();

    // ほっぺのつや
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.ellipse(cx - 6, cy - 8, 5.5, 3.6, -0.5, 0, Math.PI * 2);
    ctx.fill();

    // 目（進行方向を見る）
    const look = lean * 1.6;
    const eyeY = cy - 2;
    for (const sx of [-6.5, 6.5]) {
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(cx + sx, eyeY, 4.4, 5.2 * eyeOpen, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#16203a";
      ctx.beginPath();
      ctx.ellipse(cx + sx + look, eyeY + 0.5, 2.6, 3.2 * eyeOpen, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(cx + sx + look - 1, eyeY - 1.4, 1.2 * eyeOpen, 0, Math.PI * 2);
      ctx.fill();
    }

    // ほっぺ
    ctx.fillStyle = "rgba(255,122,158,0.8)";
    ctx.beginPath();
    ctx.ellipse(cx - 12, cy + 5, 3.8, 2.6, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 12, cy + 5, 3.8, 2.6, 0, 0, Math.PI * 2);
    ctx.fill();

    // 口（ω）
    ctx.strokeStyle = "#16203a";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(cx - 2.2, cy + 6, 2.2, 0, Math.PI);
    ctx.arc(cx + 2.2, cy + 6, 2.2, 0, Math.PI);
    ctx.stroke();

    // あんよ
    const swing = moving ? Math.sin(t * 14) * 2.5 : 0;
    ctx.fillStyle = "#2aa8d8";
    ctx.beginPath();
    ctx.ellipse(cx - 7, cy + ry - 1 + swing, 5, 3.2, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 7, cy + ry - 1 - swing, 5, 3.2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawBomb(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.sin(b.spin) * 0.2);

    ctx.fillStyle = "#1d2438";
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#39425f";
    ctx.beginPath();
    ctx.arc(-b.r * 0.3, -b.r * 0.35, b.r * 0.32, 0, Math.PI * 2);
    ctx.fill();

    // 導火線
    ctx.strokeStyle = "#8a6a3c";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, -b.r);
    ctx.quadraticCurveTo(b.r * 0.5, -b.r * 1.5, b.r * 0.2, -b.r * 1.9);
    ctx.stroke();

    // 火花
    const f = 0.6 + Math.abs(Math.sin(b.spin * 3)) * 0.6;
    ctx.fillStyle = "#ffd166";
    ctx.beginPath();
    ctx.arc(b.r * 0.2, -b.r * 1.95, 3 * f, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,120,40,0.5)";
    ctx.beginPath();
    ctx.arc(b.r * 0.2, -b.r * 1.95, 6 * f, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawItem(it) {
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.t * 2);
    ctx.fillStyle = "#7ef0c0";
    ctx.shadowColor = "#7ef0c0";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? it.r : it.r * 0.45;
      const a = (Math.PI / 5) * i - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = "#e9eefb";
    ctx.font = "bold 22px system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(String(score).padStart(6, "0"), 14, 32);

    ctx.font = "12px system-ui, sans-serif";
    ctx.fillStyle = "#8f9ec9";
    ctx.fillText(`HI ${hiScore}`, 14, 50);

    // 残機
    ctx.textAlign = "right";
    for (let i = 0; i < player.lives; i++) {
      ctx.fillStyle = "#ff6b8a";
      heart(W - 18 - i * 22, 24, 8);
    }

    ctx.fillStyle = "#8f9ec9";
    ctx.font = "12px system-ui, sans-serif";
    ctx.fillText(`${elapsed.toFixed(1)}s`, W - 14, 50);
  }

  function heart(cx, cy, s) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.7);
    ctx.bezierCurveTo(cx - s * 1.4, cy - s * 0.4, cx - s * 0.4, cy - s * 1.3, cx, cy - s * 0.35);
    ctx.bezierCurveTo(cx + s * 0.4, cy - s * 1.3, cx + s * 1.4, cy - s * 0.4, cx, cy + s * 0.7);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * 12 * shake, (Math.random() - 0.5) * 12 * shake);
    }
    drawBackground();

    for (const it of items) drawItem(it);
    for (const b of bombs) drawBomb(b);
    drawPlayer();

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    drawHUD();
  }

  // ---------- ループ ----------
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000 || 0);
    lastTime = now;
    if (state === STATE.PLAYING) update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
