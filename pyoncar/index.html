<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#87cfff">
<title>ぴょんカー・エボリューション — パチンコで飛ばして車を進化させる 3D レース</title>
<meta name="description" content="うさぎの乗った車をパチンコで打ち出し、でこぼこのコースを走らせてゴールを目指す 3D ゲーム。集めたお金で車を強化すると、段ボールカーがジェットカーまで進化します。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2387cfff'/><rect x='5' y='15' width='22' height='7' rx='2' fill='%23ff8a1f'/><circle cx='10' cy='23' r='4' fill='%23222'/><circle cx='22' cy='23' r='4' fill='%23222'/><ellipse cx='15' cy='9' rx='1.6' ry='5' fill='%23fff'/><ellipse cx='18' cy='9' rx='1.6' ry='5' fill='%23fff'/><circle cx='16.5' cy='14' r='3.4' fill='%23fff'/></svg>">
<style>
:root{
  --ink:#25305a; --navy:rgba(20,30,60,.74); --orange:#ff6a1f; --orange2:#c23a0a;
  --green:#3bb85a; --green2:#23843d; --blue:#3b8cff; --blue2:#1f5fc2; --gray:#6b7898; --gray2:#4a5573;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#87cfff;color:#fff;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,-apple-system,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#cv{position:fixed;left:0;top:0;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:none;pointer-events:none}
.screen.on{display:block}
.screen .hit{pointer-events:auto}
.stroke{text-shadow:0 2px 0 #1b2550,2px 0 0 #1b2550,-2px 0 0 #1b2550,0 -2px 0 #1b2550,0 4px 6px rgba(0,0,0,.3)}
.top{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:var(--navy);border-radius:999px;padding:6px 14px;font-weight:bold;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap}
a.pill{color:#fff;text-decoration:none;font-size:14px}
.coin{display:inline-block;width:18px;height:18px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a0,#ffc400 55%,#d18a00);border:2px solid #a86a00}
.coin.s{width:14px;height:14px;border-width:1.5px}
.ttl{position:absolute;top:calc(58px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:28px;font-weight:bold;line-height:1.3}
.ttl .sub{font-size:14px;opacity:.95;font-weight:bold}
.panel{position:absolute;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:520px;bottom:calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);border-radius:22px;padding:12px;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.bigbtn{display:block;width:100%;margin-top:10px;background:linear-gradient(#ff8a3d,#ff5a1f);color:#fff;border-radius:16px;text-align:center;font-size:24px;font-weight:bold;padding:9px 0;border-bottom:6px solid var(--orange2)}
.bigbtn:active,.btn:active,.card:active{transform:translateY(3px)}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;text-align:center;border-radius:14px;padding:10px 0;font-weight:bold;font-size:16px;color:#fff;background:var(--blue);border-bottom:5px solid var(--blue2)}
.btn.gray{background:var(--gray);border-bottom-color:var(--gray2)}
.btn.orange{background:var(--orange);border-bottom-color:var(--orange2)}
.btn.green{background:var(--green);border-bottom-color:var(--green2)}

/* map */
#map{background:linear-gradient(#8fd3ff 0%,#bfe8ff 30%,#9ee08a 30.1%,#6fc35a 100%)}
#mapScroll{position:absolute;left:0;right:0;top:calc(110px + env(safe-area-inset-top));bottom:calc(150px + env(safe-area-inset-bottom));overflow-y:auto;pointer-events:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#mapInner{position:relative;margin:0 auto;max-width:420px}
#mapInner svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--green);border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;box-shadow:0 5px 0 rgba(0,0,0,.25);color:#fff}
.node .nm{position:absolute;top:60px;white-space:nowrap;font-size:12px;background:var(--navy);padding:1px 8px;border-radius:999px}
.node .st{position:absolute;top:-14px;font-size:14px}
.node.sel{box-shadow:0 0 0 6px rgba(255,210,61,.85),0 5px 0 rgba(0,0,0,.25)}
.node.cur{background:var(--orange)}
.node.lock{background:#8d97b0}
.stinfo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.stinfo b{font-size:17px}
.stbar{position:relative;height:12px;background:#dde5f6;border-radius:6px;margin-top:6px;overflow:hidden}
.stbar i{display:block;height:100%;background:linear-gradient(90deg,#4fc06b,#ffd23d)}

/* garage */
.evo{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;font-weight:bold}
.evo .track{flex:1;height:12px;background:#dde5f6;border-radius:6px;overflow:hidden}
.evo .track i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3d,#ff8a3d);border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{background:#eef4ff;border-radius:14px;padding:7px 4px 8px;text-align:center;border-bottom:4px solid #c3d2f0;color:var(--ink)}
.card .ic{font-size:24px;line-height:1.15}
.card .nm{font-size:12px;font-weight:bold;white-space:nowrap}
.card .lv{font-size:11px;color:#6a78a6;white-space:nowrap}
.card .bar{height:6px;background:#d5def3;border-radius:3px;margin:3px 6px;overflow:hidden}
.card .bar i{display:block;height:100%;background:#4fc06b}
.card .pr{margin-top:5px;background:var(--green);color:#fff;border-radius:10px;font-size:12px;font-weight:bold;padding:4px 0;border-bottom:3px solid var(--green2);display:flex;justify-content:center;align-items:center;gap:4px}
.card.ng .pr{background:#b9c2d8;border-bottom-color:#8d97b0}
.card.max .pr{background:#ffb02e;border-bottom-color:#c27d00}
.card.flash{animation:flash .35s}
@keyframes flash{0%{background:#fff7c0}100%{background:#eef4ff}}
@media (max-height:700px){#garage .ttl .sub{display:none}#garage .ttl{font-size:22px}.card .ic{font-size:20px}.card{padding:5px 4px 6px}#upDesc{display:none}}
#upDesc{font-size:12px;color:#5a6890;text-align:center;margin-top:8px;min-height:1.5em}

/* launch / drive */
.power{position:absolute;left:16px;top:calc(120px + env(safe-area-inset-top));height:min(40vh,320px);width:24px;border-radius:12px;background:var(--navy);border:3px solid #fff;overflow:hidden}
.power i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,#3bd16f,#ffe23d 60%,#ff4d3d);background-size:100% min(40vh,320px);background-position:bottom}
.hint{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:22px;font-weight:bold}
.hint .sub{font-size:14px}
.finger{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));font-size:44px;margin-left:20px;animation:pull 1.4s ease-in-out infinite}
@keyframes pull{0%,15%{transform:translateY(-30px);opacity:0}30%{opacity:1}75%{transform:translateY(40px);opacity:1}100%{transform:translateY(40px);opacity:0}}
.prog{position:absolute;top:calc(60px + env(safe-area-inset-top));left:24px;right:24px}
.pbar{position:relative;height:14px;background:var(--navy);border:2px solid #fff;border-radius:8px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fc06b,#ffd23d);border-radius:6px}
.pbar b{position:absolute;top:-17px;font-size:17px;transform:translateX(-50%)}
.pbar .me{position:absolute;top:-6px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#fff;border:3px solid var(--orange);font-size:11px;display:flex;align-items:center;justify-content:center}
.dist{position:absolute;top:calc(84px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:44px;font-weight:bold;line-height:1.1}
.dist small{font-size:22px}
.dist .sp{font-size:14px;display:block}
.steer{position:absolute;bottom:calc(130px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:17px;font-weight:bold;transition:opacity .6s}
.toast{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:30px;font-weight:bold;opacity:0;transition:opacity .2s, transform .2s}
.toast.on{opacity:1;transform:scale(1.08)}

#fx{position:fixed;left:0;top:0;pointer-events:none}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff}
.jumpbtn{position:absolute;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;
  background:conic-gradient(rgba(255,255,255,.95) calc(var(--cd,1)*360deg),rgba(255,255,255,.35) 0);padding:6px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.jumpbtn i{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;font-style:normal;
  background:radial-gradient(circle at 40% 35%,#ff9ad0,#ff4fa0 70%);color:#fff;font-weight:bold;font-size:13px;line-height:1.1}
.jumpbtn i b{font-size:32px}
.jumpbtn.wait i{filter:grayscale(.7) brightness(.85)}
.jumpbtn:active{transform:scale(.94)}
#dCoinPill.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.25)}}
.dist.fast{color:#ffe14d}
.dist.hyper{color:#ff7a3d}
/* result */
.res{position:absolute;top:calc(110px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:420px;background:rgba(255,255,255,.97);border-radius:24px;padding:16px 18px 14px;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.res h2{text-align:center;font-size:22px}
.res .big{text-align:center;font-size:46px;font-weight:bold;color:#ff6a1f;line-height:1.2}
.res .big small{font-size:22px}
.rec{display:block;margin:4px auto 6px;width:max-content;background:#ffd23d;color:#7a4b00;font-weight:bold;border-radius:999px;padding:2px 14px;font-size:14px}
.rec.no{background:#dde5f6;color:#5a6890}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;border-bottom:2px dashed #dbe3f5;font-size:15px}
.row b{display:flex;align-items:center;gap:5px}
.row.tot{font-size:20px;border:none;color:#e07a00}
.unlock{text-align:center;margin-top:6px;font-weight:bold;color:#2a8a45;font-size:15px}
.tip{text-align:center;margin-top:6px;font-size:13px;color:#5a6890}

/* evolve */
#evolve{background:radial-gradient(circle at 50% 45%,rgba(255,240,160,.0),rgba(42,28,90,.0))}
.evoban{position:absolute;top:calc(90px + env(safe-area-inset-top));left:0;right:0;text-align:center}
.evoban .t1{font-size:22px;font-weight:bold}
.evoban .t2{font-size:38px;font-weight:bold;color:#ffe14d;line-height:1.25}
.chips{position:absolute;bottom:calc(110px + env(safe-area-inset-bottom));left:10px;right:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{background:var(--navy);padding:5px 10px;border-radius:999px;font-size:13px;font-weight:bold}

/* pause */
#pause{background:rgba(10,15,35,.55)}
#pause .panel{bottom:auto;top:50%;transform:translate(-50%,-50%);max-width:340px;text-align:center}
#pause h3{font-size:22px;margin-bottom:4px}
.btns.col{flex-direction:column}
</style>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="fx"></canvas>
<div id="flash"></div>

<!-- ステージマップ -->
<section class="screen" id="map">
  <div class="top"><a class="pill hit" href="../">← 一覧</a><div class="pill"><span class="coin"></span><span class="money">0</span></div></div>
  <div class="ttl stroke">ぴょんカー<div class="sub">ゴールにたどり着けばクリア！</div></div>
  <div id="mapScroll"><div id="mapInner"></div></div>
  <div class="panel hit">
    <div class="stinfo"><b id="mpName">ステージ1</b><span id="mpInfo"></span></div>
    <div class="stbar"><i id="mpBar"></i></div>
    <div class="btns"><button class="btn gray" id="toGarage">🔧 ガレージ</button><button class="btn orange" id="mpGo">ちょうせん！</button></div>
  </div>
</section>

<!-- ガレージ -->
<section class="screen" id="garage">
  <div class="top"><button class="pill hit" id="gBack">← マップ</button><div class="pill"><span class="coin"></span><span class="money">0</span></div></div>
  <div class="ttl stroke">ガレージ<div class="sub" id="gSub"></div></div>
  <div class="panel hit">
    <div class="evo"><span id="evoName">段ボールカー</span><div class="track"><i id="evoBar"></i></div><span id="evoNext"></span></div>
    <div class="grid" id="upGrid"></div>
    <div id="upDesc">カードをタップすると強化できます</div>
    <button class="bigbtn" id="gGo">発進！</button>
  </div>
</section>

<!-- 発射 -->
<section class="screen" id="launch">
  <div class="top"><button class="pill hit" id="lBack">← もどる</button><div class="pill" id="lGoal"></div></div>
  <div class="power"><i id="powBar"></i></div>
  <div class="finger" id="finger">👇</div>
  <div class="hint stroke"><span id="lHint">下にひっぱって はなす！</span><div class="sub" id="lSub">左右にずらすと ねらいが変わる</div></div>
</section>

<!-- 走行 -->
<section class="screen" id="drive">
  <div class="top"><div class="pill" id="dCoinPill"><span class="coin"></span>+<span id="dCoin">0</span></div><button class="pill hit" id="pauseBtn">Ⅱ</button></div>
  <div class="prog"><div class="pbar"><i id="dBar"></i><b id="dBest">🚩</b><b style="left:100%">🏁</b></div></div>
  <div class="dist stroke"><span id="dDist">0</span><small>m</small><span class="sp" id="dSpd">0 km/h</span></div>
  <div class="toast stroke" id="toast"></div>
  <div class="steer stroke" id="steerHint">◀ ドラッグでハンドル ▶<br><span style="font-size:14px">タップでジャンプ</span></div>
  <button class="jumpbtn hit" id="jumpBtn"><i><b>🐰</b>ジャンプ</i></button>
</section>

<!-- 結果 -->
<section class="screen" id="result">
  <div class="res hit">
    <h2 id="rTitle">ステージ1</h2>
    <span class="rec" id="rRec">★ クリア ★</span>
    <div class="big"><span id="rDist">0</span><small>m</small></div>
    <div id="rRows"></div>
    <div class="unlock" id="rUnlock"></div>
    <div class="tip" id="rTip"></div>
    <div class="btns"><button class="btn gray" id="rGarage">🔧 ガレージ</button><button class="btn orange" id="rNext">もう一度</button></div>
  </div>
</section>

<!-- 進化 -->
<section class="screen" id="evolve">
  <div class="evoban stroke"><div class="t1" id="evT1"></div><div class="t2" id="evT2"></div></div>
  <div class="chips" id="evChips"></div>
  <div class="panel hit" style="padding:10px"><button class="bigbtn" id="evOk" style="margin:0">やったー！</button></div>
</section>

<!-- 一時停止 -->
<section class="screen" id="pause">
  <div class="panel hit"><h3>ひと休み</h3>
    <div class="btns col"><button class="btn green" id="pResume">つづける</button><button class="btn" id="pRetry">やり直す</button><button class="btn gray" id="pQuit">マップへ</button></div>
  </div>
</section>

<script type="module">
import * as THREE from 'three';

/* ================= データ ================= */
const HW = 7;                 // 道の半分の幅 (m)
const XMAX = HW+22;           // ここより外は山で進めない
const UPS = [
  {id:'pull',  ic:'🏹', nm:'ひっぱり力', sub:'発射の速さ',  w:1.25, desc:'パチンコが強くなり、発射スピードが上がる'},
  {id:'tire',  ic:'🛞', nm:'タイヤ',     sub:'ころがり',   w:1.0,  desc:'よく転がるようになり、ぬかるみにも強くなる'},
  {id:'susp',  ic:'🌀', nm:'ばね',       sub:'でこぼこ',   w:0.95, desc:'でこぼこ道や着地でスピードが落ちにくくなる'},
  {id:'body',  ic:'🪽', nm:'ボディ',     sub:'空気抵抗',   w:0.95, desc:'空気抵抗が減り、速いときに減速しにくくなる'},
  {id:'handle',ic:'🎮', nm:'ハンドル',   sub:'曲がり',     w:0.75, desc:'左右にすばやく動けるようになる'},
  {id:'magnet',ic:'🧲', nm:'コイン磁石', sub:'コイン',     w:0.85, desc:'遠くのコインを吸い寄せ、コインの価値も上がる'},
  {id:'jump',  ic:'🐰', nm:'ジャンプ力', sub:'ジャンプ',   w:0.9,  desc:'ジャンプが高くなり、次のジャンプまでの待ち時間が短くなる'},
];
const MAXLV = 25;
const FORMS = [
  {nm:'段ボールカー', at:0},
  {nm:'木の荷車',     at:6},
  {nm:'バギー',       at:18},
  {nm:'スポーツカー', at:36},
  {nm:'ジェットカー', at:60},
];
const FORM_BONUS = ['','発射 +8%・ころがり +6%・コイン +10%'];
const THEMES = {
  grass:  {nm:'草原', sky:0x87cfff, fog:0xa8dcff, road:0xc9a774, ground:0x7ccf5a, prop:'tree',  leaf:0x3e9a4a, crr:1,   g:9.8, grip:1,   hill:1},
  desert: {nm:'砂漠', sky:0xffd9a0, fog:0xffe3b8, road:0xe8c27a, ground:0xf0cf86, prop:'cactus',leaf:0x4c9a4a, crr:1.15,g:9.8, grip:.9,  hill:1.2},
  forest: {nm:'森',   sky:0x9fd9c0, fog:0xb5e3cd, road:0xa98a62, ground:0x4fa24a, prop:'pine',  leaf:0x2c7a3a, crr:1.05,g:9.8, grip:1,   hill:1.1},
  snow:   {nm:'雪山', sky:0xcfe6ff, fog:0xe4f0ff, road:0xdfe9f5, ground:0xf6fbff, prop:'snowtree',leaf:0x2f7a5a,crr:.75,g:9.8, grip:.55, hill:1.35},
  volcano:{nm:'火山', sky:0xff9a7a, fog:0xd9826a, road:0x5a4a4a, ground:0x3d3434, prop:'lava',  leaf:0xff5a1f, crr:1.1, g:9.8, grip:1,   hill:1.45},
  moon:   {nm:'月面', sky:0x0b1030, fog:0x1a2050, road:0xb7b9c4, ground:0x9a9ca8, prop:'crater',leaf:0x777a88, crr:.9,  g:4.2, grip:.8,  hill:1.5},
};
const STAGES = [
  ['草原の道','grass'],['なだらかな丘','grass'],['でこぼこ道','grass'],
  ['砂漠','desert'],['砂丘','desert'],['森の小道','forest'],['深い森','forest'],
  ['雪山','snow'],['氷の谷','snow'],['火山','volcano'],['溶岩の川','volcano'],
  ['月面','moon'],['星の海','moon'],
];
const THEME_CYCLE = ['grass','desert','forest','snow','volcano','moon'];
function stageInfo(n){
  if(n<=STAGES.length){const [nm,th]=STAGES[n-1];return {nm,th};}
  const th=THEME_CYCLE[(n-STAGES.length-1)%THEME_CYCLE.length];
  return {nm:'エクストラ'+(n-STAGES.length)+' '+THEMES[th].nm, th};
}
const goalCache={};
const goalOf = n => n<=GOALS.length?GOALS[n-1]:3100+300*(n-GOALS.length);

/* ================= セーブ ================= */
const KEY='pyoncar-v1';
const fresh=()=>({money:0, up:{pull:0,tire:0,susp:0,body:0,handle:0,magnet:0,jump:0}, unlocked:1, sel:1, best:{}, cleared:{}, form:0, runs:0});
let S=fresh();
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);S=Object.assign(fresh(),o);S.up=Object.assign(fresh().up,o.up||{});}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const totalLv = (up=S.up) => UPS.reduce((a,u)=>a+up[u.id],0);
const formOf = (up=S.up) => {const t=totalLv(up);let f=0;FORMS.forEach((F,i)=>{if(t>=F.at)f=i;});return f;};
const costOf = (id,lv) => {const u=UPS.find(x=>x.id===id);return Math.round(110*u.w*Math.pow(1.32,lv)/5)*5;};

/* ================= 性能 ================= */
function stats(up=S.up){
  const f=formOf(up);
  return {
    form:f,
    v0: (26 + 2.2*up.pull) * (1+0.08*f),
    crr: 0.052 / (1+0.06*up.tire) * (1-0.04*f),
    mud: 0.5 * Math.max(0.35, 1-0.03*up.tire),
    bump: 0.9 / (1+0.22*up.susp),
    land: 0.05 / (1+0.25*up.susp),
    drag: 0.0011 / (1+0.08*up.body) * (1-0.04*f),
    steer: 4.6 + 0.55*up.handle,
    jumpV: 6.2 + 0.22*up.jump,
    jumpCd: 1.5/(1+0.07*up.jump),
    magnet: 1.3 + 0.32*up.magnet,
    coinMul: (1+0.06*up.magnet) * (1+0.10*f),
  };
}

/* ================= コース ================= */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
function makeCourse(n,goalOv){
  const info=stageInfo(n), th=THEMES[info.th], R=rng(n*7919+13+(window.__seedv?.[n]??SEEDV[n-1]??0)*100003);
  const goal=goalOv||goalOf(n), L=goal+70;
  const A=Math.min(0.35+n*0.07,1.3)*th.hill;
  const comps=[0,1,2].map(i=>({a:A*(0.35+R()*0.5)/(i+1)*1.4, f:2*Math.PI/(26+R()*60)*(1+i*.7), p:R()*6.28}));
  const grade=0.015+R()*0.008;
  const feats=[], coins=[], rocks=[];
  const lvl=Math.min(1,(n-1)/10);
  let s=36;
  const rangeX=(w)=>{const c=(R()*2-1)*(HW-1-w/2);return [c-w/2,c+w/2];};
  while(s<L-12){
    const len=14+R()*16;
    const r=R();
    const pick = r<0.26?'bump': r<0.44?'mud': r<0.58?'ramp': r<0.72?'boost': r<0.86?'rocks':'tilt';
    if(pick==='bump'){const w=6+R()*5;const [x0,x1]=rangeX(w);feats.push({t:'bump',s0:s,s1:s+len,x0,x1,amp:0.3+0.25*R()+0.2*lvl});}
    else if(pick==='mud'){const w=5+R()*5;const [x0,x1]=rangeX(w);feats.push({t:'mud',s0:s+2,s1:s+len*0.8,x0,x1});}
    else if(pick==='ramp'){const [x0,x1]=rangeX(3.6);feats.push({t:'ramp',s0:s+4,s1:s+10,x0,x1,h:1.2+0.6*R()});
      if(R()<.7){const [m0,m1]=[Math.max(-HW+1,x0-2),Math.min(HW-1,x1+2)];feats.push({t:'mud',s0:s+11,s1:s+19,x0:m0,x1:m1});}}
    else if(pick==='boost'){const [x0,x1]=rangeX(2.8);feats.push({t:'boost',s0:s+4,s1:s+9,x0,x1});}
    else if(pick==='rocks'){const k=1+Math.floor(R()*2+lvl*2);for(let i=0;i<k;i++)rocks.push({x:(R()*2-1)*(HW-1.5),s:s+3+(i+R())*len/k,r:0.7+R()*0.5,hit:false});}
    else {feats.push({t:'tilt',s0:s,s1:s+len+6,k:(R()<.5?-1:1)*(0.06+0.06*R()+0.05*lvl)});}
    if(R()<0.62){ // コインの列
      const x0=(R()*2-1)*(HW-2), dx=(R()*2-1)*0.35, m=5+Math.floor(R()*4), s0=s+R()*6;
      for(let i=0;i<m;i++){const x=Math.max(-HW+1,Math.min(HW-1,x0+dx*i));coins.push({x,s:s0+i*2.2,got:false});}
    }
    s+=len+4+R()*8;
  }
  // 速く走れるルートにはごほうびコイン
  feats.filter(f=>f.t==='boost').forEach(f=>{for(let i=0;i<4;i++)coins.push({x:(f.x0+f.x1)/2,s:f.s1+3+i*2.4,got:false});});
  const buckets=new Map();
  const add=(f,s0,s1)=>{for(let b=Math.floor(s0/10);b<=Math.floor(s1/10);b++){if(!buckets.has(b))buckets.set(b,[]);buckets.get(b).push(f);}};
  feats.forEach(f=>add(f,f.s0-1,f.s1+1));
  const near=s=>buckets.get(Math.floor(s/10))||[];
  const base=s=>{
    let h=-3*sstep(3,16,s);
    const k=sstep(18,70,s);
    if(k>0){let w=0;for(const c of comps)w+=c.a*(Math.sin(s*c.f+c.p)-Math.sin(12*c.f+c.p));h+=k*w-grade*Math.max(0,s-12);}
    return h;
  };
  const edge=(x,f,e=.7)=>sstep(f.x0-e,f.x0+e,x)*(1-sstep(f.x1-e,f.x1+e,x))*sstep(f.s0-e,f.s0+e*2,0)*1;
  // 物理用の高さ（でこぼこを含まない）
  const side=(x,s)=>{const d=Math.abs(x)-HW+1;if(d<=0)return 0;return (d<23?0.016*d*d:8.46+0.25*(d-23))+Math.sin(x*.23+s*.17)*Math.min(d,8)*.12;};
  const hs=(x,s)=>{
    let h=base(s)+side(x,s);
    for(const f of near(s)){
      if(f.t==='tilt'){const w=sstep(f.s0,f.s0+6,s)*(1-sstep(f.s1-6,f.s1,s));h+=f.k*Math.max(-HW,Math.min(HW,x))*w;}
      else if(f.t==='ramp'&&s>=f.s0&&s<=f.s1+0.6){const e=sstep(f.x0-.4,f.x0+.2,x)*(1-sstep(f.x1-.2,f.x1+.4,x));
        const up=s<=f.s1?(s-f.s0)/(f.s1-f.s0):1-(s-f.s1)/0.6;h+=f.h*up*e;}
    }
    return h;
  };
  // でこぼこの量 (0..amp)
  const rough=(x,s)=>{let a=0;for(const f of near(s))if(f.t==='bump'&&s>f.s0&&s<f.s1){const e=sstep(f.x0-.6,f.x0+.6,x)*(1-sstep(f.x1-.6,f.x1+.6,x))*sstep(f.s0,f.s0+2,s)*(1-sstep(f.s1-2,f.s1,s));a=Math.max(a,f.amp*e);}return a;};
  const bumpH=(x,s)=>{const a=rough(x,s);return a?a*Math.sin(x*1.35)*Math.sin(s*0.95):0;};
  const hv=(x,s)=>hs(x,s)+bumpH(x,s);
  const surf=(x,s)=>{if(Math.abs(x)>HW)return 'grass';for(const f of near(s)){if(s<f.s0||s>f.s1||x<f.x0||x>f.x1)continue;if(f.t==='mud')return 'mud';if(f.t==='boost')return 'boost';if(f.t==='ramp')return 'ramp';}return '';};
  return {n,info,th,goal,L,feats,coins,rocks,hs,hv,rough,surf,near,side};
}

/* ================= 物理 ================= */
function newRun(course,st,aim,pull){
  return {x:aim*2.2, s:2, y:course.hs(0,2), vy:0, v:st.v0*pull, vx:aim*2.5, air:false, t:0, stopT:0, coins:0, coinVal:0,
          done:false, cleared:false, steer:0, lastHit:-99, onBoost:false, events:[], jumpT:0, jumpReq:0, airT:0, airs:0, jumped:false, maxV:0};
}
function step(R,C,st,dt){
  const g=C.th.g;
  if(R.done)return;
  R.t+=dt;
  if(R.jumpReq>0)R.jumpReq-=dt;
  if(!R.air){if(R.jumpT>0)R.jumpT-=dt;
    if(R.jumpReq>0&&R.jumpT<=0&&R.v>1){R.jumpReq=0;R.air=true;R.jumped=true;R.airT=0;R.vy=Math.max(R.vy,0)+st.jumpV*Math.sqrt(g/9.8);R.y+=0.02;R.jumpT=st.jumpCd;R.events.push('jump');}}
  else R.airT+=dt;
  const sf=C.surf(R.x,R.s);
  if(!R.air){
    const sl=(C.hs(R.x,R.s+0.4)-C.hs(R.x,R.s-0.4))/0.8;
    const hx=(C.hs(R.x+0.3,R.s)-C.hs(R.x-0.3,R.s))/0.6;
    let a=-g*sl/Math.sqrt(1+sl*sl);
    const crr=(sf==='mud'?st.mud:sf==='grass'?st.crr*1.8+0.012:st.crr)*C.th.crr;
    a-=g*crr*Math.sign(R.v);
    const ro=C.rough(R.x,R.s);
    if(ro>0)a-=ro*st.bump*R.v;
    if(sf==='boost'){a+=30;if(!R.onBoost){R.onBoost=true;R.events.push('boost');}}else R.onBoost=false;
    if(sf==='mud'&&R.v>2&&Math.random()<dt*3)R.events.push('mud');
    a-=st.drag*R.v*Math.abs(R.v);
    R.v+=a*dt;
    const tgt=R.steer*st.steer*Math.min(1,Math.max(0,R.v)/4);
    R.vx+=(tgt-R.vx)*Math.min(1,dt*6*C.th.grip);
    R.vx-=g*hx*0.55*dt;
  }else{
    R.v-=st.drag*R.v*Math.abs(R.v)*dt;
    R.vy-=g*dt;
    const tgt=R.steer*st.steer*0.5;R.vx+=(tgt-R.vx)*Math.min(1,dt*2);
  }
  R.s+=R.v*dt; R.x+=R.vx*dt;
  if(Math.abs(R.x)>XMAX){R.x=Math.sign(R.x)*XMAX;R.vx=0;}
  const ny=C.hs(R.x,R.s);
  if(!R.air){
    const vyg=(ny-R.y)/dt;
    if(vyg < R.vy - g*dt*1.6 && R.v>4){R.air=true;R.airT=0;R.jumped=false;R.y+=R.vy*dt;}
    else {R.vy=vyg;R.y=ny;}
  }else{
    R.y+=R.vy*dt;
    if(R.y<=ny){const sl=(C.hs(R.x,R.s+0.4)-C.hs(R.x,R.s-0.4))/0.8;const imp=Math.max(0,-(R.vy - sl*R.v));
      R.v*=1-Math.min(0.35,imp*st.land);R.y=ny;R.vy=sl*R.v;R.air=false;R.events.push(imp>4?'land2':'land');
      if(R.airT>0.9){R.airs++;R.events.push('nice');}R.airT=0;}
  }
  // 岩
  if(R.y-ny<0.8)for(const k of C.rocks){if(Math.abs(k.s-R.s)>2.5)continue;const dx=R.x-k.x,ds=R.s-k.s;
    if(!k.hit && dx*dx+ds*ds<(k.r+0.9)**2){R.lastHit=R.t;R.v*=0.78;R.vx=Math.sign(dx||1)*4;k.hit=true;k.hitS=R.s;R.events.push('rock');}}
  // コイン
  for(const c of C.coins){if(c.got||Math.abs(c.s-R.s)>st.magnet+1)continue;const dx=R.x-c.x,ds=R.s-c.s;
    if(dx*dx+ds*ds<st.magnet*st.magnet && Math.abs(R.y+0.8-(C.hs(c.x,c.s)+1.1))<2.2){c.got=true;R.coins++;R.events.push('coin');}}
  if(R.v>R.maxV)R.maxV=R.v;
  if(!R.cleared&&R.s>=C.goal){R.cleared=true;R.events.push('goal');}
  if(R.s>=C.L-8){R.s=C.L-8;R.v=0;}
  if(!R.air&&R.v<0.35){R.stopT+=dt;if(R.stopT>0.5||R.v<=0){R.done=true;R.v=Math.max(0,R.v);}}else R.stopT=0;
}
// 自動運転（調整・デモ用）: 前方を見て通りやすい位置へ寄せる
function autoSteer(R,C,skill=1,rnd=Math.random){
  let best=R.x,bv=-1e9;
  for(let x=-HW-4;x<=HW+4;x+=0.5){
    let v=-Math.abs(x-R.x)*0.15-(Math.abs(x)>HW-0.5?2.5:0);
    const LA=Math.max(26,R.v*1.6);for(let d=4;d<=LA;d+=LA/12){const s=R.s+d;const sf=C.surf(x,s);if(sf==='mud')v-=3;if(sf==='boost')v+=4;if(sf==='ramp')v+=0.5;v-=C.rough(x,s)*4;
      for(const k of C.rocks)if(Math.abs(k.s-s)<1&&Math.abs(k.x-x)<k.r+1.2)v-=12;
      for(const c of C.coins)if(!c.got&&Math.abs(c.s-s)<1&&Math.abs(c.x-x)<1.2)v+=1.2;}
    v+=(rnd()-0.5)*(1-skill)*20;
    if(v>bv){bv=v;best=x;}
  }
  R.steer=Math.max(-1,Math.min(1,(best-R.x)*0.8));
  if(!R.air&&R.jumpT<=0){const d0=R.v*0.22,d1=R.v*0.4;let bad=false;
    for(let d=d0;d<=d1;d+=1){const s=R.s+d;const sf=C.surf(R.x,s);if(sf==='mud'||C.rough(R.x,s)>0.2)bad=true;
      for(const k of C.rocks)if(!k.hit&&Math.abs(k.s-s)<1&&Math.abs(k.x-R.x)<k.r+1)bad=true;}
    if(bad)R.jumpReq=0.15;}
}

// ゴール距離: 目安の強化レベルで自動運転したときの距離から決める
const GOALS=[300,450,600,780,950,1150,1350,1600,1850,2100,2400,2750,3100];
const SEEDV=[13,6,4,13,15,1,1,20,9,7,20,13,0];
const lvTarget=n=>Math.min(25,Math.round(1.7*(n-1)));
function calibrate(n){
  const lv=lvTarget(n),up={};UPS.forEach(u=>up[u.id]=lv);const st=stats(up);const ds=[];
  for(let k=0;k<5;k++){const C=makeCourse(n,5000);const rnd=rng(n*101+k);const R=newRun(C,st,0,0.95);let t=0,i=0;
    while(!R.done&&t<240){if((i++)%6===0)autoSteer(R,C,0.85,rnd);step(R,C,st,1/120);t+=1/120;}ds.push(R.s);}
  ds.sort((a,b)=>a-b);return Math.max(80,Math.round(ds[2]*0.9/10)*10);
}

/* ================= お金 ================= */
function payout(C,R,firstClear){
  const rate=1+0.18*(C.n-1);
  const dist=Math.floor(Math.min(R.s,C.L)*rate);
  const coin=Math.round(R.coins*(4+1.5*C.n)*stats().coinMul);
  const clear=R.cleared?(firstClear?120*C.n:40*C.n):0;
  const air=R.airs*(10+4*C.n);
  return {dist,coin,clear,air,total:dist+coin+clear+air};
}

let AC=null;
function snd(type){
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    const P={coin:[880,1320,.08,'square',.05],buy:[520,1040,.12,'triangle',.12],launch:[180,520,.3,'sawtooth',.06],boost:[300,900,.25,'sawtooth',.06],
      rock:[160,60,.18,'square',.09],goal:[660,1320,.4,'triangle',.12],land:[120,70,.1,'sine',.15],evo:[440,1760,.7,'triangle',.12],jump:[400,1100,.18,'triangle',.1],ng:[200,150,.12,'square',.05]}[type];
    if(!P)return;o.type=P[3];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);
    g.gain.setValueAtTime(P[4],t);g.gain.exponentialRampToValueAtTime(0.001,t+P[2]+.05);o.start(t);o.stop(t+P[2]+.06);
  }catch(e){}
}

}
// 2D の重ね描き: スピード線と画面のふち
const lines=[];for(let i=0;i<70;i++)lines.push({a:Math.random()*6.28,r:Math.random(),l:.08+Math.random()*.15,w:1+Math.random()*2.5});
function drawFx(dt,v,boost){const W=fxc.width,H=fxc.height;fx.clearRect(0,0,W,H);
  if(flashA>0){flashA=Math.max(0,flashA-dt*2.2);}flashEl.style.opacity=flashA.toFixed(3);
  if(mode!=='drive'&&mode!=='result')return;
  const k=Math.min(1,Math.max(0,(v-18)/28))+(boost?0.5:0);if(k<=0.02)return;
  const cx=W/2,cy=H*0.42,R0=Math.hypot(W,H)*0.5;
  fx.lineCap='round';
  for(const L of lines){L.r+=dt*(0.6+v*0.04)*(0.5+L.l*4);if(L.r>1){L.r=0.25+Math.random()*0.2;L.a=Math.random()*6.28;}
    const r1=L.r*R0,r2=(L.r+L.l*(0.5+k))*R0;const c=Math.cos(L.a),s=Math.sin(L.a);
    fx.strokeStyle=boost?`rgba(255,${190+Math.random()*50|0},90,${0.55*Math.min(1,k)})`:`rgba(255,255,255,${0.45*Math.min(1,k)})`;fx.lineWidth=L.w*(0.6+k);
    fx.beginPath();fx.moveTo(cx+c*r1,cy+s*r1*0.8);fx.lineTo(cx+c*r2,cy+s*r2*0.8);fx.stroke();}
  const g=fx.createRadialGradient(cx,cy,R0*0.45,cx,cy,R0);g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,boost?`rgba(255,120,30,${0.35*Math.min(1,k)})`:`rgba(20,30,60,${0.22*Math.min(1,k)})`);fx.fillStyle=g;fx.fillRect(0,0,W,H);
}

/* ================= 調整用（?sim=1） ================= */
function simulate(opts={}){
  // 自動プレイで「何回の挑戦で何ステージ進めるか」を調べる
  const save0=JSON.stringify(S);S=fresh();
  const log=[];let runs=0;const skill=opts.skill??0.8;
  while(runs<(opts.runs||200)&&S.unlocked<=(opts.stages||12)){
    const n=S.unlocked;const C=makeCourse(n);const st=stats();
    const R=newRun(C,st,(Math.random()-.5)*.6,0.85+Math.random()*0.15);
    let t=0;while(!R.done&&t<200){if(((t*120)|0)%6===0)autoSteer(R,C,skill);step(R,C,st,1/120);t+=1/120;}
    const first=R.cleared&&!S.cleared[n];const p=payout(C,R,first);S.money+=p.total;runs++;
    if(R.cleared){S.cleared[n]=true;S.unlocked=n+1;log.push({stage:n,runs,goal:C.goal,dist:Math.round(R.s),lv:totalLv(),form:formOf(),money:S.money});}
    // 一番安い強化を買えるだけ買う
    for(;;){let best=null,bc=1e18;for(const u of UPS){if(S.up[u.id]>=MAXLV)continue;const c=costOf(u.id,S.up[u.id])*(u.id==='magnet'?1.6:u.id==='handle'?1.3:1);if(c<bc){bc=c;best=u.id;}}
      if(!best||S.money<costOf(best,S.up[best]))break;S.money-=costOf(best,S.up[best]);S.up[best]++;}
    if(opts.verbose)console.log(n,Math.round(R.s),C.goal,R.cleared,totalLv());
  }
  const out={log,runs,final:{...S.up},lv:totalLv(),form:formOf()};S=JSON.parse(save0);return out;
}
window.__cal=calibrate;window.__sim=simulate;window.__step=step;window.__as=autoSteer;window.__makeCourse=makeCourse;window.__stats=stats;
window.__state=()=>({mode,run,S});
window.__start=n=>startStage(n);

load();
const qs=new URLSearchParams(location.search);
if(qs.has('reset')){S=fresh();save();}
if(qs.has('money')){S.money=+qs.get('money');}
if(qs.has('lv')){const v=+qs.get('lv');UPS.forEach(u=>S.up[u.id]=v);}
if(qs.has('stage')){const n=+qs.get('stage');S.unlocked=Math.max(S.unlocked,n);S.sel=n;}
if(qs.has('auto'))window.__auto=true;
goMap();
requestAnimationFrame(frame);
document.title=document.title;window.__ready=true;
</script>
