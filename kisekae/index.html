<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ee">
<title>きせかえドレッサー — 女の子も男の子も着せかえ</title>
<meta name="description" content="肌の色・髪型・髪の色・服・スカート・上着・アクセサリー・目・目の色・鼻・口・靴をえらんで着せかえ。女の子と男の子を切りかえられる。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23ffe3ee'/><path d='M10 9 L16 13 L22 9 L25 14 L21 16 L21 27 L11 27 L11 16 L7 14 Z' fill='%23ff5c8a' stroke='%23c23a66' stroke-width='1.5' stroke-linejoin='round'/><circle cx='16' cy='18' r='1.4' fill='%23fff'/><circle cx='16' cy='22' r='1.4' fill='%23fff'/></svg>">
<style>
  :root{
    --bg:#fff0f6;
    --panel:#ffffff;
    --ink:#3b2a33;
    --muted:#8a6f7c;
    --line:#f3d6e3;
    --soft:#fff5f9;
    --accent:#ff5c8a;
    --accent-dark:#c23a66;
    --boy:#3d7fd9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;cursor:pointer;}
  .app{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(340px,480px);
    height:100dvh;
  }
  /* ---- 人形 ---- */
  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:12px 16px 16px;
    min-height:0;
  }
  .top-links{
    position:absolute;left:14px;top:10px;
    display:flex;align-items:center;gap:10px;z-index:3;
  }
  .top-links a{
    font-size:13px;color:var(--accent-dark);text-decoration:none;
    background:rgba(255,255,255,.85);border:2px solid var(--line);
    border-radius:999px;padding:4px 12px;font-weight:bold;
  }
  .doll-box{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    display:flex;
    justify-content:center;
  }
  #doll{
    height:100%;width:auto;max-width:100%;display:block;aspect-ratio:300/530;
    border-radius:26px;
    box-shadow:0 14px 34px rgba(160,60,100,.18);
    background:#fff;
  }
  .doll-box.pop #doll{animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
  .spark{
    position:absolute;pointer-events:none;color:#ffd84d;
    text-shadow:0 0 6px #fff,0 0 12px #ffe98a;
    font-size:22px;animation:spark .8s ease-out forwards;
  }
  @keyframes spark{
    0%{opacity:0;transform:scale(.2) rotate(0)}
    30%{opacity:1;transform:scale(1.2) rotate(30deg)}
    100%{opacity:0;transform:scale(.6) rotate(90deg) translateY(-10px)}
  }
  /* ---- パネル ---- */
  .panel{
    background:var(--panel);
    border-left:2px solid var(--line);
    display:flex;flex-direction:column;
    min-height:0;
  }
  .panel-head{
    padding:12px 14px 8px;
    border-bottom:2px solid var(--line);
    display:flex;flex-direction:column;gap:10px;
  }
  h1{margin:0;font-size:20px;letter-spacing:.02em;}
  h1 span{color:var(--accent);}
  .kind{
    display:grid;grid-template-columns:1fr 1fr;
    background:#f7eef3;border-radius:14px;padding:4px;gap:4px;
  }
  .kind button{
    border:0;border-radius:11px;padding:8px 6px;background:transparent;
    font-weight:bold;font-size:15px;color:var(--muted);
  }
  .kind button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 3px 8px rgba(255,92,138,.35);}
  .kind button.boy[aria-pressed="true"]{background:var(--boy);box-shadow:0 3px 8px rgba(61,127,217,.35);}
  .actions{display:flex;gap:6px;flex-wrap:wrap;}
  .actions button{
    flex:1 1 auto;
    border:2px solid #ffc2d8;background:#ffe9f1;border-radius:999px;
    padding:6px 10px;font-weight:bold;font-size:13px;white-space:nowrap;
  }
  .actions button:disabled{opacity:.4;cursor:default;}
  .actions button:not(:disabled):active{transform:translateY(1px);}
  .tabs{
    display:flex;flex-wrap:wrap;gap:6px;
    padding:10px 14px;border-bottom:2px solid var(--line);
  }
  .tab{
    border:2px solid transparent;background:#f7eef3;border-radius:12px;
    padding:6px 9px;font-size:13px;font-weight:bold;white-space:nowrap;
  }
  .tab[aria-selected="true"]{background:var(--accent);color:#fff;}
  .body.boy .tab[aria-selected="true"]{background:var(--boy);}
  .scroll{overflow-y:auto;padding:12px 14px 20px;flex:1;min-height:0;}
  .hint{margin:0 0 10px;font-size:12.5px;color:var(--muted);}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(92px,1fr));
    gap:8px;
  }
  .opt{
    border:3px solid #f3dbe6;background:var(--soft);border-radius:16px;
    padding:4px 4px 3px;text-align:center;font-size:12px;font-weight:bold;
    display:flex;flex-direction:column;align-items:center;gap:1px;
  }
  .opt svg{width:100%;aspect-ratio:1;display:block;border-radius:10px;}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px #ffd0e0;}
  .body.boy .opt[aria-pressed="true"]{border-color:var(--boy);box-shadow:0 0 0 3px #cfe0fb;}
  .opt:active{transform:scale(.97);}
  .pal-title{margin:16px 0 8px;font-size:14px;font-weight:bold;}
  .pal{display:flex;flex-wrap:wrap;gap:8px;}
  .sw{
    width:34px;height:34px;border-radius:50%;
    border:3px solid #fff;box-shadow:0 0 0 1.5px #d8c0cc;padding:0;
  }
  .sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent);}
  .body.boy .sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--boy);}

  @media (max-width:760px){
    .app{grid-template-columns:minmax(0,1fr);grid-template-rows:44dvh minmax(0,1fr);}
    .stage{padding:8px 10px 8px;}
    .panel{border-left:0;border-top:2px solid var(--line);}
    .panel-head{padding:10px 12px 8px;gap:8px;}
    h1{display:none;}
    .tabs{flex-wrap:nowrap;overflow-x:auto;padding:8px 12px;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .scroll{padding:10px 12px 18px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));}
    .actions button{font-size:12px;padding:5px 8px;}
  }
  @media (prefers-reduced-motion:reduce){
    .doll-box.pop #doll,.spark{animation:none;}
    .spark{display:none;}
  }
</style>
</head>
<body class="body">
<div class="app">
  <section class="stage">
    <div class="top-links"><a href="../">← ゲームいちらん</a></div>
    <div class="doll-box" id="dollBox">
      <svg id="doll" viewBox="0 0 300 530" role="img" aria-label="きせかえ人形"></svg>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h1>きせかえ<span>ドレッサー</span></h1>
      <div class="kind" role="group" aria-label="女の子か男の子か">
        <button type="button" class="girl" data-kind="girl">👧 おんなのこ</button>
        <button type="button" class="boy" data-kind="boy">👦 おとこのこ</button>
      </div>
      <div class="actions">
        <button type="button" id="btnRandom">🎲 おまかせ</button>
        <button type="button" id="btnUndo">↶ もどす</button>
        <button type="button" id="btnSave">📷 ほぞん</button>
        <button type="button" id="btnReset">⟲ はじめから</button>
      </div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="scroll" id="scroll">
      <p class="hint" id="hint"></p>
      <div class="grid" id="grid"></div>
      <div id="palWrap"></div>
    </div>
  </section>
</div>

<script>
'use strict';

/* ================= いろの道具 ================= */
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');}
function shade(h,a){const[r,g,b]=hex2rgb(h);return rgb2hex(r*(1-a),g*(1-a),b*(1-a));}
function tint(h,a){const[r,g,b]=hex2rgb(h);return rgb2hex(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a);}
function lum(h){const[r,g,b]=hex2rgb(h);return(0.299*r+0.587*g+0.114*b)/255;}
const ol=c=>shade(c,.38);
const pop=c=>lum(c)>.62?'#ff5c8a':'#ffffff';

/* ================= SVG の道具 ================= */
const P=(d,f,s,w=2,x='')=>`<path d="${d}" fill="${f}"${s?` stroke="${s}" stroke-width="${w}" stroke-linejoin="round"`:''} ${x}/>`;
const L=(d,s,w=2,x='')=>`<path d="${d}" fill="none" stroke="${s}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${x}/>`;
const C=(cx,cy,r,f,s,w=2,x='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"${s?` stroke="${s}" stroke-width="${w}"`:''} ${x}/>`;
const E=(cx,cy,rx,ry,f,s,w=2,x='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}"${s?` stroke="${s}" stroke-width="${w}"`:''} ${x}/>`;
const mir=g=>`<g transform="translate(300 0) scale(-1 1)">${g}</g>`;
const both=g=>g+mir(g);
function star(cx,cy,r,ri=r*.45,n=5){let d='';for(let k=0;k<n*2;k++){const a=-Math.PI/2+k*Math.PI/n,rr=k%2?ri:r;d+=(k?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1);}return d+'Z';}
function heart(x,y,s){return`M${x},${y-.3*s} C${x},${y-.9*s} ${x-s},${y-.9*s} ${x-s},${y-.35*s} C${x-s},${y+.15*s} ${x-.3*s},${y+.45*s} ${x},${y+.8*s} C${x+.3*s},${y+.45*s} ${x+s},${y+.15*s} ${x+s},${y-.35*s} C${x+s},${y-.9*s} ${x},${y-.9*s} ${x},${y-.3*s} Z`;}
function rng(seed){return()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};}

/* うで：pathLength=100 の線。len で袖の長さ（肩からの割合）を決める */
const ARMS=['M106,232 Q86,290 84,350','M194,232 Q214,290 216,350'];
function armS(color,w,len,start=0,cap='round'){
  let da='';
  if(len!=null) da=start?` stroke-dasharray="0 ${start} ${len} 300"`:` stroke-dasharray="${len} 300"`;
  return ARMS.map(d=>`<path d="${d}" pathLength="100" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="${cap}"${da}/>`).join('');
}
const sleeves=(c,len,w)=>armS(ol(c),w+4,len)+armS(c,w,len);
const cuff=(c,w,len)=>armS(c,w,5,len-5,'butt');

/* ================= データ ================= */
const PALETTE=[
  ['しろ','#ffffff'],['くろ','#2b2b3a'],['あか','#e8384f'],['ピンク','#ff8fb1'],['うすピンク','#ffd1e1'],
  ['オレンジ','#ffa94d'],['きいろ','#ffe066'],['きみどり','#9ad97a'],['みどり','#3fa66b'],['みずいろ','#8fd3ff'],
  ['あお','#3d7fd9'],['こん','#1f3a6e'],['むらさき','#9b6bdf'],['ベージュ','#e3cba5'],['ちゃいろ','#8a5a3b'],
];
const SKINS=[
  {id:'milk',name:'ミルク',c:'#ffe6d6'},{id:'peach',name:'ピーチ',c:'#f9d2b5'},{id:'honey',name:'はちみつ',c:'#eab58f'},
  {id:'caramel',name:'キャラメル',c:'#c98b5e'},{id:'cocoa',name:'ココア',c:'#9a6340'},{id:'choco',name:'チョコ',c:'#6b4028'},
];
const HAIRC=[
  {id:'black',name:'くろ',c:'#2a2226'},{id:'dark',name:'こげちゃ',c:'#4a2e22'},{id:'choco',name:'ちゃいろ',c:'#8a5530'},
  {id:'gold',name:'きんいろ',c:'#f2c96b'},{id:'red',name:'あか',c:'#c8402e'},{id:'pink',name:'ピンク',c:'#ff8fbf'},
  {id:'aqua',name:'みずいろ',c:'#7fd3f7'},{id:'purple',name:'むらさき',c:'#9a6ad6'},{id:'silver',name:'ぎんいろ',c:'#d9dde6'},
  {id:'green',name:'みどり',c:'#5fbf7f'},
];
const EYEC=[
  {id:'black',name:'くろ',c:'#2b1d1a'},{id:'brown',name:'ちゃいろ',c:'#7a4a2a'},{id:'blue',name:'あお',c:'#2f7fd8'},
  {id:'green',name:'みどり',c:'#2f9e5a'},{id:'purple',name:'むらさき',c:'#8a4fd1'},{id:'red',name:'あか',c:'#d23b4a'},
  {id:'gold',name:'きんいろ',c:'#d9a21b'},{id:'pink',name:'ピンク',c:'#ff6fa8'},{id:'aqua',name:'みずいろ',c:'#3fc6d9'},
];

/* ---------- かみがた ---------- */
const CAP_MID='M84,140 C78,40 222,40 216,140 Q210,170 200,176 L100,176 Q90,170 84,140 Z';
const LONG_BACK='M80,140 C70,34 230,34 220,140 Q230,240 232,330 Q190,344 150,338 Q110,344 68,330 Q70,240 80,140 Z';
const BANGS_STRAIGHT='M86,140 C78,38 222,38 214,140 L210,112 Q200,116 190,110 Q180,116 170,110 Q160,116 150,110 Q140,116 130,110 Q120,116 110,110 Q100,116 90,112 Z';
const BANGS_SOFT='M88,138 C80,42 220,42 212,138 Q206,112 190,104 Q184,118 168,112 Q160,100 150,106 Q138,118 124,108 Q114,104 104,112 Q94,120 88,138 Z';
const hp=(d,H)=>P(d,H.h,H.o);
const ring=H=>L('M112,80 Q150,62 188,80',H.l,5,'opacity=".55"');
const tie=(x,y)=>C(x,y,7,'#ff5c8a','#c23a66');
function cloud(list,H){return list.map(([x,y,r])=>C(x,y,r+2.5,H.o)).join('')+list.map(([x,y,r])=>C(x,y,r,H.h)).join('');}
function braid(H){
  let g='';
  for(let i=0;i<7;i++) g+=E(96,178+i*17,12-i*.5,10.5,H.h,H.o)+L(`M${88+i*.4},${174+i*17} Q96,${182+i*17} ${104-i*.4},${174+i*17}`,H.o,1.5,'opacity=".6"');
  return g+P('M90,300 L102,300 L108,322 L96,314 L84,322 Z',H.h,H.o)+C(96,298,6.5,'#ff5c8a','#c23a66');
}
const HAIRS=[
  {id:'short',name:'ショート',for:'g',back:H=>hp('M84,140 C78,40 222,40 216,140 Q218,170 206,186 L194,160 L106,160 L94,186 Q82,170 84,140 Z',H),
    front:H=>hp(BANGS_SOFT,H)+hp('M90,120 Q84,160 92,182 Q98,160 100,128 Z',H)+hp('M210,120 Q216,160 208,182 Q202,160 200,128 Z',H)+ring(H)},
  {id:'bob',name:'ボブ',for:'g',back:H=>hp('M80,140 C72,36 228,36 220,140 L224,196 Q214,206 200,200 L100,200 Q86,206 76,196 Z',H),
    front:H=>hp(BANGS_STRAIGHT,H)+hp('M88,110 Q80,160 88,200 L104,200 Q96,160 100,112 Z',H)+hp('M212,110 Q220,160 212,200 L196,200 Q204,160 200,112 Z',H)+ring(H)},
  {id:'long',name:'ロング',for:'g',back:H=>hp(LONG_BACK,H),
    front:H=>hp('M86,142 C76,36 224,36 214,142 Q210,112 196,98 Q170,112 140,104 Q112,114 98,130 Q92,134 86,142 Z',H)+hp('M88,118 Q76,200 92,292 Q100,300 108,288 Q96,200 102,130 Z',H)+hp('M212,118 Q224,200 208,292 Q200,300 192,288 Q204,200 198,130 Z',H)+ring(H)},
  {id:'pony',name:'ポニーテール',for:'g',back:H=>hp('M198,78 Q262,96 256,190 Q252,260 222,300 Q226,250 222,210 Q216,160 196,112 Z',H)+hp(CAP_MID,H),
    front:H=>hp('M88,140 C80,40 220,40 212,140 Q208,116 196,104 Q176,112 160,100 Q150,114 132,108 Q112,106 100,120 Q92,128 88,140 Z',H)+ring(H)+tie(204,86)},
  {id:'twin',name:'ツインテール',for:'g',back:H=>hp('M98,92 Q40,110 42,210 Q44,280 78,320 Q72,260 80,210 Q88,150 104,118 Z',H)+hp('M202,92 Q260,110 258,210 Q256,280 222,320 Q228,260 220,210 Q212,150 196,118 Z',H)+hp(CAP_MID,H),
    front:H=>hp(BANGS_STRAIGHT,H)+ring(H)+tie(100,96)+tie(200,96)},
  {id:'odango',name:'おだんご',for:'g',back:H=>[[104,60],[196,60]].map(([x,y])=>C(x,y,24,H.h,H.o)+L(`M${x-12},${y-2} Q${x-4},${y-16} ${x+10},${y-8} M${x-8},${y+8} Q${x+4},${y+12} ${x+12},${y+2}`,H.o,2)).join('')+hp(CAP_MID,H),
    front:H=>hp(BANGS_SOFT,H)+ring(H)},
  {id:'braids',name:'みつあみ',for:'g',back:H=>hp(CAP_MID,H),
    front:H=>hp(BANGS_STRAIGHT,H)+ring(H)+braid(H)+mir(braid(H))},
  {id:'curly',name:'ふわふわ',for:'g',back:H=>cloud([[150,92,64],[92,118,30],[208,118,30],[84,160,28],[216,160,28],[90,200,26],[210,200,26],[108,232,24],[192,232,24],[130,244,22],[170,244,22],[150,248,22],[150,190,60]],H),
    front:H=>hp('M90,128 C82,42 218,42 210,128 Q150,96 90,128 Z',H)+cloud([[100,112,15],[122,100,16],[146,94,17],[170,97,17],[192,105,16],[206,122,12],[94,126,12]],H)},
  {id:'hime',name:'ひめカット',for:'g',back:H=>hp(LONG_BACK,H),
    front:H=>hp(BANGS_STRAIGHT,H)+hp('M88,112 L88,198 L106,198 L104,112 Z',H)+hp('M212,112 L212,198 L194,198 L196,112 Z',H)+ring(H)},
  {id:'bshort',name:'ふつう',for:'b',back:H=>hp('M84,140 C78,40 222,40 216,140 Q216,162 204,168 L96,168 Q84,162 84,140 Z',H),
    front:H=>hp('M88,136 C80,42 220,42 212,136 Q210,120 204,110 L196,118 Q180,100 160,104 L150,96 L140,108 Q120,100 106,114 L98,110 Q92,120 88,136 Z',H)+hp('M90,118 Q86,146 92,160 L98,150 Q96,134 100,124 Z',H)+hp('M210,118 Q214,146 208,160 L202,150 Q204,134 200,124 Z',H)+ring(H)},
  {id:'veryshort',name:'ツンツン',back:H=>hp('M86,136 C80,46 220,46 214,136 Q214,156 206,164 L94,164 Q86,156 86,136 Z',H),
    front:H=>hp('M88,136 C80,44 220,44 212,136 L206,112 L196,120 L188,102 L176,114 L166,98 L154,112 L142,98 L130,112 L120,100 L110,118 L100,108 L94,122 Z',H)+hp('M100,62 L92,40 L116,54 L118,30 L138,50 L148,24 L160,48 L176,28 L182,52 L204,40 L198,64 Z',H)+ring(H)},
  {id:'twoblock',name:'ツーブロック',for:'b',back:H=>hp('M86,136 C80,50 220,50 214,136 Q212,156 204,164 L96,164 Q88,156 86,136 Z',{h:shade(H.h,.18),o:H.o}),
    front:H=>hp('M88,122 C78,26 226,24 214,118 Q202,96 178,94 Q162,108 140,98 Q118,104 104,114 Q96,110 88,122 Z',H)+ring(H)},
  {id:'mash',name:'マッシュ',for:'b',back:H=>hp('M80,136 C74,36 226,36 220,136 Q222,160 214,172 L86,172 Q78,160 80,136 Z',H),
    front:H=>hp('M84,146 C74,32 226,32 216,146 Q214,128 206,118 Q150,104 94,118 Q86,128 84,146 Z',H)+L('M110,112 L112,118 M130,108 L131,115 M150,107 L150,114 M170,108 L169,115 M190,112 L188,118',H.o,1.5,'opacity=".6"')+ring(H)},
  {id:'buzz',name:'ぼうず',for:'b',back:H=>'',
    front:H=>P('M89,128 C86,62 214,62 211,128 Q204,104 150,100 Q96,104 89,128 Z',H.h,H.o,2,'opacity=".9"')},
  {id:'center',name:'センターわけ',for:'b',back:H=>hp('M84,140 C78,40 222,40 216,140 Q218,168 208,184 L92,184 Q82,168 84,140 Z',H),
    front:H=>hp('M88,142 C80,40 220,40 212,142 Q206,112 182,100 Q164,100 154,120 L150,98 L146,120 Q136,100 118,100 Q94,112 88,142 Z',H)+ring(H)},
  {id:'curlyS',name:'くるくる',for:'b',back:H=>cloud([[150,88,60],[96,110,24],[204,110,24],[90,146,20],[210,146,20]],H),
    front:H=>hp('M90,128 C82,44 218,44 210,128 Q150,98 90,128 Z',H)+cloud([[102,110,14],[124,99,15],[148,94,16],[172,97,15],[194,106,14]],H)},
];

/* ---------- め ---------- */
const EYES=[
  {id:'maru',name:'まる'},{id:'kira',name:'キラキラ'},{id:'tare',name:'たれ目'},{id:'tsuri',name:'つり目'},
  {id:'nikko',name:'にっこり'},{id:'wink',name:'ウインク'},{id:'nemui',name:'ねむい'},{id:'pacchiri',name:'ぱっちり'},
  {id:'star',name:'おほしさま'},{id:'ten',name:'てんてん'},
];
function drawEyes(type,col,skin,brow,boy){
  let g='';
  const LC='#3a2418';
  [[126,-1],[174,1]].forEach(([cx,dir],i)=>{
    const cy=142;
    g+=boy?L(`M${cx-11},117 Q${cx},113 ${cx+11},117`,brow,4.2):L(`M${cx-10},118 Q${cx},113 ${cx+10},118`,brow,3);
    const closed=type==='nikko'||(type==='wink'&&i===1);
    if(closed){g+=L(`M${cx-11},${cy+3} Q${cx},${cy-10} ${cx+11},${cy+3}`,LC,3.5);return;}
    if(type==='ten'){g+=E(cx,cy,5,7,LC)+C(cx+2,cy-3,1.8,'#fff');return;}
    const big=type==='kira'||type==='pacchiri';
    g+=E(cx,cy,big?12:10,big?14:12,'#fff');
    if(type==='star'){
      g+=P(star(cx,cy+1,10.5,4.8),col,shade(col,.3),1.2)+C(cx+3,cy-3,2,'#fff');
    }else{
      g+=E(cx,cy+1,big?9.5:8,big?12:10.5,col)+E(cx,cy+6,big?7:6,big?5.5:4.5,tint(col,.35),null,0,'opacity=".7"');
      g+=E(cx,cy+1,4,5.5,shade(col,.6));
      g+=C(cx+3,cy-4,3,'#fff')+C(cx-3,cy+5,1.5,'#fff');
      if(type==='kira') g+=P(star(cx-4,cy-5,3.8,1.2,4),'#fff')+C(cx+4,cy+6,1.2,'#fff');
    }
    let lash=`M${cx-12},${cy-6} Q${cx},${cy-17} ${cx+12},${cy-6}`;
    if(type==='tare') lash=`M${cx-dir*11},${cy-10} Q${cx},${cy-16} ${cx+dir*13},${cy-3}`;
    if(type==='tsuri') lash=`M${cx-dir*11},${cy-4} Q${cx+dir*2},${cy-16} ${cx+dir*13},${cy-12}`;
    if(type==='nemui') g+=P(`M${cx-14},${cy-19} L${cx+14},${cy-19} L${cx+14},${cy-1} Q${cx},${cy+2} ${cx-14},${cy-1} Z`,skin)+L(`M${cx-12},${cy-1} Q${cx},${cy+2} ${cx+12},${cy-1}`,LC,3);
    else g+=L(lash,LC,boy?3:3.5);
    if(!boy&&type!=='nemui'){
      const oy=type==='tare'?cy-3:type==='tsuri'?cy-12:cy-6;
      g+=L(`M${cx+dir*12},${oy} L${cx+dir*16},${oy-4}`,LC,2.5);
      if(type==='pacchiri'||type==='kira') g+=L(`M${cx+dir*7},${cy-13} L${cx+dir*9},${cy-19} M${cx+dir*11},${cy-10} L${cx+dir*16},${cy-15}`,LC,2);
    }
  });
  return g;
}

let UID=0;
const byId=(list,id)=>list.find(o=>o.id===id)||list[0];
function render(kind,s,opt={}){
  const u='u'+(UID++);
  const hide=opt.hide||[];
  const boy=kind==='boy';
  const skin=byId(SKINS,s.skin).c,so=shade(skin,.3);
  const hc=byId(HAIRC,s.hairColor).c;
  const H={h:hc,o:shade(hc,.4),l:tint(hc,.55)};
  const hair=byId(HAIRS,s.hair);
  let top=byId(TOPS,s.top);
  if(hide.includes('bottom')&&top.dress) top=TOPS[0];
  const bottom=byId(BOTTOMS,s.bottom);
  const outer=hide.includes('outer')?OUTERS[0]:byId(OUTERS,s.outer);
  const shoes=byId(SHOES,s.shoes);
  let g='';
  if(!opt.noBg) g+=byId(BGS,s.bg).draw();
  g+=E(150,508,62,8,'#000','',0,'opacity=".12"');
  const noHair=hide.includes('hair');
  if(!noHair) g+=hair.back(H);
  // あし
  g+=P('M118,318 L149,318 L145,490 L127,490 Z',skin,so)+P('M151,318 L182,318 L173,490 L155,490 Z',skin,so);
  g+=E(132,496,13,7,skin,so)+E(168,496,13,7,skin,so);
  if(shoes.draw) g+=both(shoes.draw(s.shoesColor));
  // どう・くび
  g+=P('M110,220 Q150,210 190,220 Q202,225 201,240 L187,300 Q190,318 184,332 L116,332 Q110,318 113,300 L99,240 Q98,225 110,220 Z',skin,so);
  g+=`<rect x="140" y="178" width="20" height="46" fill="${skin}"/>`+L('M140,178 L140,214 M160,178 L160,214',so,2)+E(150,198,16,7,shade(skin,.1));
  // した
  if(!top.dress&&!hide.includes('bottom')){
    g+=bottom.id==='none'?P(bloomers,'#ffffff','#c9c0c4'):bottom.draw(s.bottomColor,u);
  }else if(!top.dress){
    g+=P(bloomers,'#ffffff','#c9c0c4');
  }
  // うえ
  if(outer.hood) g+=outer.hood(s.outerColor);
  const t=top.draw(s.topColor,u);
  g+=t.body;
  if(outer.body) g+=outer.body(s.outerColor);
  g+=armS(so,22)+armS(skin,18);
  g+=t.sleeve;
  if(outer.sleeve) g+=outer.sleeve(s.outerColor);
  g+=C(84,352,10,skin,so)+C(216,352,10,skin,so);
  if(outer.over) g+=outer.over(s.outerColor);
  // あたま
  g+=E(91,140,9,12,skin,so)+E(209,140,9,12,skin,so)+L('M89,134 Q86,142 91,148 M211,134 Q214,142 209,148',so,1.5,'opacity=".6"');
  g+=P('M90,128 C90,64 210,64 210,128 C210,172 184,198 150,198 C116,198 90,172 90,128 Z',skin,so);
  g+=E(116,165,9,5,'#ff8fa3','',0,`opacity="${boy?.22:.45}"`)+E(184,165,9,5,'#ff8fa3','',0,`opacity="${boy?.22:.45}"`);
  g+=drawEyes(s.eyes,byId(EYEC,s.eyeColor).c,skin,shade(hc,.3),boy);
  g+=byId(NOSES,s.nose).draw(skin);
  g+=byId(MOUTHS,s.mouth).draw();
  if(!noHair) g+=hair.front(H);
  // アクセ
  if(!hide.includes('acc')){
    const ctx={H,skin};
    ACCS.filter(a=>a.draw&&s.acc.includes(a.id)).sort((a,b)=>a.z-b.z).forEach(a=>g+=a.draw(ctx));
  }
  return g;
}

const SAVE_KEY='kisekae-v1';
let data={kind:'girl',looks:{girl:clone(DEFAULTS.girl),boy:clone(DEFAULTS.boy)}};
let undoStack=[];
let curTab='hair';

function sanitize(kind,s){
  const d=DEFAULTS[kind],out=clone(d);
  if(!s||typeof s!=='object') return out;
  const pal=PALETTE.map(p=>p[1]);
  CATS.forEach(cat=>{
    if(cat.multi){
      if(Array.isArray(s.acc)) out.acc=s.acc.filter(id=>ACCS.some(a=>a.id===id&&a.draw&&okFor(a,kind)));
    }else{
      const o=cat.list.find(x=>x.id===s[cat.key]);
      if(o&&okFor(o,kind)) out[cat.key]=s[cat.key];
    }
    if(cat.color&&pal.includes(s[cat.color])) out[cat.color]=s[cat.color];
  });
  return out;
}
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(raw&&raw.looks){
      data.kind=raw.kind==='boy'?'boy':'girl';
      data.looks.girl=sanitize('girl',raw.looks.girl);
      data.looks.boy=sanitize('boy',raw.looks.boy);
    }
  }catch(e){}
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}}
const cur=()=>data.looks[data.kind];
function remember(){undoStack.push(JSON.stringify(data));if(undoStack.length>60)undoStack.shift();}

  $('#grid').innerHTML=list.map(o=>{
    let st,on;
    if(cat.multi){st={...s,acc:o.id==='none'?[]:[o.id]};on=o.id==='none'?s.acc.length===0:s.acc.includes(o.id);}
    else{st={...s,[cat.key]:o.id};on=s[cat.key]===o.id;}
    const box=(cat.boxOf&&cat.boxOf(o))||cat.box;
    const hide=cat.multi?[]:(cat.hide||[]);
    const bg=cat.bg?'':'<rect x="-50" y="-50" width="400" height="630" fill="#fff5f9"/>';
    return`<button type="button" class="opt" data-id="${o.id}" aria-pressed="${on}"><svg viewBox="${box}" aria-hidden="true">${bg}${render(kind,st,{noBg:!cat.bg,hide})}</svg>${o.name}</button>`;
  }).join('');
  if(cat.color){
    const c=s[cat.color];
    $('#palWrap').innerHTML=`<div class="pal-title">いろ</div><div class="pal">`+PALETTE.map(([n,h])=>`<button type="button" class="sw" data-color="${h}" style="background:${h}" aria-label="${n}" title="${n}" aria-pressed="${h===c}"></button>`).join('')+'</div>';
  }else $('#palWrap').innerHTML='';
}
function drawKind(){
  document.querySelectorAll('.kind button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.kind===data.kind));
  document.body.classList.toggle('boy',data.kind==='boy');
  $('#btnUndo').disabled=undoStack.length===0;
}
function refresh(sparkle){save();drawKind();drawTabs();drawPanel();drawDoll(sparkle);}

/* ---- そうさ ---- */
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  curTab=b.dataset.key;drawTabs();drawPanel();$('#scroll').scrollTop=0;
});
$('#grid').addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b)return;
  const cat=CATS.find(c=>c.key===curTab),s=cur(),id=b.dataset.id;
  remember();
  if(cat.multi){
    if(id==='none') s.acc=[];
    else s.acc=s.acc.includes(id)?s.acc.filter(x=>x!==id):[...s.acc,id];
  }else{
    if(s[cat.key]===id){undoStack.pop();return;}
    s[cat.key]=id;
  }
  const y=$('#scroll').scrollTop;refresh(true);$('#scroll').scrollTop=y;
});
$('#palWrap').addEventListener('click',e=>{
  const b=e.target.closest('.sw');if(!b)return;
  const cat=CATS.find(c=>c.key===curTab),s=cur();
  if(s[cat.color]===b.dataset.color)return;
  remember();s[cat.color]=b.dataset.color;
  const y=$('#scroll').scrollTop;refresh(true);$('#scroll').scrollTop=y;
});
document.querySelector('.kind').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.dataset.kind===data.kind)return;
  remember();data.kind=b.dataset.kind;refresh(true);
});
$('#btnUndo').addEventListener('click',()=>{
  if(!undoStack.length)return;
  data=JSON.parse(undoStack.pop());refresh(true);
});
$('#btnReset').addEventListener('click',()=>{
  remember();data.looks[data.kind]=clone(DEFAULTS[data.kind]);refresh(true);
});
const ACC_GROUP={kachusha:'head',tiara:'head',mugiwara:'head',beret:'head',cap:'head',headphones:'head',flower:'head',nekomimi:'head',
  glasses:'eye',sunglasses:'eye',heartsun:'eye',pochette:'bag',backpack:'bag',necklace:'neck',scarf:'neck'};
$('#btnRandom').addEventListener('click',()=>{
  remember();
  const kind=data.kind,s=cur(),pick=a=>a[Math.floor(Math.random()*a.length)];
  CATS.forEach(cat=>{
    const list=cat.list.filter(o=>okFor(o,kind)&&o.id!=='none');
    if(cat.multi){
      const n=Math.floor(Math.random()*3),got=[],used=new Set();
      for(let i=0;i<10&&got.length<n;i++){const a=pick(list),gp=ACC_GROUP[a.id]||a.id;if(!used.has(gp)){used.add(gp);got.push(a.id);}}
      s.acc=got;
    }else if(cat.key==='outer'||cat.key==='shoes'){
      s[cat.key]=Math.random()<.35?'none':pick(list).id;
    }else if(cat.key==='nose'){
      s.nose=pick(list).id;
    }else s[cat.key]=pick(list).id;
    if(cat.color) s[cat.color]=pick(PALETTE)[1];
  });
  refresh(true);
});
$('#btnSave').addEventListener('click',()=>{
  const W=600,Hh=1060;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 530" width="${W}" height="${Hh}">${render(data.kind,cur())}</svg>`;
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas');cv.width=W;cv.height=Hh;
    cv.getContext('2d').drawImage(img,0,0,W,Hh);
    cv.toBlob(b=>{
      if(!b)return;
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kisekae.png';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    },'image/png');
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
});

load();
refresh(false);
</script>
</body>
</html>
